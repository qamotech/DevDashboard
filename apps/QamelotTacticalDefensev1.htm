<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPTKA: Tactical Defense</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body, html {
            margin: 0; padding: 0;
            background-color: #060913;
            color: #d0e0ff;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Safe margin container that scales perfectly */
        #app-container {
            width: 98vw;
            height: 98vh;
            max-width: 1400px;
            background-color: rgba(13, 20, 35, 0.85);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 0 2px #00d2ff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }
        
        #app-container.fast-forward {
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 15px 4px #00ff66;
        }

        /* --- TOP BAR --- */
        #top-bar {
            height: 50px; min-height: 50px;
            background: linear-gradient(90deg, #111122, #0b0f19, #111122);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; border-bottom: 2px solid #00ff66;
            z-index: 10;
        }

        .stat-group { display: flex; gap: 15px; align-items: center; }
        .stat { font-size: 15px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);}
        .stat-icon { font-size: 16px; }
        .c-red { color: #ff3366; text-shadow: 0 0 8px #ff3366;} 
        .c-gold { color: #ffd700; text-shadow: 0 0 8px #ffd700;} 
        .c-cyan { color: #00ffff; }

        .ctrl-btn {
            background: linear-gradient(180deg, #2a2a40, #111122); border: 1px solid #4a5568; color: #fff;
            padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
            text-shadow: 0 1px 2px #000;
        }
        .ctrl-btn:hover { background: #3a3a5a; border-color: #00ff66; }
        .ctrl-btn.active { background: linear-gradient(180deg, #00ff66, #008833); border-color: #00ff66; box-shadow: 0 0 10px #00ff66; }

        /* --- GAME CANVAS AREA --- */
        #canvas-wrapper {
            flex-grow: 1;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a1025 0%, #08050e 100%);
            position: relative; overflow: hidden;
            border-bottom: 2px solid #4a5568;
        }

        #game-canvas {
            max-width: 100%; max-height: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0,0,0,0.8) inset;
        }
        
        #boss-warning {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            color: #ff3366; font-size: 36px; font-weight: 900; letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }

        /* --- BOTTOM PANEL --- */
        #bottom-panel {
            height: 100px; min-height: 100px;
            background: linear-gradient(to bottom, #161625, #080812);
            display: flex; padding: 10px; gap: 10px;
        }

        .panel-section { display: flex; gap: 10px; flex-grow: 1; justify-content: center; }

        /* Shop Buttons */
        .shop-btn {
            flex: 1; max-width: 95px;
            background: linear-gradient(135deg, #1f1f33, #0a0a14); border: 2px solid #33334d; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: 0.2s;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 4px 6px rgba(0,0,0,0.5);
        }
        .shop-btn:hover { border-color: #00ffff; background: linear-gradient(135deg, #2a2a44, #111122); transform: translateY(-2px); }
        .shop-btn.selected { border-color: #00ffff; background: linear-gradient(135deg, #224455, #001122); box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .shop-btn.disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        
        .preview-cvs { width: 50px; height: 50px; pointer-events: none; }
        .shop-lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; margin-top: 2px; text-transform: uppercase; color: #aab; pointer-events: none; }
        .shop-cost { font-size: 12px; font-weight: 900; color: #ffd700; pointer-events: none; text-shadow: 0 0 5px rgba(255,215,0,0.5);}

        /* Action Buttons */
        .action-container { display: flex; flex-direction: column; gap: 5px; min-width: 130px; }
        .big-btn {
            flex-grow: 1; background: linear-gradient(135deg, #0088aa, #004466); border: 1px solid #00ffff;
            border-radius: 8px; color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; text-shadow: 0 2px 2px rgba(0,0,0,0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); letter-spacing: 1px;
        }
        .big-btn:hover { background: linear-gradient(135deg, #00aacc, #006688); box-shadow: 0 0 15px #00ffff; }
        .big-btn:disabled { background: #223; border-color: #445; color: #667; cursor: not-allowed; box-shadow: none; }

        /* Upgrade Panel (Hidden by default) */
        #upgrade-ui { display: none; width: 100%; gap: 15px; align-items: center; justify-content: space-between; padding: 0 20px;}
        .upg-info { font-size: 12px; color: #bac; line-height: 1.6; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 8px; border: 1px solid #334; }
        .upg-info h3 { margin: 0 0 4px 0; color: #00ffff; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px #00ffff;}
        .hl { color: #fff; font-weight: bold; }
        
        .upg-btn { background: linear-gradient(180deg, #cc8800, #885500); border: 1px solid #ffd700; border-radius: 6px; padding: 8px 15px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .upg-btn:hover { background: linear-gradient(180deg, #ffaa00, #aa6600); box-shadow: 0 0 10px #ffd700;}
        .upg-btn:disabled { background: #443; border-color: #665; color: #887; cursor: not-allowed; box-shadow: none;}
        
        .sell-btn { background: linear-gradient(180deg, #cc0033, #660011); border: 1px solid #ff3366; border-radius: 6px; padding: 8px 15px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .sell-btn:hover { background: linear-gradient(180deg, #ff1a55, #990022); box-shadow: 0 0 10px #ff3366;}
        
        .tgt-btn { background: linear-gradient(180deg, #334, #112); border: 1px solid #556; border-radius: 6px; padding: 8px; color: #fff; cursor: pointer; font-size: 11px; font-weight:bold;}
        .tgt-btn:hover { background: linear-gradient(180deg, #445, #223); border-color:#0ff;}

        /* Game Over */
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #game-over h1 { color: #ff3366; font-size: 46px; text-shadow: 0 0 20px #ff3366; margin: 0 0 10px 0; letter-spacing: 3px;}
        #game-over p { font-size: 20px; margin-bottom: 30px; font-weight: bold;}
        .retry-btn { background: linear-gradient(135deg, #00ffff, #0088cc); color: #000; border: none; padding: 15px 40px; font-size: 20px; font-weight: 900; border-radius: 8px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,255,0.5);}
        .retry-btn:hover { background: linear-gradient(135deg, #ffffff, #00ffff); box-shadow: 0 0 30px #00ffff; transform: scale(1.05); }

        @media (max-width: 700px) {
            .shop-btn { max-width: 65px; }
            .preview-cvs { width: 36px; height: 36px; }
            .shop-lbl { font-size: 8px; }
            .shop-cost { font-size: 10px; }
            .big-btn { font-size: 12px; }
            .upg-info h3 { font-size: 14px; }
            .upg-info { font-size: 10px; padding: 5px 10px;}
            #upgrade-ui { padding: 0 5px; gap: 8px;}
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="top-bar">
        <div class="stat-group">
            <div class="stat"><span class="stat-icon c-red">❤</span> <span id="ui-lives">25</span></div>
            <div class="stat"><span class="stat-icon c-gold">⚡</span> $<span id="ui-gold">600</span></div>
            <div class="stat"><span class="stat-icon c-cyan">⚓</span> W: <span id="ui-wave">0</span></div>
        </div>
        <div class="stat-group">
            <button class="ctrl-btn" id="btn-pause">PAUSE</button>
            <button class="ctrl-btn" id="btn-spd-1">1X</button>
            <button class="ctrl-btn" id="btn-spd-2">2X</button>
            <button class="ctrl-btn" id="btn-spd-4">4X</button>
        </div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="boss-warning">BOSS IMMINENT</div>
        <div id="game-over">
            <h1>CORE COMPROMISED</h1>
            <p>Defenses breached on Wave <span id="go-wave">0</span></p>
            <button class="retry-btn" onclick="resetGame()">DEPLOY AGAIN</button>
        </div>
    </div>

    <div id="bottom-panel">
        <div id="shop-ui" class="panel-section">
            <div class="shop-btn" id="shop-b" data-type="b" onclick="selectTower('b')">
                <canvas class="preview-cvs" id="prev-b"></canvas>
                <div class="shop-lbl">Panther</div><div class="shop-cost">$100</div>
            </div>
            <div class="shop-btn" id="shop-p" data-type="p" onclick="selectTower('p')">
                <canvas class="preview-cvs" id="prev-p"></canvas>
                <div class="shop-lbl">Plasma</div><div class="shop-cost">$175</div>
            </div>
            <div class="shop-btn" id="shop-t" data-type="t" onclick="selectTower('t')">
                <canvas class="preview-cvs" id="prev-t"></canvas>
                <div class="shop-lbl">Tesla</div><div class="shop-cost">$250</div>
            </div>
            <div class="shop-btn" id="shop-k" data-type="k" onclick="selectTower('k')">
                <canvas class="preview-cvs" id="prev-k"></canvas>
                <div class="shop-lbl">Templar</div><div class="shop-cost">$300</div>
            </div>
            <div class="shop-btn" id="shop-a" data-type="a" onclick="selectTower('a')">
                <canvas class="preview-cvs" id="prev-a"></canvas>
                <div class="shop-lbl">Artillery</div><div class="shop-cost">$400</div>
            </div>
        </div>

        <div id="upgrade-ui" class="panel-section">
            <div class="upg-info">
                <h3 id="upg-name">TOWER</h3>
                <div>Lvl: <span class="hl" id="upg-lvl">1</span>/3 | Dmg: <span class="hl" id="upg-dmg">0</span></div>
                <div>Rng: <span class="hl" id="upg-rng">0</span> | Target: <span class="hl c-cyan" id="upg-tgt">FIRST</span></div>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <button class="tgt-btn" onclick="cycleTarget()">CHANGE TARGET</button>
                <button class="sell-btn" onclick="sellTower()">SELL $<span id="upg-sell">0</span></button>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <button class="upg-btn" id="btn-d-upg" onclick="upgradeTower()">UPGRADE $<span id="upg-cost">0</span></button>
                <button class="ctrl-btn" style="padding: 8px; font-size:11px;" onclick="deselectAll()">CANCEL</button>
            </div>
        </div>

        <div class="action-container">
            <button class="big-btn" id="btn-wave" onclick="startWave()">START WAVE</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       GAME ENGINE & CONSTANTS
       ========================================= */
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    // Internal Logical Resolution (16:9 Aspect Ratio)
    const C_WIDTH = 1280;
    const C_HEIGHT = 720;
    canvas.width = C_WIDTH;
    canvas.height = C_HEIGHT;

    // Game State
    let state = {
        lives: 25, gold: 600, wave: 0,
        isPaused: false, speed: 1,
        waveActive: false, waveTimer: 0, enemiesSpawned: 0,
        selectedShopType: null,
        selectedTower: null,
        screenShake: 0,
        bossWarningTimer: 0
    };

    // Entities & VFX
    let towers = [];
    let enemies = [];
    let projectiles = [];
    let particles = [];
    let ambientParticles = [];
    let fcts = []; 
    let effectAnimations = []; 
    let scorchMarks = [];
    let frameCount = 0; 

    // Init Ambient Particles
    for(let i=0; i<30; i++) {
        ambientParticles.push({
            x: Math.random() * C_WIDTH, y: Math.random() * C_HEIGHT,
            vx: (Math.random()-0.5)*0.5, vy: -Math.random()*1,
            size: Math.random()*2 + 1, alpha: Math.random()*0.5 + 0.1
        });
    }

    // 10-Point Winding Path (Recessed Trench Style)
    const pathNodes = [
        {x: 0, y: 120}, {x: 1150, y: 120}, {x: 1150, y: 620},
        {x: 100, y: 620}, {x: 100, y: 280}, {x: 900, y: 280},
        {x: 900, y: 480}, {x: 350, y: 480}, {x: 350, y: 380},
        {x: 640, y: 380} // Core
    ];
    const corePos = { x: 640, y: 380, radius: 65 };

    /* =========================================
       TOWER DICTIONARY
       ========================================= */
    const TARGET_MODES = ["FIRST", "LAST", "STRONG", "CLOSE"];
    
    const TOWER_DEFS = {
        'b': { name: 'Panther Sentry', cost: 100, range: 160, fireRate: 15, damage: 12, pSpeed: 18, color: '#bf00ff', pType: 'kinetic' },
        'p': { name: 'Plasma Cannon', cost: 175, range: 200, fireRate: 45, damage: 45, pSpeed: 12, color: '#00ffff', pType: 'plasma' },
        't': { name: 'Tesla Coil', cost: 250, range: 180, fireRate: 35, damage: 25, pSpeed: 0, color: '#aaffff', pType: 'beam' }, 
        'k': { name: 'Templar Guard', cost: 300, range: 140, fireRate: 60, damage: 95, pSpeed: 0, color: '#ffd700', pType: 'lance' }, 
        'a': { name: 'Artillery', cost: 400, range: 350, fireRate: 120, damage: 90, pSpeed: 8, color: '#ff3366', pType: 'arc', splash: 85 }
    };

    /* =========================================
       INPUT & UI HANDLING
       ========================================= */
    const getPointerPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (C_WIDTH / rect.width),
            y: (clientY - rect.top) * (C_HEIGHT / rect.height)
        };
    };

    let pointer = { x: -100, y: -100 };
    canvas.addEventListener('mousemove', e => pointer = getPointerPos(e));
    canvas.addEventListener('touchmove', e => pointer = getPointerPos(e));

    canvas.addEventListener('click', e => handleCanvasClick(getPointerPos(e)));
    canvas.addEventListener('touchend', e => { e.preventDefault(); handleCanvasClick(getPointerPos(e.changedTouches[0])); });

    function selectTower(type) {
        if (state.gold < TOWER_DEFS[type].cost) return;
        state.selectedShopType = type;
        state.selectedTower = null;
        updateUI();
    }

    function deselectAll() {
        state.selectedShopType = null;
        state.selectedTower = null;
        updateUI();
    }

    function handleCanvasClick(pos) {
        let clickedTower = null;
        for (let t of towers) {
            if (Math.hypot(t.x - pos.x, t.y - pos.y) < 35) { clickedTower = t; break; }
        }

        if (clickedTower) {
            state.selectedTower = clickedTower;
            state.selectedShopType = null;
            updateUI();
            return;
        }

        if (state.selectedShopType) {
            const def = TOWER_DEFS[state.selectedShopType];
            let valid = true;
            if (Math.hypot(pos.x - corePos.x, pos.y - corePos.y) < corePos.radius + 30) valid = false;
            
            for(let i=0; i<pathNodes.length-1; i++) {
                if (distToSegment(pos, pathNodes[i], pathNodes[i+1]) < 40) { valid = false; break; }
            }
            for (let t of towers) {
                if (Math.hypot(t.x - pos.x, t.y - pos.y) < 45) { valid = false; break; }
            }

            if (valid && state.gold >= def.cost) {
                state.gold -= def.cost;
                towers.push({
                    x: pos.x, y: pos.y, type: state.selectedShopType,
                    level: 1, angle: 0, cooldown: 0,
                    damage: def.damage, range: def.range, fireRate: def.fireRate,
                    targetMode: 0
                });
                // Construction puff effect
                addEffect(pos.x, pos.y, '#ffffff', 30, 'nova');
                deselectAll();
            } else {
                addFCT(pos.x, pos.y, "INVALID", "#ff3333");
            }
        } else {
            deselectAll();
        }
    }

    function distToSegment(p, v, w) {
        let l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function updateUI() {
        document.getElementById('ui-lives').innerText = state.lives;
        document.getElementById('ui-gold').innerText = Math.floor(state.gold);
        document.getElementById('ui-wave').innerText = state.wave;

        const waveBtn = document.getElementById('btn-wave');
        if (state.waveActive) {
            let remain = enemies.length + (enemiesToSpawn() - state.enemiesSpawned);
            waveBtn.innerText = `DEFENDING (${remain})`;
            waveBtn.disabled = true;
        } else {
            waveBtn.innerText = `START WAVE ${state.wave + 1}`;
            waveBtn.disabled = false;
        }

        ['b','p','t','k','a'].forEach(type => {
            let el = document.getElementById('shop-'+type);
            el.className = 'shop-btn';
            if (state.gold < TOWER_DEFS[type].cost) el.classList.add('disabled');
            if (state.selectedShopType === type) el.classList.add('selected');
        });

        if (state.selectedTower) {
            document.getElementById('shop-ui').style.display = 'none';
            document.getElementById('upgrade-ui').style.display = 'flex';
            
            let t = state.selectedTower;
            let def = TOWER_DEFS[t.type];
            document.getElementById('upg-name').innerText = def.name;
            document.getElementById('upg-lvl').innerText = t.level;
            document.getElementById('upg-dmg').innerText = Math.floor(t.damage);
            document.getElementById('upg-rng').innerText = Math.floor(t.range);
            document.getElementById('upg-tgt').innerText = TARGET_MODES[t.targetMode];
            
            let upgCost = def.cost * t.level;
            let sellVal = Math.floor((def.cost + (t.level>1?def.cost:0) + (t.level>2?def.cost*2:0)) * 0.6);
            document.getElementById('upg-sell').innerText = sellVal;
            
            let btnUpg = document.getElementById('btn-d-upg');
            if (t.level >= 3) {
                btnUpg.innerText = "MAX LEVEL"; btnUpg.disabled = true;
            } else {
                btnUpg.innerHTML = `UPGRADE<br/>$${upgCost}`;
                btnUpg.disabled = state.gold < upgCost;
            }
        } else {
            document.getElementById('shop-ui').style.display = 'flex';
            document.getElementById('upgrade-ui').style.display = 'none';
        }
    }

    function sellTower() {
        if (!state.selectedTower) return;
        let t = state.selectedTower;
        let def = TOWER_DEFS[t.type];
        let sellVal = Math.floor((def.cost + (t.level>1?def.cost:0) + (t.level>2?def.cost*2:0)) * 0.6);
        state.gold += sellVal;
        addFCT(t.x, t.y, `+$${sellVal}`, "#ffd700");
        
        // Sell coin explosion
        for(let i=0; i<15; i++) {
            particles.push({
                x: t.x, y: t.y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10 - 2,
                color: '#ffd700', size: Math.random()*4+2, life: 30 + Math.random()*20
            });
        }
        
        towers = towers.filter(x => x !== t);
        deselectAll();
    }

    function upgradeTower() {
        if (!state.selectedTower) return;
        let t = state.selectedTower;
        if (t.level >= 3) return;
        let cost = TOWER_DEFS[t.type].cost * t.level;
        if (state.gold >= cost) {
            state.gold -= cost;
            t.level++;
            t.damage *= 1.8; 
            t.range *= 1.15; 
            if(t.type !== 'k') t.fireRate = Math.max(5, Math.floor(t.fireRate * 0.8));
            addEffect(t.x, t.y, '#00ffff', 50, 'nova');
            updateUI();
        }
    }

    function cycleTarget() {
        if (!state.selectedTower) return;
        state.selectedTower.targetMode = (state.selectedTower.targetMode + 1) % TARGET_MODES.length;
        updateUI();
    }

    /* =========================================
       WAVE LOGIC
       ========================================= */
    function enemiesToSpawn() { return 5 + (state.wave * 3); }

    function startWave() {
        if (state.waveActive) return;
        state.wave++;
        state.waveActive = true;
        state.waveTimer = 0;
        state.enemiesSpawned = 0;
        
        if (state.wave % 5 === 0) {
            state.bossWarningTimer = 120; // Show warning
        }
        updateUI();
    }

    function processWaveSpawns(dtFrames) {
        if (!state.waveActive) return;
        state.waveTimer -= dtFrames;
        
        if (state.enemiesSpawned < enemiesToSpawn() && state.waveTimer <= 0) {
            let isHeavy = (state.enemiesSpawned % 4 === 3);
            let isBoss = (state.wave % 5 === 0 && state.enemiesSpawned === enemiesToSpawn()-1);
            
            let hpScale = Math.pow(1.35, state.wave);
            let e = {
                x: pathNodes[0].x, y: pathNodes[0].y, pathIdx: 0,
                hp: Math.floor(30 * hpScale), maxHp: Math.floor(30 * hpScale),
                speed: 1.5, type: 'light', reward: 5 + state.wave
            };

            if (isHeavy) {
                e.hp *= 3.5; e.maxHp *= 3.5; e.speed = 0.9; e.type = 'heavy'; e.reward *= 2;
            }
            if (isBoss) {
                e.hp *= 20; e.maxHp *= 20; e.speed = 0.6; e.type = 'boss'; e.reward *= 15;
            }

            enemies.push(e);
            state.enemiesSpawned++;
            state.waveTimer = 50; 
            updateUI();
        }

        if (state.enemiesSpawned >= enemiesToSpawn() && enemies.length === 0) {
            state.waveActive = false;
            let clrBonus = 50 + (state.wave * 15);
            state.gold += clrBonus; 
            addFCT(corePos.x, corePos.y - 100, `WAVE CLEARED +$${clrBonus}`, "#00ffff");
            updateUI();
        }
    }

    /* =========================================
       COMBAT & PHYSICS LOGIC
       ========================================= */
    function spawnProjectile(t, target) {
        const def = TOWER_DEFS[t.type];
        
        if (def.pSpeed === 0) {
            target.hp -= t.damage;
            if (t.type === 't') addEffectLine(t.x, t.y, target.x, target.y, def.color, 'lightning');
            if (t.type === 'k') addEffectLine(t.x, t.y, target.x, target.y, def.color, 'slash');
            createHitParticles(target.x, target.y, def.color, t.level);
            return;
        }

        let dist = Math.hypot(target.x - t.x, target.y - t.y);
        let ticksToHit = dist / def.pSpeed;
        
        let nextNode = pathNodes[target.pathIdx+1] || target;
        let eAngle = Math.atan2(nextNode.y - target.y, nextNode.x - target.x);
        let predX = target.x + Math.cos(eAngle) * target.speed * ticksToHit * 0.7; // Lead aim
        let predY = target.y + Math.sin(eAngle) * target.speed * ticksToHit * 0.7;

        let pAngle = Math.atan2(predY - t.y, predX - t.x);
        
        projectiles.push({
            x: t.x, y: t.y, originX: t.x, originY: t.y, targetX: predX, targetY: predY,
            vx: Math.cos(pAngle) * def.pSpeed, vy: Math.sin(pAngle) * def.pSpeed,
            damage: t.damage, type: def.pType, color: def.color,
            splash: def.splash || 0, level: t.level,
            totalDist: Math.hypot(predX-t.x, predY-t.y), traveled: 0,
            trail: [] // Store trail positions
        });
    }

    function processCombat(dtFrames) {
        towers.forEach(t => {
            if (t.cooldown > 0) t.cooldown -= dtFrames;
            
            let validTargets = enemies.filter(e => Math.hypot(e.x - t.x, e.y - t.y) <= t.range);
            if (validTargets.length === 0) return;

            let target = validTargets[0]; 
            if (t.targetMode === 1) target = validTargets[validTargets.length-1];
            if (t.targetMode === 2) target = validTargets.reduce((a,b) => a.hp > b.hp ? a : b); 
            if (t.targetMode === 3) target = validTargets.reduce((a,b) => Math.hypot(a.x-t.x, a.y-t.y) < Math.hypot(b.x-t.x, b.y-t.y) ? a : b);

            t.angle = Math.atan2(target.y - t.y, target.x - t.x) + Math.PI/2;

            if (t.cooldown <= 0) {
                t.cooldown = t.fireRate;
                
                let shots = 1;
                if (t.type === 'p' && t.level >= 2) shots = 2;
                if (t.type === 'p' && t.level === 3) shots = 3;
                if (t.type === 'a' && t.level >= 2) shots = 2;

                for(let i=0; i<shots; i++) {
                    setTimeout(() => spawnProjectile(t, target), i * (t.type === 'p' ? 100 : 200));
                }
            }
        });

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let moveDist = Math.hypot(p.vx * dtFrames, p.vy * dtFrames);
            p.x += p.vx * dtFrames;
            p.y += p.vy * dtFrames;
            p.traveled += moveDist;
            
            // Trail logic
            p.trail.push({x: p.x, y: p.y});
            if (p.trail.length > 5) p.trail.shift();

            if (p.traveled >= p.totalDist) {
                if (p.splash > 0) {
                    let splashRad = p.splash * (1 + (p.level*0.2));
                    addEffect(p.x, p.y, p.color, splashRad, 'explosion');
                    state.screenShake = p.level * 4;
                    // Add permanent scorch mark
                    scorchMarks.push({x: p.x, y: p.y, r: splashRad*0.8, life: 1000});

                    enemies.forEach(e => {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < splashRad) {
                            e.hp -= p.damage;
                            addFCT(e.x, e.y, Math.floor(p.damage), p.color);
                        }
                    });
                } else {
                    for (let e of enemies) {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < 35) {
                            e.hp -= p.damage;
                            createHitParticles(p.x, p.y, p.color, p.level);
                            break;
                        }
                    }
                }
                projectiles.splice(i, 1);
            }
        }

        // Clean up scorch marks
        for (let i = scorchMarks.length - 1; i >= 0; i--) {
            scorchMarks[i].life -= dtFrames;
            if(scorchMarks[i].life <= 0) scorchMarks.splice(i,1);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.hp <= 0) {
                state.gold += e.reward;
                addFCT(e.x, e.y, `+${e.reward}`, "#ffd700");
                createHitParticles(e.x, e.y, e.type === 'boss' ? '#00ffff' : '#8892a0', 3);
                enemies.splice(i, 1);
                updateUI();
                continue;
            }

            let nextNode = pathNodes[e.pathIdx + 1];
            if (!nextNode) {
                state.lives--;
                state.screenShake = 15;
                addEffect(corePos.x, corePos.y, '#ff3366', 150, 'nova');
                enemies.splice(i, 1);
                updateUI();
                if (state.lives <= 0) gameOver();
                continue;
            }

            let angle = Math.atan2(nextNode.y - e.y, nextNode.x - e.x);
            e.x += Math.cos(angle) * e.speed * dtFrames;
            e.y += Math.sin(angle) * e.speed * dtFrames;

            if (Math.hypot(e.x - nextNode.x, e.y - nextNode.y) < Math.max(5, e.speed * dtFrames)) e.pathIdx++;
        }
    }

    /* =========================================
       VISUAL EFFECTS
       ========================================= */
    function addEffect(x, y, color, radius, type) {
        effectAnimations.push({x, y, color, radius, type, maxLife: 20, life: 20});
    }

    function addEffectLine(x1, y1, x2, y2, color, type) {
        effectAnimations.push({x1, y1, x2, y2, color, type, maxLife: 10, life: 10});
    }

    function createHitParticles(x, y, color, level) {
        let count = 4 + (level * 4);
        for(let i=0; i<count; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                color, size: Math.random()*3 + 1, life: 15 + Math.random()*20
            });
        }
    }

    function addFCT(x, y, text, color) {
        fcts.push({x, y, text, color, life: 50, maxLife: 50, vy: -0.8});
    }

    function drawLightning(ctx, x1, y1, x2, y2) {
        ctx.beginPath(); ctx.moveTo(x1, y1);
        let segments = 5;
        let cx = x1, cy = y1;
        for (let i=0; i<segments; i++) {
            cx += (x2-x1)/segments + (Math.random()-0.5)*25;
            cy += (y2-y1)/segments + (Math.random()-0.5)*25;
            ctx.lineTo(cx, cy);
        }
        ctx.stroke();
    }

    /* =========================================
       PROCEDURAL ART ASSETS (Updated Reference Theme)
       ========================================= */
    
    // Core Matrix: Silver Hexagon, Panther Mask, Celtic Knotwork Base
    function drawCore(ctx) {
        ctx.save(); ctx.translate(corePos.x, corePos.y); ctx.scale(1.2, 1.2);
        let t = frameCount * 0.05;
        
        // 1. Back glowing plate (Rounded Square)
        ctx.fillStyle = '#4a5568'; ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(-45, -45, 90, 90, 15); ctx.fill(); ctx.stroke();
        
        // Inner glowing border
        ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(t)*0.2})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(-40, -40, 80, 80, 10); ctx.stroke();

        // 2. Central Silver Hexagon
        ctx.fillStyle = '#8892a0'; ctx.strokeStyle = '#cbd5e0'; ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=0; i<6; i++) {
            let angle = (Math.PI/3) * i - Math.PI/2;
            let hx = Math.cos(angle)*35; let hy = Math.sin(angle)*35;
            if(i===0) ctx.moveTo(hx,hy); else ctx.lineTo(hx,hy);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // 3. Sharp Side Winglets
        ctx.fillStyle = '#4a5568'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-35, -15); ctx.lineTo(-60, -25); ctx.lineTo(-50, -5); ctx.lineTo(-35, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(35, -15); ctx.lineTo(60, -25); ctx.lineTo(50, -5); ctx.lineTo(35, 5); ctx.closePath(); ctx.fill(); ctx.stroke();

        // 4. Obsidian Panther Mask
        ctx.fillStyle = '#111'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -25); // Top center
        ctx.lineTo(-12, -18); // Left ear tip
        ctx.lineTo(-8, -12);
        ctx.lineTo(-15, 0); // Left cheek
        ctx.lineTo(-6, 15); // Jaw
        ctx.lineTo(0, 20); // Chin
        ctx.lineTo(6, 15); // Right Jaw
        ctx.lineTo(15, 0); // Right cheek
        ctx.lineTo(8, -12);
        ctx.lineTo(12, -18); // Right ear tip
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // Face inner plates (brow/nose)
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(-6,-8); ctx.lineTo(0,5); ctx.lineTo(6,-8); ctx.closePath(); ctx.fill();

        // Glowing Cyan Eyes
        ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
        ctx.beginPath(); ctx.moveTo(-2,-2); ctx.lineTo(-8,-5); ctx.lineTo(-4,1); ctx.fill();
        ctx.beginPath(); ctx.moveTo(2,-2); ctx.lineTo(8,-5); ctx.lineTo(4,1); ctx.fill();
        ctx.shadowBlur = 0;

        // 5. Bottom Knotwork (Cyber-Celtic)
        ctx.strokeStyle = '#8892a0'; ctx.lineWidth = 3;
        ctx.beginPath(); 
        ctx.moveTo(-45, 40);
        ctx.bezierCurveTo(-20, 25, -20, 55, 0, 40);
        ctx.bezierCurveTo(20, 25, 20, 55, 45, 40);
        ctx.stroke();
        
        ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 1.5;
        ctx.beginPath(); 
        ctx.moveTo(-45, 45);
        ctx.bezierCurveTo(-20, 30, -20, 60, 0, 45);
        ctx.bezierCurveTo(20, 30, 20, 60, 45, 45);
        ctx.stroke();

        // Tiny Panther Profiles at knot ends
        ctx.fillStyle = '#111'; ctx.strokeStyle='#00ffff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(-45, 42, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(45, 42, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        
        ctx.restore();
    }

        }

        ctx.fillStyle = '#111'; ctx.strokeStyle = '#bf00ff';
        ctx.beginPath(); 
        ctx.moveTo(0, -20); // Top
        ctx.lineTo(-14, -15); // Ear left
        ctx.lineTo(-10, -5); 
        ctx.lineTo(-16, 5); // Cheek left
        ctx.lineTo(-6, 16); // Jaw

        ctx.fillStyle = '#bf00ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#bf00ff';

            // Holographic Winglets

    // Plasma Cannon
    function drawPlasmaCannon(ctx, level) {
        ctx.fillStyle = '#2d3748'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#111'; ctx.strokeStyle = '#4a5568';
        if (level === 1) {
            ctx.fillRect(-6, -26, 12, 26); ctx.strokeRect(-6, -26, 12, 26);
        } else if (level === 2) {
            ctx.fillRect(-12, -28, 8, 28); ctx.strokeRect(-12, -28, 8, 28);
            ctx.fillRect(4, -28, 8, 28); ctx.strokeRect(4, -28, 8, 28);
        } else {
            ctx.fillRect(-15, -26, 7, 26); ctx.strokeRect(-15, -26, 7, 26);
            ctx.fillRect(-6, -36, 12, 36); ctx.strokeRect(-6, -36, 12, 36); // Main center
            ctx.fillRect(8, -26, 7, 26); ctx.strokeRect(8, -26, 7, 26);
        }

        // Reactor
        let heat = 0.5 + Math.abs(Math.sin(frameCount * 0.15))*0.5;
        ctx.fillStyle = `rgba(0, 255, 255, ${0.9*heat})`; ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
        ctx.beginPath(); ctx.arc(0, -4, 6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    }

    // Tesla Coil
    function drawTeslaSpire(ctx, level) {
        ctx.fillStyle = '#2d3748'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-20,15); ctx.lineTo(20,15); ctx.lineTo(10,5); ctx.lineTo(-10,5); ctx.closePath(); ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = '#111'; ctx.fillRect(-6, -20, 12, 25);

        let rings = level === 1 ? 3 : (level === 2 ? 5 : 7);
        for(let i=0; i<rings; i++) {
            let y = 0 - (i*5);
            ctx.fillStyle = '#4a5568'; ctx.strokeStyle = '#aaffff';
            ctx.beginPath(); ctx.ellipse(0, y, 12, 2.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }

        let topY = -2 - (rings*5);
        ctx.fillStyle = '#aaffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#aaffff';
        
        if (level < 3) {
            ctx.beginPath(); ctx.arc(0, topY, 8, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(-10, topY, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, topY, 6, 0, Math.PI*2); ctx.fill();
            if(Math.random()>0.5) { ctx.strokeStyle='#fff'; drawLightning(ctx,-10,topY, 10,topY); }
        }
        ctx.shadowBlur = 0;
    }

    function renderTowerType(ctx, type, level) {
        if (type==='b') drawPantherSentry(ctx, level);
        if (type==='p') drawPlasmaCannon(ctx, level);

        if (type==='a') drawArtillery(ctx, level);

    /* =========================================
       RENDER LOOP
       ========================================= */
    function drawPreviews() {
        ['b','p','t','k','a'].forEach(type => {
            const pCanvas = document.getElementById('prev-'+type);
            pCanvas.width = 100; // High res for sharper images
            pCanvas.height = 100;
            const pCtx = pCanvas.getContext('2d');
            pCtx.clearRect(0,0,100,100);
            pCtx.save(); 
            pCtx.translate(50, 55); 
            pCtx.scale(1.3, 1.3); // Scale up for UI
            renderTowerType(pCtx, type, 3); // Previews show max level potential
            pCtx.restore();
        });
    }

    function render() {
        ctx.clearRect(0, 0, C_WIDTH, C_HEIGHT);

        // Ambient Tech Particles
        ambientParticles.forEach(p => {
            p.y += p.vy; p.x += p.vx;
            if(p.y < 0) p.y = C_HEIGHT;
            ctx.fillStyle = `rgba(0, 255, 255, ${p.alpha})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });

        ctx.save();
        if (state.screenShake > 0) {
            ctx.translate((Math.random()-0.5)*state.screenShake, (Math.random()-0.5)*state.screenShake);
            state.screenShake *= 0.9;
            if(state.screenShake < 0.5) state.screenShake = 0;
        }

        // Draw Scorch Marks
        scorchMarks.forEach(s => {
            ctx.fillStyle = `rgba(0,0,0,${s.life/1000 * 0.7})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });

        // Draw Path (Recessed Cyber-Trench)
        ctx.strokeStyle = '#11111a'; ctx.lineWidth = 48; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pathNodes[0].x, pathNodes[0].y);
        for(let i=1; i<pathNodes.length; i++) ctx.lineTo(pathNodes[i].x, pathNodes[i].y); ctx.stroke();

        ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 44; ctx.stroke();

        // Center Energy Line
        ctx.strokeStyle = '#bf00ff'; ctx.lineWidth = 6; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
        ctx.stroke(); ctx.shadowBlur = 0;

        // Path Direction Chevrons
        let offset = (frameCount * 1.5) % 40;
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)'; ctx.lineWidth = 3; ctx.setLineDash([12, 28]); ctx.lineDashOffset = -offset;
        ctx.stroke(); ctx.setLineDash([]);

        drawCore(ctx);

        // Hover Range Preview
        if (state.selectedShopType && pointer.x > 0) {
            let def = TOWER_DEFS[state.selectedShopType];
            ctx.fillStyle = 'rgba(0, 255, 255, 0.08)'; ctx.strokeStyle = '#00ffff';
            ctx.beginPath(); ctx.arc(pointer.x, pointer.y, def.range, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            
            ctx.save(); ctx.translate(pointer.x, pointer.y); ctx.globalAlpha = 0.6;
            renderTowerType(ctx, state.selectedShopType, 1);
            ctx.restore();
        }

        // Towers
        towers.forEach(t => {
            // Pulse range if selected
            if (state.selectedTower === t) {
                ctx.fillStyle = `rgba(0, 255, 255, 0.1)`; ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                
                ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.setLineDash([6,6]);
                ctx.beginPath(); ctx.arc(t.x, t.y, 28, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
            }

            ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle);
            renderTowerType(ctx, t.type, t.level);
            ctx.restore();
        });

        // Enemies
        enemies.forEach(e => {
            ctx.save(); ctx.translate(e.x, e.y);
            let s = e.type === 'boss' ? 2.5 : (e.type === 'heavy' ? 1.6 : 1);
            ctx.scale(s, s);

            // Silver-plated enemies
            ctx.fillStyle = '#8892a0'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            
            // Draw angular cyber-drone
            ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, 12); ctx.lineTo(-10, 6); ctx.lineTo(-6, 0); ctx.lineTo(-10, -6); ctx.lineTo(-6, -12); ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Core glow based on type
            if (e.type === 'heavy') ctx.fillStyle = '#ff8800';
            else if (e.type === 'boss') ctx.fillStyle = '#bf00ff';
            else ctx.fillStyle = '#00ffff';
            
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            // Health Bar
            ctx.fillStyle = '#333'; ctx.fillRect(e.x - 20, e.y - 28*s, 40, 5);
            ctx.fillStyle = e.type === 'boss' ? '#bf00ff' : '#00ffff'; 
            ctx.fillRect(e.x - 20, e.y - 28*s, 40 * (e.hp/e.maxHp), 5);
        });

        // Projectiles
        projectiles.forEach(p => {
            ctx.save(); ctx.translate(p.x, p.y);
            
            // Trail
            if (p.trail && p.trail.length > 1) {
                ctx.restore(); ctx.save();
                ctx.beginPath(); ctx.moveTo(p.trail[0].x, p.trail[0].y);
                for(let i=1; i<p.trail.length; i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
                ctx.strokeStyle = p.color; ctx.lineWidth = p.type==='plasma'?6:2; ctx.globalAlpha = 0.5;
                ctx.stroke(); ctx.globalAlpha = 1.0;
                ctx.translate(p.x, p.y);
            }

            if (p.type === 'arc') {
                let progress = p.traveled / p.totalDist;
                let arcOffset = Math.sin(progress * Math.PI) * 120; // Peak height 120
                ctx.translate(0, -arcOffset);
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0, 6, 0, Math.PI*2); ctx.fill();
                // Shadow
                ctx.restore(); ctx.save(); ctx.translate(p.x, p.y);
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(0,0, 4, 0, Math.PI*2); ctx.fill();
            } else if (p.type === 'plasma') {
                ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                ctx.beginPath(); ctx.arc(0,0, 6, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.rotate(Math.atan2(p.vy, p.vx));
                ctx.fillStyle = '#00ffff'; ctx.fillRect(-6, -1, 12, 3);
            }
            ctx.restore();
        });

        // Effects
        for(let i=effectAnimations.length-1; i>=0; i--) {
            let fx = effectAnimations[i]; fx.life--;
            if (fx.life <= 0) { effectAnimations.splice(i, 1); continue; }
            
            ctx.save();
            let pct = fx.life / fx.maxLife;
            ctx.globalAlpha = pct;
            
            if (fx.type === 'explosion' || fx.type === 'nova') {
                ctx.fillStyle = fx.color; ctx.beginPath(); 
                ctx.arc(fx.x, fx.y, fx.radius * (1-pct), 0, Math.PI*2); ctx.fill();
            } else if (fx.type === 'lightning') {
                ctx.strokeStyle = fx.color; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = fx.color;
                drawLightning(ctx, fx.x1, fx.y1, fx.x2, fx.y2);
            } else if (fx.type === 'slash') {
                ctx.strokeStyle = fx.color; ctx.lineWidth = 6 * pct;
                ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
            }
            ctx.restore();
        }

        // Particles
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i]; p.life--;
            if (p.life <= 0) { particles.splice(i,1); continue; }
            p.x += p.vx; p.y += p.vy;
            ctx.globalAlpha = p.life/30; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // FCT (Floating Combat Text)
        for(let i=fcts.length-1; i>=0; i--) {
            let f = fcts[i]; f.life--;
            if (f.life <= 0) { fcts.splice(i,1); continue; }
            f.y += f.vy; 
            ctx.globalAlpha = f.life / f.maxLife;
            ctx.fillStyle = f.color; ctx.font = "bold 18px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.shadowBlur = 4; ctx.shadowColor = '#000';
            ctx.fillText(f.text, f.x, f.y);
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1.0;

        ctx.restore(); // Restore shake
    }

    /* =========================================
       MAIN LOOP & INIT
       ========================================= */
    let lastTime = 0;
    
    function gameLoop(time) {
        requestAnimationFrame(gameLoop);
        if (!lastTime) lastTime = time;
        let dt = time - lastTime;
        lastTime = time;

        if (state.isPaused || state.lives <= 0) return;
        if (dt > 100) dt = 100;
        
        let dtFrames = (dt / 16.66) * state.speed;
        frameCount += dtFrames;

        if (state.bossWarningTimer > 0) {
            state.bossWarningTimer -= dtFrames;
            const w = document.getElementById('boss-warning');
            w.style.opacity = Math.abs(Math.sin(frameCount*0.1));
            if (state.bossWarningTimer <= 0) w.style.opacity = 0;
        }

        processWaveSpawns(dtFrames);
        processCombat(dtFrames);
        render();
    }

    // Top Bar Controls
    document.getElementById('btn-pause').onclick = (e) => { 
        state.isPaused = !state.isPaused; 
        e.target.innerText = state.isPaused ? "PLAY" : "PAUSE";
        e.target.classList.toggle('active');
    };
    [1, 2, 4].forEach(s => {
        document.getElementById(`btn-spd-${s}`).onclick = () => {
            state.speed = s;
            [1,2,4].forEach(x => document.getElementById(`btn-spd-${x}`).classList.remove('active'));
            document.getElementById(`btn-spd-${s}`).classList.add('active');
            
            // Add border glow for fast forward
            if(s > 1) document.getElementById('app-container').classList.add('fast-forward');
            else document.getElementById('app-container').classList.remove('fast-forward');
        }
    });
    document.getElementById('btn-spd-1').classList.add('active');

    function gameOver() {
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('go-wave').innerText = state.wave;
    }

    function resetGame() {
        state = { ...state, lives: 25, gold: 600, wave: 0, waveActive: false, enemiesSpawned: 0, selectedShopType: null, selectedTower: null, bossWarningTimer: 0 };
        towers = []; enemies = []; projectiles = []; effectAnimations = []; particles = []; fcts = []; scorchMarks = [];
        document.getElementById('game-over').style.display = 'none';
        updateUI();
    }

    window.onload = () => {
        drawPreviews();
        updateUI();
        requestAnimationFrame(gameLoop);
    };



</script>
</body>
</html>
