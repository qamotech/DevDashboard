<script>
    // 1. Load your Sprite
    const goblinSprite = new Image();
    goblinSprite.src = 'grem.png'; // Make sure this file is in the same folder

    // 2. Define Sprite Animation Logic
    const ANIMATIONS = {
        walk: { row: 0, frames: 6 },
        hit:  { row: 1, frames: 1 },
        idle: { row: 3, frames: 5 }
    };

    // 3. Update the Render Loop for Enemies
    function render() {
        // ... (Keep existing ambient/path/tower drawing code) ...

        enemies.forEach(e => {
            // Calculate frame based on game time
            let anim = ANIMATIONS.walk;
            let frame = Math.floor(frameCount / 10) % anim.frames;
            
            // Frame width/height based on a 6-column grid of 1024px
            let fw = 1024 / 6; 
            let fh = 256; 

            ctx.drawImage(goblinSprite, 
                frame * fw, anim.row * fh, fw, fh, // Source
                e.x - 40, e.y - 40, 80, 80        // Destination
            );

            // Health Bar
            ctx.fillStyle = '#333'; ctx.fillRect(e.x - 20, e.y - 50, 40, 5);
            ctx.fillStyle = '#00ffff'; ctx.fillRect(e.x - 20, e.y - 50, 40 * (e.hp/e.maxHp), 5);
        });
        
        // ... (Rest of your existing draw logic) ...
    }
    
    // ... (Keep the rest of your JS logic) ...
</script>
