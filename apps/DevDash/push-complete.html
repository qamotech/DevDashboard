<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Push Complete</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,.18), rgba(15,5,32,.32) 22%, rgba(0,0,0,.06) 48%, transparent 70%);
      animation: screenPulse 1.8s ease-out forwards;
      pointer-events: none;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .blast {
      width: min(82vmin, 760px);
      aspect-ratio: 1;
      object-fit: contain;
      filter:
        drop-shadow(0 0 16px rgba(255,255,255,.95))
        drop-shadow(0 0 38px rgba(59,242,255,.9))
        drop-shadow(0 0 74px rgba(161,72,255,.82));
      transform-origin: center;
      animation: blastIn 1.9s cubic-bezier(.13,.9,.2,1) forwards;
    }
    .shock {
      position: absolute;
      width: min(28vmin, 240px);
      aspect-ratio: 1;
      border: 4px solid rgba(255,255,255,.85);
      border-radius: 50%;
      filter: drop-shadow(0 0 18px rgba(66,234,196,.88));
      animation: shockwave 1.35s ease-out forwards;
    }
    .label {
      position: fixed;
      left: 50%;
      top: calc(50% + min(26vmin, 230px));
      transform: translateX(-50%);
      padding: .55rem .8rem;
      border-radius: 999px;
      background: rgba(7, 9, 24, .48);
      color: white;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: 0;
      text-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: labelIn .7s ease .55s forwards, labelOut .5s ease 2.6s forwards;
      backdrop-filter: blur(7px);
    }
    @keyframes blastIn {
      0% { opacity: 0; transform: scale(.08) rotate(-18deg); }
      12% { opacity: 1; transform: scale(1.16) rotate(2deg); }
      32% { opacity: 1; transform: scale(.96) rotate(-1deg); }
      72% { opacity: .96; transform: scale(1.04) rotate(.5deg); }
      100% { opacity: 0; transform: scale(1.5) rotate(4deg); }
    }
    @keyframes shockwave {
      0% { opacity: 0; transform: scale(.2); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: scale(5.5); }
    }
    @keyframes screenPulse {
      0% { opacity: 0; }
      10% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes labelIn {
      from { opacity: 0; transform: translate(-50%, 14px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes labelOut {
      to { opacity: 0; transform: translate(-50%, -8px); }
    }
  </style>
</head>
<body>
  <div class="overlay" aria-label="Push complete cyber glass explosion">
    <div class="shock"></div>
    <img class="blast" src="assets/explosion-cyber-glass.png" alt="">
  </div>
  <div class="label">GitHub pushed</div>
  <script>
    setTimeout(() => window.close(), 3400);
  </script>
</body>
</html>
