<!DOCTYPE html>

    <script>

            theme: {
                extend: {
                    colors: {
                        luxe: '#d4af37',
                        cyberPurple: '#8a2be2',

            color: #8a2be2;
            text-shadow: 0 0 12px rgba(138, 43, 226, 0.6);
