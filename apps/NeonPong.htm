<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; border: 12px solid #333; box-sizing: border-box; transition: transform 0.05s; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.95); z-index: 20; }
        #ui-layer { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10; }
        .grid { display: flex; gap: 15px; margin: 20px; }
        .card { border: 2px solid #555; padding: 20px; cursor: pointer; text-align: center; background: #222; }
        .card:hover { border-color: #0df; }
        button { padding: 10px 20px; cursor: pointer; background: #0df; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="overlay">
            <h1 id="msg">NEON PONG</h1>
            <div class="grid">
                <div class="card" onclick="mode='solo'; startGame()">SOLO</div>
                <div class="card" onclick="mode='cpu'; startGame()">VS CPU</div>
                <div class="card" onclick="mode='two'; startGame()">2 PLAYER</div>
            </div>
        </div>
        <div id="ui-layer">
            <button onclick="resetGame()">RESTART</button>
            <button onclick="location.reload()">EXIT</button>
        </div>
        <canvas id="c"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        let w, h, p1Y = 0, p2Y = 0, mode = 'solo', gameRunning = false, winner = '';
        let p1Score = 0, p2Score = 0;
        let ball = { x: 100, y: 100, dx: 8, dy: 8, speed: 8, size: 8, lastHit: 0, trail: [] };

        function resize() { w = canvas.width = container.clientWidth - 24; h = canvas.height = container.clientHeight - 24; }
        window.onresize = resize; resize();
        window.onmousemove = (e) => p1Y = e.clientY - 60;

        function resetGame() { p1Score = 0; p2Score = 0; winner = ''; gameRunning = true; document.getElementById('overlay').style.display = 'none'; }
        function startGame() { resetGame(); }
        
        function shake() {
            container.style.transform = 'translate(-10px, -10px)';
            setTimeout(() => container.style.transform = 'translate(0, 0)', 50);
        }

        function update() {
            if(!gameRunning || winner) return;
            ball.x += ball.dx; ball.y += ball.dy;
            
            // Trail effect
            ball.trail.push({x: ball.x, y: ball.y});
            if(ball.trail.length > 10) ball.trail.shift();

            if (ball.y < ball.size || ball.y > h - ball.size) ball.dy *= -1;

            // Collision with Spin/Shake
            if (ball.x <= 40 && ball.x >= 20 && ball.y >= p1Y && ball.y <= p1Y + 120) {
                if(ball.dx < 0 && Date.now() - ball.lastHit > 200) { ball.dx = Math.abs(ball.speed) + 0.5; shake(); ball.lastHit = Date.now(); }
            }
            if (ball.x >= w - 40 && ball.x <= w - 20 && ball.y >= p2Y && ball.y <= p2Y + 120) {
                if(ball.dx > 0 && Date.now() - ball.lastHit > 200) { ball.dx = -(Math.abs(ball.speed) + 0.5); shake(); ball.lastHit = Date.now(); }
            }

            if(mode === 'cpu') p2Y += (ball.y - (p2Y + 60)) * 0.1;
            
            if (ball.x < 0) { p2Score++; ball.x = w/2; if(p2Score >= 5) winner = 'CPU/P2 WINS!'; }
            if (ball.x > w) { p1Score++; ball.x = w/2; if(p1Score >= 5) winner = 'PLAYER 1 WINS!'; }
        }

        function draw() {
    ctx.clearRect(0, 0, w, h);
    
    // Draw Enhanced Trails
    ball.trail.forEach((p, i) => {
        ctx.globalAlpha = i / ball.trail.length;
        let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, ball.size * 2);
        grad.addColorStop(0, '#0df');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, ball.size * 1.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Draw "Energy Orb" Ball
    let orb = ctx.createRadialGradient(ball.x - ball.size/4, ball.y - ball.size/4, ball.size/8, ball.x, ball.y, ball.size);
    orb.addColorStop(0, '#fff'); // Bright center
    orb.addColorStop(0.2, '#0df'); // Neon core
    orb.addColorStop(1, '#0055ff'); // Deep glow edge
    
    ctx.shadowBlur = 20; 
    ctx.shadowColor = '#0df';
    ctx.fillStyle = orb;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; // Reset for other elements

    // Draw Paddles
    ctx.fillStyle = '#0df';
    ctx.shadowBlur = 10; ctx.shadowColor = '#0df';
    ctx.fillRect(20, p1Y, 10, 120);
    ctx.fillRect(w - 30, p2Y, 10, 120);
    
    // Scoreboard
    ctx.fillStyle = "#fff"; ctx.font = "30px Arial";
    ctx.fillText(winner || `${p1Score} - ${p2Score}`, w/2 - 50, 50);
    
    update(); requestAnimationFrame(draw);
}
        draw();
    </script>
</body>
</html>
