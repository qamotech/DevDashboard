<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpriteForge | Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <h3>Forge Tools</h3>
        <ul id="menuList"></ul>
    </nav>
    <div id="app">
        <h1>SpriteForge</h1>
        <div id="canvas-area">
            <img id="spriteDisplay" src="" alt="Generated Sprite Sheet">
        </div>
        <input type="text" id="promptInput" placeholder="Describe your character...">
        <button id="generateBtn">GENERATE SPRITE SHEET</button>
        <div id="suggestions"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
