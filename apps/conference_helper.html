<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-DATA // MULTI-TEAM LOGISTICS ENGINE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #070b0e;
            --bg-secondary: #0f151d;
            --bg-tertiary: #16202c;
            --neon-cyan: #00f0ff;
            --neon-orange: #ff6a00;
            --neon-glow-cyan: rgba(0, 240, 255, 0.2);
            --neon-glow-orange: rgba(255, 106, 0, 0.25);
            --neon-glow-intense: rgba(255, 106, 0, 0.65);
            --text-main: #e6edf3;
            --text-muted: #76899e;
            --border-metal: #253545;
            --action-delete: #ff0055;
            --panel-angle: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                linear-gradient(rgba(255, 106, 0, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 106, 0, 0.015) 1px, transparent 1px),
                linear-gradient(rgba(0, 240, 255, 0.01) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.01) 2px, transparent 2px);
            background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
            color: var(--text-main);
            padding: 25px;
            min-height: 100vh;
            overflow-y: scroll;
        }

        /* High-Tech Scanline Effect overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99999;
            opacity: 0.4;
            pointer-events: none;
            background-size: 100% 4px, 6px 100%;
        }

        .cyber-container {
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid var(--border-metal);
            background: rgba(15, 21, 29, 0.92);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.85), inset 0 0 2px var(--neon-glow-orange);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        /* Dual-Glow Transformers Style Header */
        header {
            background: linear-gradient(135deg, #05080c 0%, var(--bg-secondary) 100%);
            padding: 30px;
            border-bottom: 2px solid var(--neon-orange);
            position: relative;
            box-shadow: 0 4px 25px var(--neon-glow-orange);
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(90deg, var(--neon-orange), var(--neon-orange) 15px, transparent 15px, transparent 30px);
        }

        .header-title-frame {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 15px var(--neon-glow-intense);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-glow-cyan);
        }

        h1 em {
            font-style: normal;
            color: var(--neon-orange);
            text-shadow: 0 0 10px var(--neon-glow-orange);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Nav Tabs Matrix */
        .nav-tabs {
            display: flex;
            background: #05080c;
            border-bottom: 1px solid var(--border-metal);
            padding: 0 15px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 16px 28px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            clip-path: polygon(0 0, 88% 0, 100% 100%, 0% 100%);
            margin-right: 8px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 106, 0, 0.04);
        }

        .tab-btn.active {
            color: var(--neon-orange);
            background: var(--bg-secondary);
            border-bottom: 3px solid var(--neon-orange);
            text-shadow: 0 0 10px var(--neon-glow-orange);
        }

        /* React Switch Animation Content Box */
        .content-section {
            padding: 30px;
            animation: paneSlideExpand 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes paneSlideExpand {
            from { opacity: 0; transform: translateY(8px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .grid-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .grid-two-col { grid-template-columns: 1fr; }
        }

        .cyber-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-metal);
            border-radius: var(--panel-angle);
            padding: 25px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-panel:hover {
            border-color: rgba(255, 106, 0, 0.35);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7), 0 0 15px rgba(255, 106, 0, 0.03);
        }

        .panel-header {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            border-left: 3px solid var(--neon-orange);
            padding-left: 12px;
        }

        /* Venue Radio Configuration Modules */
        .venue-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {
            .venue-selector { grid-template-columns: 1fr; }
        }

        .venue-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-metal);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
        }

        .venue-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.08);
        }

        .venue-card.selected {
            border-color: var(--neon-orange);
            background: rgba(255, 106, 0, 0.03);
            box-shadow: 0 0 20px var(--neon-glow-orange), inset 0 0 8px rgba(255, 106, 0, 0.05);
        }

        .venue-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .venue-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Interactive Mechanical Elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background: #05080c;
            border: 1px solid var(--border-metal);
            padding: 14px 18px;
            color: #fff;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-orange);
            box-shadow: 0 0 12px var(--neon-glow-orange);
        }

        /* Advanced Cyber Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--neon-orange);
            color: var(--neon-orange);
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--neon-glow-orange);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--neon-orange);
            color: #000;
            box-shadow: 0 0 25px var(--neon-glow-intense);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-cyan {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-glow-cyan);
        }

        .btn-cyan:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }

        .btn-full {
            width: 100%;
        }

        .btn-action-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        /* Real-Time Table Elements */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        .cyber-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .cyber-table th {
            background: #05080c;
            padding: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-metal);
        }

        .cyber-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border-metal);
            color: var(--text-main);
            transition: background-color 0.2s ease;
        }

        .cyber-table tr:hover td {
            background: rgba(255, 106, 0, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .badge-host {
            background: rgba(255, 106, 0, 0.12);
            color: var(--neon-orange);
            border: 1px solid var(--neon-orange);
        }

        .badge-budget {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
        }

        .btn-del {
            background: transparent;
            border: 1px solid var(--action-delete);
            color: var(--action-delete);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .btn-del:hover {
            background: var(--action-delete);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        /* React Calculated Analytical Node Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #05080c;
            border: 1px solid var(--border-metal);
            border-radius: 8px;
            padding: 22px;
            text-align: center;
            position: relative;
            transition: transform 0.2s ease;
        }

        .metric-card:hover {
            transform: scale(1.02);
        }

        .metric-val {
            font-size: 1.9rem;
            font-weight: 900;
            color: #fff;
            margin-top: 8px;
        }

        .metric-val.highlight {
            color: var(--neon-orange);
            text-shadow: 0 0 12px var(--neon-glow-orange);
        }

        /* Food Module Structural Cards */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-metal);
            border-radius: 8px;
            padding: 22px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .food-card:hover {
            border-color: var(--neon-orange);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 106, 0, 0.08);
        }

        .food-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .food-name {
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #00ff66;
        }

        .status-dot::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
        }

        .food-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.5;
        }

        /* Top Brand Badges */
        .team-badge-container {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .team-badge {
            background: #05080c;
            border: 1px solid var(--border-metal);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }

        .team-badge span {
            color: var(--neon-orange);
            text-shadow: 0 0 8px var(--neon-glow-orange);
        }

        .team-badge em {
            font-style: normal;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-glow-cyan);
        }

        /* Extra Dynamic Feature: Fuel Log Tracker Counters */
        .fuel-counter-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #05080c;
            border: 1px solid var(--border-metal);
            border-radius: 6px;
            padding: 12px 20px;
            margin-bottom: 15px;
        }

        .fuel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-main);
        }

        .fuel-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .fuel-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .fuel-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .fuel-value {
            font-weight: 800;
            color: #fff;
            min-width: 25px;
            text-align: center;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="react-app-root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Sustenance Structural DB Coordinates
        const locationSustenanceData = {
            raleigh: [
                { name: "Cook Out - Durham S Miami Blvd", distance: "4.8 miles away", hours: "Open until 3:00 AM // Rapid Route", address: "5400 S Miami Blvd, Durham, NC" },
                { name: "Cook Out - Raleigh Hillsborough St", distance: "12.4 miles away", hours: "Open until 4:00 AM // High Volume", address: "3930 Hillsborough St, Raleigh, NC" }
            ],
            orlando: [
                { name: "Cook Out - Colonial Dr Target", distance: "4.2 miles away", hours: "Open until 3:00 AM // Drive-thru Route", address: "Orlando East Sector Corridor" },
                { name: "Cook Out - University Blvd Hub", distance: "8.5 miles away", hours: "Open until 4:00 AM // High Volume Station", address: "University District Alpha" }
            ],
            grandrapids: [
                { name: "Michigan Street Cook Out Prime", distance: "1.1 miles away", hours: "Open until 3:30 AM // Ultra Close", address: "505 Michigan St NE, Grand Rapids" },
                { name: "28th Street Cyber Station", distance: "5.3 miles away", hours: "Open until 4:00 AM // High Lane Yield", address: "1420 28th St SE, Grand Rapids" }
            ]
        };

        function App() {
            const [activeTab, setActiveTab] = useState('hotels');
            const [currentVenue, setCurrentVenue] = useState('raleigh');
            const [hotelName, setHotelName] = useState('');
            const [hotelPrice, setHotelPrice] = useState('120');
            const [hotelType, setHotelType] = useState('Budget Alternate');
            const [shakesConsumed, setShakesConsumed] = useState(0);
            
            const [hotelRegistry, setHotelRegistry] = useState([
                { id: 1, name: "Sheraton Imperial Hotel (Host)", price: 185, type: "Official Host Hotel" },
                { id: 2, name: "Comfort Suites RTP Matrix", price: 95, type: "Budget Alternate" }
            ]);

            // Link Mapping Configurations based on Active Coordinates
            const getExternalLinks = () => {
                if(currentVenue === 'raleigh') {
                    return { google: "https://www.google.com/travel/hotels?q=hotels+near+Raleigh+Convention+Center", cheapest: "https://www.google.com/travel/hotels?q=cheap+hotels+near+Raleigh+Convention+Center" };
                } else if(currentVenue === 'orlando') {
                    return { google: "https://www.google.com/travel/hotels?q=hotels+near+Kia+Center+Orlando", cheapest: "https://www.google.com/travel/hotels?q=cheap+hotels+near+Kia+Center+Orlando" };
                } else {
                    return { google: "https://www.google.com/travel/hotels?q=hotels+near+Amway+Grand+Plaza+Grand+Rapids", cheapest: "https://www.google.com/travel/hotels?q=cheap+hotels+near+Amway+Grand+Plaza+Grand+Rapids" };
                }
            };

            const addHotelItem = (e) => {
                e.preventDefault();
                if (!hotelName.trim()) return;

                const newItem = {
                    id: Date.now(),
                    name: hotelName,
                    price: parseInt(hotelPrice) || 0,
                    type: hotelType
                };

                setHotelRegistry([...hotelRegistry, newItem]);
                setHotelName('');
                setHotelPrice('120');
            };

            const purgeRegistryItem = (id) => {
                setHotelRegistry(hotelRegistry.filter(item => item.id !== id));
            };

            // Calculation Delta Algorithms Execution
            const hostHotels = hotelRegistry.filter(h => h.type === 'Official Host Hotel');
            const budgetHotels = hotelRegistry.filter(h => h.type === 'Budget Alternate');
            
            const minHostPrice = hostHotels.length > 0 ? Math.min(...hostHotels.map(h => h.price)) : 0;
            const minBudgetPrice = budgetHotels.length > 0 ? Math.min(...budgetHotels.map(h => h.price)) : 0;
            const netDelta = minHostPrice > 0 && minBudgetPrice > 0 ? minHostPrice - minBudgetPrice : 0;

            const links = getExternalLinks();

            return (
                <div class="cyber-container">
                    {/* CORE MAIN SYSTEM HEADER */}
                    <header>
                        <div class="header-title-frame">
                            <div>
                                <h1>TEAM <span>CONFERENCE</span> <em>COMPANION</em></h1>
                                <div class="subtitle">Logistics Optimization Engine // Core System v5.0 // React Engine</div>
                                <div class="team-badge-container">
                                    <div class="team-badge">Affiliation: <span>BUELL TEAM</span></div>
                                    <div class="team-badge">Sponsor Matrix: <em>B. & L. CAMPBELL</em></div>
                                    <div class="team-badge">Event Target: <span>GARY NEWELL EVENTS</span></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* INTERACTIVE NAVIGATION CONTROL TABS */}
                    <nav class="nav-tabs">
                        <button class={`tab-btn ${activeTab === 'hotels' ? 'active' : ''}`} onClick={() => setActiveTab('hotels')}>Hotels & Engine</button>
                        <button class={`tab-btn ${activeTab === 'comparison' ? 'active' : ''}`} onClick={() => setActiveTab('comparison')}>Host vs. Savings</button>
                        <button class={`tab-btn ${activeTab === 'food' ? 'active' : ''}`} onClick={() => setActiveTab('food')}>Cook Out Finder</button>
                    </nav>

                    {/* TAB PANEL 1: HOTELS CONFIG MATRIX */}
                    {activeTab === 'hotels' && (
                        <main class="content-section">
                            <div class="panel-header">01 // Select Active Mission Venue Area</div>
                            <div class="venue-selector">
                                <div class={`venue-card ${currentVenue === 'raleigh' ? 'selected' : ''}`} onClick={() => setCurrentVenue('raleigh')}>
                                    <div class="venue-title">Raleigh-Durham, NC</div>
                                    <div class="venue-desc">Sheraton Imperial / Research Triangle Park</div>
                                </div>
                                <div class={`venue-card ${currentVenue === 'orlando' ? 'selected' : ''}`} onClick={() => setCurrentVenue('orlando')}>
                                    <div class="venue-title">Orlando, FL</div>
                                    <div class="venue-desc">Kia Center Arena (Formerly Amway Center)</div>
                                </div>
                                <div class={`venue-card ${currentVenue === 'grandrapids' ? 'selected' : ''}`} onClick={() => setCurrentVenue('grandrapids')}>
                                    <div class="venue-title">Grand Rapids, MI</div>
                                    <div class="venue-desc">Amway Grand Plaza / DeVos Place Complex</div>
                                </div>
                            </div>

                            <div class="grid-two-col">
                                <div class="cyber-panel">
                                    <div class="panel-header">02 // Live Hotel Search Shortcuts</div>
                                    <p style={{fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '20px', lineHeight: '1.5'}}>
                                        Launch external hyper-targeted live queries directly within the Google Hotel Engine for pre-filtered localized results:
                                    </p>
                                    <div class="btn-action-container">
                                        <a href={links.google} target="_blank" class="btn btn-cyan btn-full">Live Google Hotels ↗</a>
                                        <a href={links.cheapest} target="_blank" class="btn btn-full">Find Cheapest Nearby ↗</a>
                                    </div>
                                </div>

                                <div class="cyber-panel">
                                    <div class="panel-header">03 // Track Verified Variant Options</div>
                                    <form onSubmit={addHotelItem}>
                                        <div class="form-group">
                                            <label>Hotel Asset Designation Name</label>
                                            <input type="text" value={hotelName} onChange={(e) => setHotelName(e.target.value)} placeholder="e.g., Sheraton Imperial / Courtyard" required />
                                        </div>
                                        <div class="grid-two-col" style={{gap: '15px', marginBottom: '0'}}>
                                            <div class="form-group">
                                                <label>Nightly Matrix Rate ($)</label>
                                                <input type="number" value={hotelPrice} onChange={(e) => setHotelPrice(e.target.value)} min="1" required />
                                            </div>
                                            <div class="form-group">
                                                <label>Classification Tag</label>
                                                <select value={hotelType} onChange={(e) => setHotelType(e.target.value)}>
                                                    <option value="Budget Alternate">Budget Alternate</option>
                                                    <option value="Official Host Hotel">Official Host Hotel</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-full" style={{marginTop: '10px'}}>Inject Into Comparison Engine</button>
                                    </form>
                                </div>
                            </div>

                            <div class="cyber-panel" style={{marginTop: '25px'}}>
                                <div class="panel-header">04 // Monitored Budget Registry Storage</div>
                                <div class="table-responsive">
                                    <table class="cyber-table">
                                        <thead>
                                            <tr>
                                                <th>Captured Hotel Name</th>
                                                <th>Asset Tag</th>
                                                <th>Rate/Night</th>
                                                <th style={{textAlign: 'right'}}>System Command Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {hotelRegistry.length === 0 ? (
                                                <tr><td colSpan="4" style={{textAlign: 'center', color: 'var(--text-muted)', padding: '30px'}}>Tracked data registry is completely blank. Field input required.</td></tr>
                                            ) : (
                                                hotelRegistry.map(item => (
                                                    <tr key={item.id}>
                                                        <td style={{fontWeight: 700}}>{item.name}</td>
                                                        <td><span class={`badge ${item.type === 'Official Host Hotel' ? 'badge-host' : 'badge-budget'}`}>{item.type}</span></td>
                                                        <td style={{color: 'var(--neon-orange)', fontWeight: 800}}>${item.price}</td>
                                                        <td style={{textAlign: 'right'}}><button class="btn-del" onClick={() => purgeRegistryItem(item.id)}>Purge Asset</button></td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* TAB PANEL 2: COMPARISON CALCULATOR DELTA BLOCK */}
                    {activeTab === 'comparison' && (
                        <div class="content-section">
                            <div class="cyber-panel">
                                <div class="panel-header">Analytical Delta Matrix Evaluation</div>
                                <div class="metrics-grid">
                                    <div class="metric-card">
                                        <label>Active Host Target Rate</label>
                                        <div class="metric-val">{minHostPrice > 0 ? `$${minHostPrice}` : '$--'}</div>
                                    </div>
                                    <div class="metric-card">
                                        <label>Optimal Alternative Selection</label>
                                        <div class="metric-val">{minBudgetPrice > 0 ? `$${minBudgetPrice}` : '$--'}</div>
                                    </div>
                                    <div class="metric-card">
                                        <label>Net Scaled Delta Margin / Night</label>
                                        <div class="metric-val highlight">{minHostPrice > 0 && minBudgetPrice > 0 ? `$${netDelta}` : '$--'}</div>
                                    </div>
                                </div>

                                <div class="panel-header" style={{marginTop: '15px'}}>Calculated Delta Variance Overview</div>
                                <div style={{background: '#05080c', border: '1px solid var(--border-metal)', borderRadius: '6px', padding: '20px', lineHeight: '1.6', fontSize: '0.95rem'}}>
                                    {minHostPrice === 0 || minBudgetPrice === 0 ? (
                                        <p><span style={{color: 'var(--action-delete)'}}>[WARNING // INSUFFICIENT SYSTEM VARIABLES]</span> To activate tracking computations, register at least one <strong>Official Host Hotel</strong> asset and one <strong>Budget Alternate</strong> node tracking parameter under the hotel registry tab.</p>
                                    ) : netDelta > 0 ? (
                                        <p>System Optimization Confirming: Selecting the alternative structural options generates a net yield savings of <span style={{color: 'var(--neon-orange)', fontWeight: '900'}}>${netDelta} per night</span> over the premium host baseline matrix profile. Over a 3-night active mission timeline operation, this retains <span style={{color: '#00ff66', fontWeight: '900'}}>${netDelta * 3} in total cash-flow volume reserves</span>.</p>
                                    ) : netDelta === 0 ? (
                                        <p>Delta structural equilibrium detected. The selected alternative configurations show direct cost alignment balance metrics relative to baseline hosts.</p>
                                    ) : (
                                        <p>Data configuration anomaly: The logged official host selection yields lower rate calculations than alternative data options by ${Math.abs(netDelta)} per night.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB PANEL 3: SUSTENANCE & LATE NIGHT DRIVES BLOCK */}
                    {activeTab === 'food' && (
                        <div class="content-section">
                            <div class="grid-two-col" style={{marginBottom: '25px', alignItems: 'start'}}>
                                <div class="cyber-panel" style={{marginBottom: 0}}>
                                    <div class="panel-header">Localized High-Velocity Sustenance Mapping</div>
                                    <p style={{fontSize: '0.9rem', color: 'var(--text-muted)', lineHeight: '1.5'}}>
                                        Locating hyper-efficient operational late-night Cook Out locations within close geometric range of your selected mission conference venue coordinates.
                                    </p>
                                </div>

                                {/* ADDED NEW LOGISTIC FEATURE: TRACK NIGHTLY SHAKE RESERVES IN REALTIME */}
                                <div class="cyber-panel" style={{marginBottom: 0}}>
                                    <div class="panel-header">System Optimization: Team Fuel Tracker</div>
                                    <div class="fuel-counter-wrapper">
                                        <div class="fuel-title">Tracked Cook Out Shakes Needed</div>
                                        <div class="fuel-controls">
                                            <button class="fuel-btn" onClick={() => setShakesConsumed(Math.max(0, shakesConsumed - 1))}>-</button>
                                            <div class="fuel-value">{shakesConsumed}</div>
                                            <button class="fuel-btn" onClick={() => setShakesConsumed(shakesConsumed + 1)}>+</button>
                                        </div>
                                    </div>
                                    <p style={{fontSize: '0.75rem', color: 'var(--text-muted)'}}>
                                        Calculated Logistics Volume: {shakesConsumed * 400} Estimated Calories allocated for late-night session evaluation debriefing steps.
                                    </p>
                                </div>
                            </div>

                            <div class="food-grid">
                                {(locationSustenanceData[currentVenue] || []).map((spot, index) => (
                                    <div class="food-card" key={index}>
                                        <div class="food-header">
                                            <div class="food-name">{spot.name}</div>
                                            <span class="status-dot">ACTIVE</span>
                                        </div>
                                        <div class="food-meta">
                                            <strong>Range:</strong> {spot.distance}<br />
                                            <strong>Status:</strong> {spot.hours}<br />
                                            <span style={{color: 'var(--neon-orange)', fontSize: '0.75rem', fontWeight: 700}}>{spot.address}</span>
                                        </div>
                                        <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name + ' ' + spot.address)}`} target="_blank" rel="noopener noreferrer" class="btn btn-cyan btn-full" style={{fontSize: '0.75rem', padding: '10px 12px'}}>Engage Vector Route ↗</a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Initialize React Layer Initialization directly into Viewport Layout
        const root = ReactDOM.createRoot(document.getElementById('react-app-root'));
        root.render(<App />);
    </script>
</body>
</html>
