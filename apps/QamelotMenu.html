<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Complete, searchable directory for every Qamelot project page.">
  <meta name="theme-color" content="#070a10">
  <title>Qamelot Project Directory</title>
  <style>
    :root {
      --bg: #070a10;
      --panel: #0e1420;
      --panel-2: #121c2a;
      --line: rgba(57, 218, 255, .22);
      --text: #eefbff;
      --muted: #88a1ad;
      --cyan: #39daff;
      --lime: #79f7b5;
      --red: #ff4967;
      --violet: #a98cff;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(57, 218, 255, .14), transparent 30rem),
        radial-gradient(circle at 88% 22%, rgba(169, 140, 255, .1), transparent 28rem),
        var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .28; background-image: linear-gradient(rgba(57,218,255,.035) 1px, transparent 1px), linear-gradient(90deg,rgba(57,218,255,.035) 1px,transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(#000, transparent 85%); }
    .shell { position: relative; width: min(1240px, 100%); margin: 0 auto; padding: 26px clamp(16px, 4vw, 40px) 60px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; padding: 30px 0; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); font-size: .76rem; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 5.8rem); line-height: .88; letter-spacing: -.055em; text-wrap: balance; }
    .summary { max-width: 460px; margin: 12px 0 0; color: var(--muted); line-height: 1.55; }
    .home, .tool-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: rgba(14,20,32,.86); font-weight: 750; cursor: pointer; transition: transform .2s, border-color .2s, background .2s; }
    .home:hover, .tool-button:hover { transform: translateY(-2px); border-color: var(--cyan); background: #132130; }
    .dashboard { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 18px 0 2px; }
    .dashboard div { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(14,20,32,.72); }
    .dashboard strong,.dashboard span { display: block; }
    .dashboard strong { color: var(--cyan); font-size: 1.55rem; }
    .dashboard span { margin-top: 4px; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; }
    .tools { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: minmax(260px,2fr) repeat(5,auto); gap: 8px; padding: 14px 0; background: linear-gradient(rgba(7,10,16,.97),rgba(7,10,16,.9)); backdrop-filter: blur(18px); }
    input { width: 100%; min-height: 48px; padding: 10px 15px; color: var(--text); border: 1px solid var(--line); border-radius: 12px; background: rgba(14,20,32,.9); outline: none; }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(57, 218, 255, .12); }
    .select { min-height: 44px; padding: 8px 34px 8px 11px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: var(--panel); }
    .tool-button[aria-pressed="true"] { color: #071016; border-color: var(--lime); background: var(--lime); }
    .active-filters { display: flex; flex-wrap: wrap; gap: 7px; min-height: 26px; margin: 0 0 10px; }
    .filter-chip { padding: 5px 9px; border-radius: 999px; color: var(--cyan); background: rgba(57,218,255,.08); font-size: .7rem; }
    .count { display: grid; place-items: center; min-width: 100px; padding: 0 12px; color: var(--lime); border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-weight: 800; }
    #directory { display: grid; gap: 14px; }
    details { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(14,20,32,.86); box-shadow: 0 18px 48px rgba(0,0,0,.18); }
    summary { display: flex; justify-content: space-between; gap: 12px; padding: 18px 20px; cursor: pointer; font-weight: 850; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "+"; color: var(--cyan); margin-right: 10px; }
    details[open] summary::before { content: "−"; }
    summary span:first-of-type { margin-left: auto; }
    summary span { color: var(--muted); font-size: .8rem; font-weight: 700; }
    .links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
    .page-wrap { position: relative; min-width: 0; background: var(--panel-2); }
    .page { position: relative; display: block; min-width: 0; min-height: 88px; padding: 17px 48px 17px 17px; transition: background .2s ease, transform .2s ease; }
    .page::after { content: "↗"; position: absolute; right: 14px; top: 14px; color: var(--cyan); opacity: 0; transform: translate(-4px,4px); transition: .2s; }
    .page:hover, .page:focus-visible { z-index: 1; background: #17283a; outline: none; transform: translateY(-2px); }
    .page:hover::after, .page:focus-visible::after { opacity: 1; transform: none; }
    .page strong, .page small { display: block; overflow-wrap: anywhere; }
    .page strong { font-size: .9rem; }
    .page small { margin-top: 5px; color: var(--muted); font-size: .7rem; }
    .page.current { border-left: 3px solid var(--cyan); }
    .favorite { position: absolute; right: 10px; bottom: 10px; z-index: 2; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(7,10,16,.72); cursor: pointer; }
    .favorite:hover,.favorite.active { color: var(--gold); border-color: var(--gold); }
    .recent-mark { color: var(--lime); }
    .compact .links { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .compact .page { padding-block: 11px; }
    .compact .page { min-height: 54px; }
    .compact .page small { display: none; }
    .empty { padding: 40px 20px; color: var(--muted); text-align: center; border: 1px dashed var(--line); }
    footer { margin-top: 24px; padding-top: 18px; color: var(--muted); border-top: 1px solid var(--line); font-size: .8rem; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; transform: translateY(20px); opacity: 0; max-width: min(360px,calc(100% - 40px)); padding: 12px 15px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: #101c29; box-shadow: 0 18px 50px rgba(0,0,0,.45); transition: .25s; }
    .toast.show { transform: none; opacity: 1; }
    @media (max-width: 1080px) { .tools { grid-template-columns: minmax(240px,1fr) repeat(3,auto); } }
    @media (max-width: 820px) { .links { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tools { position: relative; grid-template-columns: 1fr 1fr 1fr; } .tools input { grid-column: 1 / -1; } .count { grid-column: 1 / -1; min-height: 40px; } }
    @media (max-width: 560px) {
      header { align-items: start; flex-direction: column; }
      .dashboard { grid-template-columns: 1fr 1fr; }
      .tools { position: relative; grid-template-columns: 1fr 1fr; }
      .tools input { grid-column: 1 / -1; }
      .tools .count { grid-column: 1 / -1; }
      .links, .compact .links { grid-template-columns: 1fr; }
      .count { min-height: 40px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">Qamelot system index</p>
        <h1>Project Directory</h1>
        <p class="summary">A verified launchpad for Qamelot games, tools, experiments, and featured projects.</p>
      </div>
      <a class="home" href="../index.html">Open Main Hub</a>
    </header>

    <section class="dashboard" aria-label="Directory overview">
      <div><strong id="totalStat">40</strong><span>Verified pages</span></div>
      <div><strong id="groupStat">6</strong><span>Collections</span></div>
      <div><strong id="favoriteStat">0</strong><span>Favorites</span></div>
      <div><strong id="recentStat">0</strong><span>Recent launches</span></div>
    </section>

    <div class="tools">
      <input id="filter" type="search" placeholder="Search projects, pages, or paths" aria-label="Search project directory">
      <select id="category" class="select" aria-label="Filter by collection"><option value="">All collections</option></select>
      <select id="sort" class="select" aria-label="Sort pages"><option value="original">Workspace order</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option><option value="group">Collection</option></select>
      <button class="tool-button" id="favoritesOnly" type="button" aria-pressed="false">★ Favorites</button>
      <button class="tool-button" id="recentOnly" type="button" aria-pressed="false">Recent</button>
      <button class="tool-button" id="randomLaunch" type="button">Surprise me</button>
      <button class="tool-button" id="clearFilter" type="button">Clear</button>
      <button class="tool-button" id="toggleGroups" type="button">Collapse</button>
      <button class="tool-button" id="toggleDensity" type="button" aria-pressed="false">Compact</button>
      <button class="tool-button" id="exportData" type="button">Export</button>
      <div class="count" id="count" aria-live="polite"></div>
    </div>

    <div class="active-filters" id="activeFilters" aria-live="polite"></div>

    <main id="directory"></main>
    <footer>Verified against the local workspace. Shortcuts: <b>/</b> search, <b>Esc</b> reset, <b>F</b> favorites, <b>R</b> random page.</footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    const pages = [
      ['Workspace', '../index.html', 'Main Development Hub'],
      ['Workspace', '../snippets/hf-gemma-background-animation-usage.html', 'HF Gemma Animation Example'],
      ['Core Apps', 'index.html', 'Mecha Strike: Overdrive'],
      ['Core Apps', 'ACAI.html', 'ACAI'],
      ['Core Apps', 'awesome.html', 'Interactive Nebula'],
      ['Core Apps', 'bptka_TD.html', 'BPTKA Tactical Defense'],
      ['Core Apps', 'C4N8.htm', 'Panther Arena Connect Four'],
      ['Core Apps', 'CalcuN8r.html', 'CalcuN8r'],
      ['Core Apps', 'CFPsimpleFooter.html', 'Social Footer'],
      ['Core Apps', 'Home.html', 'Qamelot Home'],
      ['Core Apps', 'MechaStrike.html', 'Mecha Strike Protocol'],
      ['Core Apps', 'MechaStrike_v3.html', 'Mecha Strike v3'],
      ['Core Apps', 'NeonPong.htm', 'Neon Pong'],
      ['Core Apps', 'QamelotConquest.html', 'Qamelot Conquest'],
      ['Core Apps', 'QamelotMenu.html', 'Qamelot Project Directory'],
      ['Core Apps', 'QamelotTacticalDefensev1.htm', 'Qamelot Tactical Defense'],
      ['Core Apps', 'QamelotTriNexusV1.htm', 'Qamelot Tri-Nexus'],
      ['Core Apps', 'QamoMATH.html', 'QamoMATH Classic'],
      ['Core Apps', 'qmathcore.html', 'Qamelot Math Core'],
      ['Core Apps', 'StixStaxStonzV1.htm', 'Stix Stax Stonz'],
      ['Core Apps', 'WebToolsResources.html', 'Web Tools and Resources'],
      ['Featured Projects', 'BruceLeeStyle/Index.html', 'Bruce Lee Interactive Studio'],
      ['Featured Projects', 'contractor-toolbelt/index.html', 'Contractor Tool Belt'],
      ['Featured Projects', 'courage-td/index.html', 'Courage Tower Defense'],
      ['Featured Projects', 'EcoTechComm/index.html', 'EcoTechComm'],
      ['Featured Projects', 'locmein/index.html', 'Loc-Me-In'],
      ['Featured Projects', 'N8Park/N8Park.html', 'N8 Parking Locator'],
      ['Featured Projects', 'perspective-painting/index.html', 'New Perspective Painting'],
      ['Featured Projects', 'pulse-productivity-studio/index.html', 'Pulse Productivity Studio'],
      ['Featured Projects', 'task-forge/index.html', 'Task Forge'],
      ['QamoMATH', 'QamoMATH/Index.html', 'QamoMATH Nexus'],
      ['QamoMATH', 'QamoMATH/QamoMATH.html', 'QamoMATH Studio'],
      ['DevDash', 'DevDash/DevDashV1.html', 'DevDashboard v1'],
      ['DevDash', 'DevDash/Pages/index.html', 'DevDash Pages'],
      ['DevDash', 'DevDash/blob-fighter.html', 'Blob Bash Royale'],
      ['DevDash', 'DevDash/push-complete.html', 'Push Complete'],
      ['DevDash', 'DevDash/QamelotConquest.html', 'Qamelot Conquest Dev Build'],
      ['DevDash', 'DevDash/QamelotTacticalDefensev1.html', 'Tactical Defense Sprite Build'],
      ['DevDash', 'DevDash/svg-studio.html', 'SVG Studio'],
      ['DevDash', 'DevDash/SVGStudio/sandbox.html', 'SVG Studio Sandbox']
    ];

    const $ = (selector) => document.querySelector(selector);
    const directory = $('#directory'), filter = $('#filter'), count = $('#count'), category = $('#category'), sort = $('#sort');
    const favoritesOnly = $('#favoritesOnly'), recentOnly = $('#recentOnly'), activeFilters = $('#activeFilters');
    let groupsExpanded = true;
    let favorites = new Set(JSON.parse(localStorage.getItem('qamelot-favorites') || '[]'));
    let recent = JSON.parse(localStorage.getItem('qamelot-recent') || '[]').filter((href) => pages.some((page) => page[1] === href)).slice(0, 8);

    const collections = [...new Set(pages.map((page) => page[0]))];
    category.insertAdjacentHTML('beforeend', collections.map((name) => `<option>${name}</option>`).join(''));
    $('#totalStat').textContent = pages.length;
    $('#groupStat').textContent = collections.length;

    if (localStorage.getItem('qamelot-directory-density') === 'compact') {
      directory.classList.add('compact');
      $('#toggleDensity').setAttribute('aria-pressed', 'true');
      $('#toggleDensity').textContent = 'Comfortable';
    }

    function toast(message) {
      const element = $('#toast');
      element.textContent = message;
      element.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => element.classList.remove('show'), 2200);
    }

    function visiblePages() {
      const needle = filter.value.trim().toLowerCase();
      let matches = pages.filter((page) => page.join(' ').toLowerCase().includes(needle));
      if (category.value) matches = matches.filter((page) => page[0] === category.value);
      if (favoritesOnly.getAttribute('aria-pressed') === 'true') matches = matches.filter((page) => favorites.has(page[1]));
      if (recentOnly.getAttribute('aria-pressed') === 'true') matches = matches.filter((page) => recent.includes(page[1])).sort((a, b) => recent.indexOf(a[1]) - recent.indexOf(b[1]));
      if (sort.value === 'az') matches.sort((a, b) => a[2].localeCompare(b[2]));
      if (sort.value === 'za') matches.sort((a, b) => b[2].localeCompare(a[2]));
      if (sort.value === 'group') matches.sort((a, b) => a[0].localeCompare(b[0]) || a[2].localeCompare(b[2]));
      return matches;
    }

    function render() {
      const matches = visiblePages();
      const groups = matches.reduce((map, page) => {
        if (!map.has(page[0])) map.set(page[0], []);
        map.get(page[0]).push(page);
        return map;
      }, new Map());
      count.textContent = `${matches.length} / ${pages.length} ${matches.length === 1 ? 'page' : 'pages'}`;
      $('#favoriteStat').textContent = favorites.size;
      $('#recentStat').textContent = recent.length;
      const chips = [];
      if (filter.value.trim()) chips.push(`Search: ${filter.value.trim()}`);
      if (category.value) chips.push(category.value);
      if (favoritesOnly.getAttribute('aria-pressed') === 'true') chips.push('Favorites only');
      if (recentOnly.getAttribute('aria-pressed') === 'true') chips.push('Recent only');
      if (sort.value !== 'original') chips.push(`Sort: ${sort.options[sort.selectedIndex].text}`);
      activeFilters.innerHTML = chips.map((chip) => `<span class="filter-chip">${chip}</span>`).join('');
      if (!matches.length) {
        directory.innerHTML = '<div class="empty"><strong>No matching pages</strong><br>Try clearing a filter or choosing another collection.</div>';
        return;
      }
      directory.innerHTML = [...groups].map(([group, items]) => `
        <details ${groupsExpanded || filter.value ? 'open' : ''}>
          <summary>${group}<span>${items.length} ${items.length === 1 ? 'page' : 'pages'}</span></summary>
          <div class="links">${items.map(([, href, label]) => `
            <article class="page-wrap">
              <a class="page ${href === 'QamelotMenu.html' ? 'current' : ''}" href="${href}" data-launch="${href}">
                <strong>${label}${recent[0] === href ? ' <span class="recent-mark">• recent</span>' : ''}</strong>
                <small>${href.replace(/^\.\.\//, '')}</small>
              </a>
              <button class="favorite ${favorites.has(href) ? 'active' : ''}" type="button" data-favorite="${href}" aria-label="${favorites.has(href) ? 'Remove from' : 'Add to'} favorites">★</button>
            </article>`).join('')}</div>
        </details>`).join('');
    }

    function resetFilters() {
      filter.value = '';
      category.value = '';
      sort.value = 'original';
      favoritesOnly.setAttribute('aria-pressed', 'false');
      recentOnly.setAttribute('aria-pressed', 'false');
      render();
    }

    function randomLaunch() {
      const options = visiblePages().filter((page) => page[1] !== 'QamelotMenu.html');
      if (!options.length) return toast('No launchable pages in this view.');
      const page = options[Math.floor(Math.random() * options.length)];
      recordRecent(page[1]);
      location.href = page[1];
    }

    function recordRecent(href) {
      recent = [href, ...recent.filter((item) => item !== href)].slice(0, 8);
      localStorage.setItem('qamelot-recent', JSON.stringify(recent));
    }

    [filter, category, sort].forEach((control) => control.addEventListener(control === filter ? 'input' : 'change', render));
    favoritesOnly.addEventListener('click', () => { favoritesOnly.setAttribute('aria-pressed', favoritesOnly.getAttribute('aria-pressed') !== 'true'); recentOnly.setAttribute('aria-pressed', 'false'); render(); });
    recentOnly.addEventListener('click', () => { recentOnly.setAttribute('aria-pressed', recentOnly.getAttribute('aria-pressed') !== 'true'); favoritesOnly.setAttribute('aria-pressed', 'false'); render(); });
    $('#clearFilter').addEventListener('click', () => { resetFilters(); filter.focus(); });
    $('#randomLaunch').addEventListener('click', randomLaunch);
    $('#toggleGroups').addEventListener('click', () => { groupsExpanded = !groupsExpanded; document.querySelectorAll('#directory details').forEach((group) => { group.open = groupsExpanded; }); $('#toggleGroups').textContent = groupsExpanded ? 'Collapse' : 'Expand'; });
    $('#toggleDensity').addEventListener('click', () => { const compact = directory.classList.toggle('compact'); $('#toggleDensity').setAttribute('aria-pressed', String(compact)); $('#toggleDensity').textContent = compact ? 'Comfortable' : 'Compact'; localStorage.setItem('qamelot-directory-density', compact ? 'compact' : 'comfortable'); });
    $('#exportData').addEventListener('click', () => { const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), pages: pages.map(([collection, href, title]) => ({ collection, title, href, favorite: favorites.has(href) })) }, null, 2)], { type: 'application/json' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'qamelot-directory.json'; link.click(); URL.revokeObjectURL(link.href); toast('Directory data exported.'); });
    directory.addEventListener('click', (event) => {
      const favoriteButton = event.target.closest('[data-favorite]');
      if (favoriteButton) {
        const href = favoriteButton.dataset.favorite;
        favorites.has(href) ? favorites.delete(href) : favorites.add(href);
        localStorage.setItem('qamelot-favorites', JSON.stringify([...favorites]));
        toast(favorites.has(href) ? 'Added to favorites.' : 'Removed from favorites.');
        render();
        return;
      }
      const launch = event.target.closest('[data-launch]');
      if (launch) recordRecent(launch.dataset.launch);
    });
    window.addEventListener('keydown', (event) => {
      const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
      if (event.key === '/' && !typing) { event.preventDefault(); filter.focus(); }
      if (event.key === 'Escape') { resetFilters(); filter.focus(); }
      if (!typing && event.key.toLowerCase() === 'f') { event.preventDefault(); favoritesOnly.click(); }
      if (!typing && event.key.toLowerCase() === 'r') { event.preventDefault(); randomLaunch(); }
    });
    render();
  </script>
</body>
</html>
