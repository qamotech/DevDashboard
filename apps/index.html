<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mecha Strike: Overdrive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; touch-action: none; color: white; font-family: 'Courier New', Courier, monospace;}
        .neon-text { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 40px #0ff; }
        .neon-red { text-shadow: 0 0 5px #fff, 0 0 10px #f00, 0 0 20px #f00; }
        .btn-cyber { background: rgba(0,255,255,0.1); border: 2px solid #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.4); transition: 0.1s; }
        .btn-cyber:active { transform: scale(0.95); background: rgba(0,255,255,0.3); }
        .ui-bar { transition: width 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playSFX = (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;

            if (type === 'laser') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(100, t+0.1);
                gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1); osc.start(t); osc.stop(t+0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.1);
                gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1); osc.start(t); osc.stop(t+0.1);
            } else if (type === 'explode') {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(10, t+0.4);
                gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t+0.4); osc.start(t); osc.stop(t+0.4);
            } else if (type === 'dash') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(800, t+0.2);
                gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.2); osc.start(t); osc.stop(t+0.2);
            } else if (type === 'powerup' || type === 'level') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(1200, t+0.3);
                gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.3); osc.start(t); osc.stop(t+0.3);
            } else if (type === 'emp') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, t); osc.frequency.linearRampToValueAtTime(1000, t+0.5);
                gain.gain.setValueAtTime(0.5, t); gain.gain.linearRampToValueAtTime(0, t+1.0); osc.start(t); osc.stop(t+1.0);
            }
        };

        const Game = () => {
            const canvasRef = useRef(null);
            const [uiState, setUiState] = useState('menu'); // menu, playing, gameover
            
            // UI State synced occasionally from game loop for performance
            const [hud, setHud] = useState({ hp: 100, maxHp: 100, xp: 0, level: 1, score: 0, wave: 1, emp: 1, combo: 1 });
            const [highScore, setHighScore] = useState(parseInt(localStorage.getItem('mecha_highscore')) || 0);

            // Core Engine State (Mutable to prevent React re-render lag)
            const engine = useRef({
                isRunning: false, lastTime: 0, shake: 0, frameCount: 0,
                player: { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, speed: 6, dashCD: 0, iFrames: 0, spread: 0, fireRate: 150, shield: 0 },
                keys: { up: false, down: false, left: false, right: false, shoot: false, dash: false, emp: false },
                state: { score: 0, combo: 1, comboTimer: 0, level: 1, xp: 0, nextXp: 100, wave: 1, kills: 0, emps: 1 },
                ents: { bullets: [], enemies: [], particles: [], powerups: [], texts: [], gems: [] },
                stars: [], nebulaOffset: 0
            }).current;

            // --- RENDER HELPERS ---
            const drawNeonPoly = (ctx, pts, color, glow = 15, fill = true) => {
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
                ctx.closePath();
                ctx.shadowBlur = glow; ctx.shadowColor = color;
                if(fill) { ctx.fillStyle = color; ctx.fill(); }
                else { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
                ctx.shadowBlur = 0; // reset
            };

            const triggerShake = (amt) => engine.shake = Math.min(engine.shake + amt, 30);
            const spawnText = (x, y, text, color) => engine.ents.texts.push({x, y, text, color, life: 60, vy: -1});
            
            const spawnExplosion = (x, y, color, count, speed=1) => {
                for(let i=0; i<count; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 5 * speed;
                    engine.ents.particles.push({
                        x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
                        life: 30 + Math.random()*30, size: Math.random()*4+1, color
                    });
                }
            };

            const triggerEMP = () => {
                if(engine.state.emps <= 0) return;
                engine.state.emps--;
                playSFX('emp');
                triggerShake(30);
                engine.ents.enemies.forEach(e => {
                    spawnExplosion(e.x, e.y, e.color, 20);
                    spawnText(e.x, e.y, "DESTROYED", "#0ff");
                    engine.state.score += e.maxHp * engine.state.combo;
                    spawnGem(e.x, e.y, e.maxHp);
                });
                engine.ents.enemies = [];
                engine.ents.bullets = engine.ents.bullets.filter(b => b.isPlayer); // Clear enemy bullets
                syncHUD();
            };

            const spawnGem = (x, y, amt) => {
                engine.ents.gems.push({x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, amt});
            };

            const syncHUD = () => {
                setHud({
                    hp: engine.player.hp, maxHp: engine.player.maxHp, xp: engine.state.xp,
                    level: engine.state.level, score: engine.state.score, wave: engine.state.wave,
                    emp: engine.state.emps, combo: engine.state.combo
                });
            };

            // --- MAIN GAME LOOP ---
            const gameLoop = (timestamp) => {
                if (!engine.isRunning) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d', { alpha: false });
                const dt = timestamp - engine.lastTime;
                engine.lastTime = timestamp;
                engine.frameCount++;

                // 1. CLEAR & BACKGROUND
                ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Screen Shake Apply
                ctx.save();
                if(engine.shake > 0) {
                    const dx = (Math.random()-0.5)*engine.shake;
                    const dy = (Math.random()-0.5)*engine.shake;
                    ctx.translate(dx, dy);
                    engine.shake *= 0.9; // decay
                    if(engine.shake < 0.5) engine.shake = 0;
                }

                // Additive Blending for Neon
                ctx.globalCompositeOperation = 'lighter';

                // Parallax Stars
                ctx.fillStyle = '#fff';
                engine.stars.forEach(s => {
                    s.y += s.speed;
                    if(s.y > canvas.height) s.y = 0;
                    ctx.globalAlpha = s.z;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
                ctx.globalAlpha = 1.0;

                // 2. PLAYER LOGIC
                const p = engine.player;
                if(p.dashCD > 0) p.dashCD--;
                if(p.iFrames > 0) p.iFrames--;

                // Movement & Dash
                let currentSpeed = p.speed;
                if(engine.keys.dash && p.dashCD === 0) {
                    currentSpeed = p.speed * 4;
                    p.dashCD = 60; // 1 sec cooldown
                    p.iFrames = 15; // Invincible while dashing
                    playSFX('dash');
                    triggerShake(2);
                }

                if(engine.keys.up && p.y > 20) p.y -= currentSpeed;
                if(engine.keys.down && p.y < canvas.height - 20) p.y += currentSpeed;
                if(engine.keys.left && p.x > 20) p.x -= currentSpeed;
                if(engine.keys.right && p.x < canvas.width - 20) p.x += currentSpeed;

                // Engine exhaust particles
                if(engine.keys.up || engine.keys.dash) {
                    engine.ents.particles.push({x: p.x + (Math.random()-0.5)*10, y: p.y + 15, vx: 0, vy: 5 + Math.random()*5, life: 20, size: 3, color: '#0ff'});
                }

                // Shooting
                if(engine.keys.shoot && engine.frameCount % Math.max(5, Math.floor(p.fireRate/16)) === 0) {
                    playSFX('laser');
                    engine.ents.bullets.push({x: p.x, y: p.y-20, vx: 0, vy: -15, color: '#0ff', dmg: 10, isPlayer: true});
                    if(p.spread > 0) {
                        engine.ents.bullets.push({x: p.x, y: p.y-20, vx: -4, vy: -14, color: '#0ff', dmg: 10, isPlayer: true});
                        engine.ents.bullets.push({x: p.x, y: p.y-20, vx: 4, vy: -14, color: '#0ff', dmg: 10, isPlayer: true});
                    }
                    if(p.spread > 1) {
                        engine.ents.bullets.push({x: p.x, y: p.y-20, vx: -8, vy: -12, color: '#0ff', dmg: 10, isPlayer: true});
                        engine.ents.bullets.push({x: p.x, y: p.y-20, vx: 8, vy: -12, color: '#0ff', dmg: 10, isPlayer: true});
                    }
                }

                // EMP Trigger
                if(engine.keys.emp) { engine.keys.emp = false; triggerEMP(); }

                // 3. ENEMY SPAWNING (Wave Logic)
                const s = engine.state;
                if (s.kills > s.wave * 15) {
                    s.wave++; s.kills = 0; spawnText(canvas.width/2, canvas.height/2, `WAVE ${s.wave}`, "#ff0");
                    if(s.wave % 5 === 0) s.emps++; // Give EMP every 5 waves
                    syncHUD();
                }

                const spawnRate = Math.max(10, 60 - s.wave * 2);
                if(engine.frameCount % spawnRate === 0) {
                    const type = Math.random();
                    let e = { x: Math.random()*(canvas.width-60)+30, y: -40, flash: 0 };
                    
                    if(s.wave % 5 === 0 && s.kills === 0 && engine.ents.enemies.length === 0) {
                        // BOSS
                        e = {...e, x: canvas.width/2, hp: 500*s.wave, maxHp: 500*s.wave, type: 'boss', color: '#f0f', size: 60, vy: 1, vx: 2};
                    } else if(type > 0.8 && s.wave > 2) {
                        // Tank
                        e = {...e, hp: 50 + s.wave*10, maxHp: 50 + s.wave*10, type: 'tank', color: '#f80', size: 25, vy: 1.5, vx: 0};
                    } else if(type > 0.5 && s.wave > 1) {
                        // Hunter (Homing)
                        e = {...e, hp: 20 + s.wave*5, maxHp: 20 + s.wave*5, type: 'hunter', color: '#f00', size: 15, vy: 3, vx: 0};
                    } else {
                        // Scout
                        e = {...e, hp: 10 + s.wave*2, maxHp: 10 + s.wave*2, type: 'scout', color: '#a0f', size: 12, vy: 4, vx: Math.sin(engine.frameCount/20)*2};
                    }
                    engine.ents.enemies.push(e);
                }

                // 4. ENTITY UPDATES
                
                // Combo Timer
                if(s.combo > 1) {
                    s.comboTimer--;
                    if(s.comboTimer <= 0) { s.combo = 1; syncHUD(); }
                }

                // Bullets
                for(let i=engine.ents.bullets.length-1; i>=0; i--) {
                    let b = engine.ents.bullets[i];
                    b.x += b.vx; b.y += b.vy;
                    drawNeonPoly(ctx, [[b.x-2, b.y], [b.x+2, b.y], [b.x, b.y-15]], b.color, 10);
                    if(b.y < -50 || b.y > canvas.height+50) engine.ents.bullets.splice(i,1);
                }

                // Enemies
                for(let i=engine.ents.enemies.length-1; i>=0; i--) {
                    let e = engine.ents.enemies[i];
                    
                    // AI Logic
                    if(e.type === 'hunter') {
                        e.x += (p.x - e.x) * 0.02; // Homing
                        e.y += e.vy;
                    } else if(e.type === 'boss') {
                        e.x += e.vx; e.y += e.vy;
                        if(e.x < 50 || e.x > canvas.width-50) e.vx *= -1;
                        if(e.y > 150) e.vy = 0;
                        // Boss Shoot
                        if(engine.frameCount % 30 === 0) {
                            engine.ents.bullets.push({x: e.x, y: e.y+30, vx: (Math.random()-0.5)*5, vy: 8, color: '#f0f', dmg: 20, isPlayer: false});
                        }
                    } else {
                        e.x += e.vx; e.y += e.vy;
                    }
                    if(e.flash > 0) e.flash--;

                    // Draw Enemy
                    ctx.save(); ctx.translate(e.x, e.y);
                    const eCol = e.flash > 0 ? '#fff' : e.color;
                    if(e.type === 'scout') drawNeonPoly(ctx, [[0,10], [10,-10], [0,-5], [-10,-10]], eCol, 15);
                    if(e.type === 'hunter') drawNeonPoly(ctx, [[0,15], [15,0], [5,-15], [-5,-15], [-15,0]], eCol, 15);
                    if(e.type === 'tank') drawNeonPoly(ctx, [[-20,-20], [20,-20], [20,20], [-20,20]], eCol, 10, false);
                    if(e.type === 'boss') drawNeonPoly(ctx, [[0,40], [50,-20], [20,-40], [-20,-40], [-50,-20]], eCol, 20);
                    
                    // Health Bar
                    if(e.hp < e.maxHp) {
                        ctx.fillStyle = '#f00'; ctx.fillRect(-e.size, -e.size-10, e.size*2, 4);
                        ctx.fillStyle = '#0f0'; ctx.fillRect(-e.size, -e.size-10, (e.size*2)*(e.hp/e.maxHp), 4);
                    }
                    ctx.restore();

                    // Collision with Player
                    if(p.iFrames <= 0 && Math.hypot(e.x - p.x, e.y - p.y) < e.size + 15) {
                        playSFX('hit'); triggerShake(15);
                        let dmg = e.type==='boss'?50:e.type==='tank'?30:15;
                        if(p.shield > 0) { p.shield--; spawnText(p.x, p.y, "BLOCKED", "#0ff"); }
                        else p.hp -= dmg;
                        
                        p.iFrames = 30;
                        spawnExplosion(p.x, p.y, '#f00', 10);
                        if(p.hp <= 0) { gameOver(); return; }
                        syncHUD();
                    }

                    // Collision with Bullets
                    let hit = false;
                    for(let j=engine.ents.bullets.length-1; j>=0; j--) {
                        let b = engine.ents.bullets[j];
                        if(b.isPlayer && Math.hypot(e.x - b.x, e.y - b.y) < e.size + 10) {
                            e.hp -= b.dmg; e.flash = 3;
                            spawnExplosion(b.x, b.y, e.color, 3, 0.5);
                            engine.ents.bullets.splice(j, 1);
                            if(e.hp <= 0) {
                                hit = true;
                                playSFX('explode'); triggerShake(e.type==='boss'?20:5);
                                spawnExplosion(e.x, e.y, e.color, e.type==='boss'?50:15);
                                let pts = e.type==='boss'?1000:e.maxHp;
                                s.score += pts * s.combo;
                                spawnText(e.x, e.y, pts*s.combo, "#ff0");
                                
                                // Combo Update
                                s.combo = Math.min(10, s.combo + 1);
                                s.comboTimer = 180; // 3 secs
                                s.kills++;
                                
                                // Loot Drop
                                spawnGem(e.x, e.y, e.maxHp);
                                if(Math.random() > 0.9) engine.ents.powerups.push({x: e.x, y: e.y, type: ['heal','spread','fire','shield'][Math.floor(Math.random()*4)], vy: 1});

                                engine.ents.enemies.splice(i, 1);
                                syncHUD();
                            }
                            break; // Bullet destroyed
                        }
                    }
                    if(!hit && e.y > canvas.height + 50) engine.ents.enemies.splice(i, 1);
                }

                // Gems (XP/Loot Magnet)
                for(let i=engine.ents.gems.length-1; i>=0; i--) {
                    let g = engine.ents.gems[i];
                    // Magnetize if close
                    if(Math.hypot(g.x - p.x, g.y - p.y) < 150) {
                        g.x += (p.x - g.x) * 0.05; g.y += (p.y - g.y) * 0.05;
                    } else {
                        g.x += g.vx; g.y += g.vy; g.vy += 0.1; // slight gravity
                    }
                    
                    ctx.fillStyle = '#0f0'; ctx.shadowColor = '#0f0'; ctx.shadowBlur = 10;
                    ctx.fillRect(g.x-3, g.y-3, 6, 6);

                    if(Math.hypot(g.x - p.x, g.y - p.y) < 20) {
                        s.xp += g.amt;
                        if(s.xp >= s.nextXp) {
                            // Level Up!
                            playSFX('level');
                            s.level++; s.xp -= s.nextXp; s.nextXp = Math.floor(s.nextXp * 1.5);
                            p.maxHp += 20; p.hp = p.maxHp; p.fireRate = Math.max(50, p.fireRate - 10);
                            spawnText(p.x, p.y-30, "LEVEL UP!", "#0ff"); triggerShake(5);
                        }
                        engine.ents.gems.splice(i, 1);
                        syncHUD();
                    } else if (g.y > canvas.height) { engine.ents.gems.splice(i, 1); }
                }

                // Powerups
                for(let i=engine.ents.powerups.length-1; i>=0; i--) {
                    let pw = engine.ents.powerups[i];
                    pw.y += pw.vy;
                    let c = pw.type==='heal'?'#0f0':pw.type==='shield'?'#00f':'#ff0';
                    drawNeonPoly(ctx, [[pw.x, pw.y-10], [pw.x+10, pw.y], [pw.x, pw.y+10], [pw.x-10, pw.y]], c, 15);
                    
                    if(Math.hypot(pw.x - p.x, pw.y - p.y) < 30) {
                        playSFX('powerup');
                        spawnText(p.x, p.y, pw.type.toUpperCase(), c);
                        if(pw.type==='heal') p.hp = Math.min(p.maxHp, p.hp + 50);
                        if(pw.type==='spread') p.spread = Math.min(2, p.spread + 1);
                        if(pw.type==='fire') p.fireRate = Math.max(30, p.fireRate - 20);
                        if(pw.type==='shield') p.shield = 3;
                        engine.ents.powerups.splice(i, 1);
                        syncHUD();
                    } else if(pw.y > canvas.height) { engine.ents.powerups.splice(i, 1); }
                }

                // Particles & Texts
                for(let i=engine.ents.particles.length-1; i>=0; i--) {
                    let pt = engine.ents.particles[i];
                    pt.x += pt.vx; pt.y += pt.vy; pt.life--; pt.vx *= 0.95; pt.vy *= 0.95;
                    ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.life/30);
                    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                    if(pt.life <= 0) engine.ents.particles.splice(i, 1);
                }
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;

                for(let i=engine.ents.texts.length-1; i>=0; i--) {
                    let tx = engine.ents.texts[i];
                    tx.y += tx.vy; tx.life--;
                    ctx.fillStyle = tx.color; ctx.font = "bold 16px Courier"; ctx.textAlign = "center";
                    ctx.globalAlpha = Math.max(0, tx.life/60);
                    ctx.fillText(tx.text, tx.x, tx.y);
                    if(tx.life <= 0) engine.ents.texts.splice(i, 1);
                }
                ctx.globalAlpha = 1.0;

                // 5. DRAW PLAYER
                if(p.iFrames % 4 < 2) { // Blink if invincible
                    ctx.save(); ctx.translate(p.x, p.y);
                    if(p.shield > 0) {
                        ctx.beginPath(); ctx.arc(0,0, 30, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(0,100,255, ${0.5 + Math.sin(engine.frameCount/10)*0.5})`;
                        ctx.lineWidth = 4; ctx.stroke();
                    }
                    // Ship Chassis
                    drawNeonPoly(ctx, [[0, -25], [15, 15], [0, 5], [-15, 15]], '#0ff', 20);
                    ctx.fillStyle = '#fff'; ctx.fillRect(-2, -5, 4, 10); // Core
                    ctx.restore();
                }

                // Restore context from screen shake
                ctx.restore();

                // Danger Overlay
                if(p.hp < p.maxHp * 0.3) {
                    ctx.fillStyle = `rgba(255,0,0,${Math.sin(engine.frameCount/5)*0.2})`;
                    ctx.fillRect(0,0, canvas.width, canvas.height);
                }

                requestAnimationFrame(gameLoop);
            };

            const gameOver = () => {
                engine.isRunning = false;
                setUiState('gameover');
                if(engine.state.score > highScore) {
                    setHighScore(engine.state.score);
                    localStorage.setItem('mecha_highscore', engine.state.score);
                }
            };

            // --- INIT & CONTROLS ---
            const startGame = () => {
                if (engine.isRunning) return;
                const canvas = canvasRef.current;
                
                // Reset State
                engine.player = { x: canvas.width/2, y: canvas.height-80, vx: 0, vy: 0, hp: 100, maxHp: 100, speed: 6, dashCD: 0, iFrames: 0, spread: 0, fireRate: 150, shield: 0 };
                engine.state = { score: 0, combo: 1, comboTimer: 0, level: 1, xp: 0, nextXp: 100, wave: 1, kills: 0, emps: 1 };
                engine.ents = { bullets: [], enemies: [], particles: [], powerups: [], texts: [], gems: [] };
                engine.shake = 0; engine.frameCount = 0;
                
                // Init Stars
                engine.stars = Array.from({length: 150}).map(() => ({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    speed: Math.random() * 3 + 0.5, size: Math.random() * 2 + 1, z: Math.random()
                }));

                syncHUD();
                setUiState('playing');
                engine.isRunning = true;
                engine.lastTime = performance.now();
                requestAnimationFrame(gameLoop);
                
                if(audioCtx.state === 'suspended') audioCtx.resume();
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                window.addEventListener('resize', resize); resize();

                const kMap = { 'ArrowUp':'up','KeyW':'up', 'ArrowDown':'down','KeyS':'down', 'ArrowLeft':'left','KeyA':'left', 'ArrowRight':'right','KeyD':'right', 'Space':'shoot', 'ShiftLeft':'dash','ShiftRight':'dash', 'KeyE':'emp' };
                const down = (e) => { if(kMap[e.code]) engine.keys[kMap[e.code]] = true; };
                const up = (e) => { if(kMap[e.code]) engine.keys[kMap[e.code]] = false; };
                
                window.addEventListener('keydown', down); window.addEventListener('keyup', up);
                return () => { window.removeEventListener('resize', resize); window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); engine.isRunning = false; };
            }, []);

            const btn = (k, v) => (e) => { e.preventDefault(); engine.keys[k] = v; };

            return (
                <div className="relative w-screen h-screen overflow-hidden select-none">
                    <canvas ref={canvasRef} className="absolute inset-0 z-0"></canvas>
                    
                    {/* IN-GAME HUD */}
                    {uiState === 'playing' && (
                        <div className="absolute top-0 left-0 w-full p-4 z-10 pointer-events-none flex flex-col gap-2">
                            <div className="flex justify-between items-start">
                                <div className="flex flex-col w-1/3 max-w-[300px]">
                                    <div className="flex justify-between font-bold text-lg neon-text"><span>LVL {hud.level}</span><span>SCORE: {hud.score}</span></div>
                                    <div className="h-4 bg-gray-800 rounded border border-gray-600 mb-1 overflow-hidden relative">
                                        <div className="absolute top-0 left-0 h-full bg-red-600 ui-bar" style={{width: `${(hud.hp/hud.maxHp)*100}%`}}></div>
                                        <span className="absolute w-full text-center text-xs font-bold leading-4">{hud.hp}/{hud.maxHp}</span>
                                    </div>
                                    <div className="h-2 bg-gray-800 rounded border border-gray-600 overflow-hidden relative">
                                        <div className="absolute top-0 left-0 h-full bg-green-500 ui-bar" style={{width: `${(hud.xp/(100*Math.pow(1.5, hud.level-1)))*100}%`}}></div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="text-2xl font-black text-yellow-400">WAVE {hud.wave}</div>
                                    {hud.combo > 1 && <div className="text-xl font-bold text-pink-500 animate-pulse">{hud.combo}x COMBO!</div>}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MENUS */}
                    {uiState !== 'playing' && (
                        <div className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md">
                            <h1 className="text-4xl md:text-6xl font-black italic mb-2 neon-text text-center text-cyan-400 tracking-widest">MECHA STRIKE</h1>
                            <h2 className="text-2xl md:text-3xl font-bold mb-8 text-pink-500 tracking-[0.4em]">OVERDRIVE</h2>
                            
                            {uiState === 'gameover' && (
                                <div className="text-center mb-8">
                                    <div className="text-4xl neon-red font-black mb-2 animate-bounce">SYSTEM FAILURE</div>
                                    <div className="text-xl">SCORE: {hud.score} | WAVE: {hud.wave}</div>
                                </div>
                            )}

                            <div className="text-yellow-400 text-lg mb-8 font-bold border-b border-yellow-400 pb-2">HIGH SCORE: {highScore}</div>

                            <button onClick={startGame} className="px-10 py-4 text-2xl font-bold rounded-lg btn-cyber cursor-pointer uppercase">
                                {uiState === 'menu' ? 'Initialize Engine' : 'Reboot System'}
                            </button>

                            <div className="mt-10 text-gray-400 text-sm md:text-base text-center max-w-lg px-4 grid grid-cols-2 gap-4">
                                <div><b className="text-cyan-400">PC CONTROLS</b><br/>WASD/Arrows: Move<br/>SPACE: Fire<br/>SHIFT: Dash<br/>E: EMP Bomb</div>
                                <div><b className="text-pink-400">UPGRADES</b><br/>Green: Health<br/>Yellow: Spread<br/>Blue: Shield<br/>Gems: Level Up</div>
                            </div>
                        </div>
                    )}

                    {/* MOBILE CONTROLS */}
                    <div className="absolute bottom-4 left-0 right-0 z-20 flex justify-between px-4 pointer-events-none md:hidden">
                        <div className="grid grid-cols-3 grid-rows-3 gap-1 w-36 h-36 pointer-events-auto opacity-60">
                            <div/><button className="bg-white/10 rounded-lg active:bg-cyan-500/50" onTouchStart={btn('up',true)} onTouchEnd={btn('up',false)}>▲</button><div/>
                            <button className="bg-white/10 rounded-lg active:bg-cyan-500/50" onTouchStart={btn('left',true)} onTouchEnd={btn('left',false)}>◀</button>
                            <div className="bg-white/5 rounded-full"/>
                            <button className="bg-white/10 rounded-lg active:bg-cyan-500/50" onTouchStart={btn('right',true)} onTouchEnd={btn('right',false)}>▶</button>
                            <div/><button className="bg-white/10 rounded-lg active:bg-cyan-500/50" onTouchStart={btn('down',true)} onTouchEnd={btn('down',false)}>▼</button><div/>
                        </div>
                        <div className="flex flex-col justify-end gap-2 pointer-events-auto opacity-70 pb-2">
                            <div className="flex justify-end gap-2 mb-2">
                                <button className="w-16 h-16 bg-purple-500/20 border-2 border-purple-500 rounded-full active:bg-purple-500/60 font-bold"
                                        onTouchStart={btn('emp',true)} onTouchEnd={btn('emp',false)}>EMP({hud.emp})</button>
                                <button className="w-16 h-16 bg-yellow-500/20 border-2 border-yellow-500 rounded-full active:bg-yellow-500/60 font-bold"
                                        onTouchStart={btn('dash',true)} onTouchEnd={btn('dash',false)}>DASH</button>
                            </div>
                            <button className="w-24 h-24 bg-red-500/20 border-4 border-red-500 rounded-full active:bg-red-500/60 shadow-[0_0_15px_rgba(255,0,0,0.5)] font-bold"
                                    onTouchStart={btn('shoot',true)} onTouchEnd={btn('shoot',false)}>FIRE</button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
