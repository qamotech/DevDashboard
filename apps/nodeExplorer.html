<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Stabilizer</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; color: #fff; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h1 id="status">System Stable</h1>
        <p>Keep the nodes linked. Don't let them drift!</p>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let nodes = [], escaped = 0;
        
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        class Node {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                // Friction
                this.vx *= 0.99; this.vy *= 0.99;
                
                // Check if escaped
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    escaped++;
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        window.addEventListener('mousemove', e => {
            nodes.forEach(n => {
                let dx = e.x - n.x, dy = e.y - n.y, dist = Math.hypot(dx, dy);
                if (dist < 100) { // Repel/Push nodes back
                    n.vx -= dx * 0.05; n.vy -= dy * 0.05;
                }
            });
        });

        for(let i=0; i<20; i++) nodes.push(new Node());

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            nodes.forEach(n => {
                n.update(); n.draw();
            });

            document.getElementById('status').innerText = `Escaped: ${escaped}/5`;
            if (escaped >= 5) {
                document.getElementById('status').innerText = "SYSTEM COLLAPSED";
            } else {
                requestAnimationFrame(animate);
            }
        }
        animate();
    </script>
</body>
</html>
