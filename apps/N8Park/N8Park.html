<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS.PARKING_LOCATOR_v1.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* --- AI-TERMINAL AESTHETIC --- */
        :root {
            --bg-color: #0D1117;
            --panel-bg: rgba(13, 17, 23, 0.85);
            --cyan: #00E5FF;
            --amber: #FFAB00;
            --text-main: #E6EDF3;
            --font-mono: 'Fira Code', 'Courier New', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg-color); font-family: var(--font-sans); color: var(--text-main); overflow: hidden; }

        /* Header / Terminal Readout */
        header {
            position: absolute; top: 0; width: 100%; z-index: 1000;
            background: var(--bg-color); border-bottom: 1px solid var(--cyan);
            padding: 10px 20px; font-family: var(--font-mono); font-size: 14px;
            display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
        }

        .status-dot {
            height: 10px; width: 10px; background-color: var(--cyan);
            border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 229, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
        }

        /* Map Container */
        #map { height: 100%; width: 100%; z-index: 1; }

        /* Custom Map Nodes */
        .cyber-node {
            width: 20px; height: 20px; border-radius: 2px;
            background: transparent; cursor: pointer; transition: all 0.3s ease;
        }
        .node-active { border: 2px solid var(--cyan); box-shadow: 0 0 10px var(--cyan), inset 0 0 5px var(--cyan); }
        .node-warning { border: 2px solid var(--amber); box-shadow: 0 0 5px var(--amber); background: rgba(255, 171, 0, 0.2); }

        /* Data Panel (Slide Up) */
        #data-panel {
            position: absolute; bottom: -300px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px;
            background: var(--panel-bg); border: 1px solid var(--cyan); border-radius: 4px 4px 0 0;
            padding: 20px; z-index: 1000; transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            backdrop-filter: blur(5px); font-family: var(--font-mono);
        }
        
        #data-panel.visible { bottom: 0; box-shadow: 0 -5px 20px rgba(0, 229, 255, 0.15); }
        
        .panel-row { margin-bottom: 12px; font-size: 14px; }
        .data-label { color: #8B949E; }
        .data-value { color: var(--cyan); font-weight: bold; }
        .value-warning { color: var(--amber); }

        .btn-route {
            display: block; width: 100%; padding: 12px; margin-top: 20px;
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            font-family: var(--font-mono); font-size: 16px; cursor: pointer;
            text-transform: uppercase; transition: all 0.2s ease;
        }
        .btn-route:hover { background: var(--cyan); color: var(--bg-color); }
        
        #close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: var(--cyan); font-weight: bold;}
    </style>
</head>
<body>

    <header>
        <div>> SYS.PARKING_LOCATOR_v1.0</div>
        <div><span class="status-dot" id="status-indicator"></span></div>
    </header>

    <div id="map"></div>

    <div id="data-panel">
        <div id="close-btn">[X]</div>
        <div class="panel-row"><span class="data-label">[ID]: </span><span class="data-value" id="ui-id">--</span></div>
        <div class="panel-row"><span class="data-label">[CAPACITY]: </span><span class="data-value" id="ui-cap">--</span></div>
        <div class="panel-row"><span class="data-label">[RATES]: </span><span class="data-value" id="ui-rate">--</span></div>
        <button class="btn-route">[ INITIATE ROUTE ]</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map (Centered around East Baltimore)
        const map = L.map('map', { zoomControl: false }).setView([39.3080, -76.5700], 14);

        // Dark Matter Base Layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        const dataPanel = document.getElementById('data-panel');
        const closeBtn = document.getElementById('close-btn');

        closeBtn.addEventListener('click', () => { dataPanel.classList.remove('visible'); });

        // 2. Fetch Data from Python Backend
        async function fetchParkingData() {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/parking');
                const data = await response.json();
                renderNodes(data.nodes);
            } catch (error) {
                console.error("SYS.ERR: FEED_DISCONNECTED", error);
                document.getElementById('status-indicator').style.backgroundColor = 'red';
                document.getElementById('status-indicator').style.boxShadow = 'none';
            }
        }

        // 3. Render Nodes on Map
        function renderNodes(nodes) {
            nodes.forEach(node => {
                const isOpen = node.capacity.open > 0;
                const nodeClass = isOpen ? 'node-active' : 'node-warning';

                // Create custom HTML icon
                const customIcon = L.divIcon({
                    className: `cyber-node ${nodeClass}`,
                    iconSize: [20, 20]
                });

                const marker = L.marker([node.lat, node.lng], { icon: customIcon }).addTo(map);

                // 4. Click Event -> Open Panel
                marker.on('click', () => {
                    document.getElementById('ui-id').innerText = node.name;
                    
                    const capElement = document.getElementById('ui-cap');
                    const percent = Math.round((node.capacity.open / node.capacity.max) * 100);
                    
                    if (isOpen) {
                        capElement.innerText = `${percent}% OPEN / ${node.capacity.open} SPACES`;
                        capElement.className = 'data-value';
                    } else {
                        capElement.innerText = `0% OPEN / LOT FULL`;
                        capElement.className = 'data-value value-warning';
                    }

                    document.getElementById('ui-rate').innerText = node.rate;
                    dataPanel.classList.add('visible');
                    
                    // Pan map slightly to accommodate the panel
                    map.flyTo([node.lat - 0.005, node.lng], 15);
                });
            });
        }

        // Boot Sequence
        setTimeout(fetchParkingData, 500);
    </script>
</body>
</html>
