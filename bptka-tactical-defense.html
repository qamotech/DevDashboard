<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://i.imgur.com/p7JzFKA.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPTKA: Tactical Defense</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body, html {
            margin: 0; padding: 0;
            background-color: #060913;
            color: #d0e0ff;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Safe margin container that scales perfectly */
        #app-container {
            width: 96vw;
            height: 96vh;
            max-width: 1400px;
            background-color: rgba(13, 20, 35, 0.85);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 2px #00d2ff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP BAR --- */
        #top-bar {
            height: 50px; min-height: 50px;
            background: linear-gradient(90deg, #111122, #0b0f19, #111122);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; border-bottom: 2px solid #00ff66;
            z-index: 10;
        }

        .stat-group { display: flex; gap: 15px; align-items: center; }
        .stat { font-size: 14px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .stat-icon { font-size: 16px; }
        .c-red { color: #ff3366; } .c-gold { color: #ffd700; } .c-cyan { color: #00ffff; }

        .ctrl-btn {
            background: rgba(0, 210, 255, 0.2); border: 1px solid #00d2ff; color: #fff;
            padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .ctrl-btn:hover { background: #00d2ff; }
        .ctrl-btn.active { background: #00ff66; border-color: #00ff66; color: #060913; }

        /* --- GAME CANVAS AREA --- */
        #canvas-wrapper {
            flex-grow: 1;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0a162b 0%, #05050a 100%);
            position: relative; overflow: hidden;
            border-bottom: 2px solid #00ff66;
        }

        #game-canvas {
            background: 
                linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            max-width: 100%; max-height: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.5) inset;
        }

        /* --- BOTTOM PANEL --- */
        #bottom-panel {
            height: 100px; min-height: 100px; /* Increased height slightly for larger icons */
            background: #0b0b14;
            display: flex; padding: 8px; gap: 10px;
        }

        .panel-section { display: flex; gap: 8px; flex-grow: 1; justify-content: center; }

        /* Shop Buttons */
        .shop-btn {
            flex: 1; max-width: 95px; /* Increased width to accommodate larger icon */
            background: #111122; border: 1.5px solid #332255; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: 0.2s;
        }
        .shop-btn:hover { border-color: #00ffff; background: #1a1a3a; transform: translateY(-2px); }
        .shop-btn.selected { border-color: #ff9900; background: #332200; box-shadow: 0 0 10px #ff9900; }
        .shop-btn.disabled { opacity: 0.3; pointer-events: none; }
        
        .preview-cvs { width: 50px; height: 50px; pointer-events: none; } /* Much larger preview canvas */
        .shop-lbl { font-size: 9px; font-weight: bold; letter-spacing: 0.5px; margin-top: 2px; text-transform: uppercase; color: #aaa; pointer-events: none; }
        .shop-cost { font-size: 11px; font-weight: 900; color: #ffd700; pointer-events: none; }

        /* Action Buttons */
        .action-container { display: flex; flex-direction: column; gap: 5px; min-width: 120px; }
        .big-btn {
            flex-grow: 1; background: linear-gradient(135deg, #008822, #00aa33); border: none;
            border-radius: 8px; color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; text-shadow: 0 2px 2px rgba(0,0,0,0.5);
        }
        .big-btn:hover { background: linear-gradient(135deg, #00aa33, #00cc44); }
        .big-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* Upgrade Panel (Hidden by default) */
        #upgrade-ui { display: none; width: 100%; gap: 15px; align-items: center; justify-content: space-between; padding: 0 20px;}
        .upg-info { font-size: 12px; color: #aaa; line-height: 1.5; }
        .upg-info h3 { margin: 0 0 4px 0; color: #00ffff; font-size: 16px; text-transform: uppercase; }
        .hl { color: #fff; font-weight: bold; }
        
        .upg-btn { background: #cc8800; border: none; border-radius: 6px; padding: 8px 15px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px;}
        .upg-btn:hover { background: #ffaa00; }
        .sell-btn { background: #aa0033; border: none; border-radius: 6px; padding: 8px 15px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px;}
        .sell-btn:hover { background: #ff3366; }
        .tgt-btn { background: #334; border: 1px solid #556; border-radius: 6px; padding: 8px; color: #fff; cursor: pointer; font-size: 11px;}
        .tgt-btn:hover { background: #556; }

        /* Game Over */
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #game-over h1 { color: #ff3366; font-size: 40px; text-shadow: 0 0 20px #ff3366; margin: 0 0 10px 0; letter-spacing: 2px;}
        #game-over p { font-size: 18px; margin-bottom: 30px; }
        .retry-btn { background: #ff3366; color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;}
        .retry-btn:hover { background: #ff6688; }

        /* Responsive scaling for very small phones */
        @media (max-width: 600px) {
            .shop-btn { max-width: 60px; }
            .preview-cvs { width: 36px; height: 36px; }
            .shop-lbl { font-size: 7px; }
            .shop-cost { font-size: 9px; }
            .big-btn { font-size: 11px; }
            .upg-info h3 { font-size: 14px; }
            .upg-info { font-size: 10px; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Top Status Bar -->
    <div id="top-bar">
        <div class="stat-group">
            <div class="stat"><span class="stat-icon c-red">❤</span> <span id="ui-lives">20</span></div>
            <div class="stat"><span class="stat-icon c-gold">⚡</span> $<span id="ui-gold">600</span></div>
            <div class="stat"><span class="stat-icon c-cyan">⚓</span> W: <span id="ui-wave">0</span></div>
        </div>
        <div class="stat-group">
            <button class="ctrl-btn" id="btn-pause">PAUSE</button>
            <button class="ctrl-btn" id="btn-spd-1">1X</button>
            <button class="ctrl-btn" id="btn-spd-2">2X</button>
            <button class="ctrl-btn" id="btn-spd-4">4X</button>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="game-over">
            <h1>CORE COMPROMISED</h1>
            <p>Defenses breached on Wave <span id="go-wave">0</span></p>
            <button class="retry-btn" onclick="resetGame()">DEPLOY AGAIN</button>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div id="bottom-panel">
        <!-- Shop UI -->
        <div id="shop-ui" class="panel-section">
            <div class="shop-btn" id="shop-b" data-type="b" onclick="selectTower('b')">
                <canvas class="preview-cvs" id="prev-b"></canvas>
                <div class="shop-lbl">Panther</div><div class="shop-cost">$100</div>
            </div>
            <div class="shop-btn" id="shop-p" data-type="p" onclick="selectTower('p')">
                <canvas class="preview-cvs" id="prev-p"></canvas>
                <div class="shop-lbl">Plasma</div><div class="shop-cost">$175</div>
            </div>
            <div class="shop-btn" id="shop-t" data-type="t" onclick="selectTower('t')">
                <canvas class="preview-cvs" id="prev-t"></canvas>
                <div class="shop-lbl">Tesla</div><div class="shop-cost">$250</div>
            </div>
            <div class="shop-btn" id="shop-k" data-type="k" onclick="selectTower('k')">
                <canvas class="preview-cvs" id="prev-k"></canvas>
                <div class="shop-lbl">Templar</div><div class="shop-cost">$300</div>
            </div>
            <div class="shop-btn" id="shop-a" data-type="a" onclick="selectTower('a')">
                <canvas class="preview-cvs" id="prev-a"></canvas>
                <div class="shop-lbl">Artillery</div><div class="shop-cost">$400</div>
            </div>
        </div>

        <!-- Upgrade UI -->
        <div id="upgrade-ui" class="panel-section">
            <div class="upg-info">
                <h3 id="upg-name">TOWER</h3>
                <div>Lvl: <span class="hl" id="upg-lvl">1</span>/3 | Dmg: <span class="hl" id="upg-dmg">0</span></div>
                <div>Rng: <span class="hl" id="upg-rng">0</span> | Target: <span class="hl c-cyan" id="upg-tgt">FIRST</span></div>
            </div>
            <div style="display:flex; flex-direction:column; gap:5px;">
                <button class="tgt-btn" onclick="cycleTarget()">CHANGE TARGET</button>
                <button class="sell-btn" onclick="sellTower()">SELL $<span id="upg-sell">0</span></button>
            </div>
            <div style="display:flex; flex-direction:column; gap:5px;">
                <button class="upg-btn" id="btn-d-upg" onclick="upgradeTower()">UPGRADE $<span id="upg-cost">0</span></button>
                <button class="ctrl-btn" onclick="deselectAll()">BACK</button>
            </div>
        </div>

        <!-- Action Area -->
        <div class="action-container">
            <button class="big-btn" id="btn-wave" onclick="startWave()">START WAVE</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       GAME ENGINE & CONSTANTS
       ========================================= */
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    // Internal Logical Resolution (16:9 Aspect Ratio)
    const C_WIDTH = 1280;
    const C_HEIGHT = 720;
    canvas.width = C_WIDTH;
    canvas.height = C_HEIGHT;

    // Game State
    let state = {
        lives: 20, gold: 600, wave: 0,
        isPaused: false, speed: 1,
        waveActive: false, waveTimer: 0, enemiesSpawned: 0,
        selectedShopType: null,
        selectedTower: null,
        screenShake: 0
    };

    // Entities
    let towers = [];
    let enemies = [];
    let projectiles = [];
    let particles = [];
    let fcts = []; // Floating Combat Text
    let effectAnimations = []; // Explosion and line effects
    let frameCount = 0; // Animation frame counter

    // 10-Point Winding Path adapted for 1280x720
    const pathNodes = [
        {x: 0, y: 120}, {x: 1150, y: 120}, {x: 1150, y: 620},
        {x: 100, y: 620}, {x: 100, y: 280}, {x: 900, y: 280},
        {x: 900, y: 480}, {x: 350, y: 480}, {x: 350, y: 380},
        {x: 640, y: 380} // Core
    ];
    const corePos = { x: 640, y: 380, radius: 60 };

    /* =========================================
       TOWER DICTIONARY
       ========================================= */
    const TARGET_MODES = ["FIRST", "LAST", "STRONG", "CLOSE"];
    
    const TOWER_DEFS = {
        'b': { name: 'Panther Sentry', cost: 100, range: 160, fireRate: 15, damage: 12, pSpeed: 15, color: '#cc33ff', pType: 'kinetic' },
        'p': { name: 'Plasma Cannon', cost: 175, range: 200, fireRate: 45, damage: 40, pSpeed: 10, color: '#ff5522', pType: 'plasma' },
        't': { name: 'Tesla Coil', cost: 250, range: 180, fireRate: 35, damage: 25, pSpeed: 0, color: '#00ffff', pType: 'beam' }, // Instant
        'k': { name: 'Templar Horse', cost: 300, range: 140, fireRate: 60, damage: 85, pSpeed: 0, color: '#ffd700', pType: 'lance' }, // Instant/Melee
        'a': { name: 'Heavy Artillery', cost: 400, range: 350, fireRate: 120, damage: 80, pSpeed: 6, color: '#ff9900', pType: 'arc', splash: 80 }
    };

    /* =========================================
       INPUT & UI HANDLING
       ========================================= */
    const getPointerPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (C_WIDTH / rect.width),
            y: (clientY - rect.top) * (C_HEIGHT / rect.height)
        };
    };

    let pointer = { x: -100, y: -100 };
    canvas.addEventListener('mousemove', e => pointer = getPointerPos(e));
    canvas.addEventListener('touchmove', e => pointer = getPointerPos(e));

    canvas.addEventListener('click', e => handleCanvasClick(getPointerPos(e)));
    canvas.addEventListener('touchend', e => { e.preventDefault(); handleCanvasClick(getPointerPos(e.changedTouches[0])); });

    function selectTower(type) {
        if (state.gold < TOWER_DEFS[type].cost) return;
        state.selectedShopType = type;
        state.selectedTower = null;
        updateUI();
    }

    function deselectAll() {
        state.selectedShopType = null;
        state.selectedTower = null;
        updateUI();
    }

    function handleCanvasClick(pos) {
        // 1. Check if clicking existing tower
        let clickedTower = null;
        for (let t of towers) {
            if (Math.hypot(t.x - pos.x, t.y - pos.y) < 35) {
                clickedTower = t; break;
            }
        }

        if (clickedTower) {
            state.selectedTower = clickedTower;
            state.selectedShopType = null;
            updateUI();
            return;
        }

        // 2. Try placing new tower
        if (state.selectedShopType) {
            const def = TOWER_DEFS[state.selectedShopType];
            
            // Validation: Off path, off core, off other towers
            let valid = true;
            if (Math.hypot(pos.x - corePos.x, pos.y - corePos.y) < corePos.radius + 30) valid = false;
            
            for(let i=0; i<pathNodes.length-1; i++) {
                if (distToSegment(pos, pathNodes[i], pathNodes[i+1]) < 35) { valid = false; break; }
            }
            for (let t of towers) {
                if (Math.hypot(t.x - pos.x, t.y - pos.y) < 45) { valid = false; break; }
            }

            if (valid && state.gold >= def.cost) {
                state.gold -= def.cost;
                towers.push({
                    x: pos.x, y: pos.y, type: state.selectedShopType,
                    level: 1, angle: 0, cooldown: 0,
                    damage: def.damage, range: def.range, fireRate: def.fireRate,
                    targetMode: 0 // Index in TARGET_MODES
                });
                deselectAll();
            } else {
                addFCT(pos.x, pos.y, "INVALID", "#ff3333");
            }
        } else {
            deselectAll();
        }
    }

    function distToSegment(p, v, w) {
        let l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    // Buttons UI updating
    function updateUI() {
        document.getElementById('ui-lives').innerText = state.lives;
        document.getElementById('ui-gold').innerText = Math.floor(state.gold);
        document.getElementById('ui-wave').innerText = state.wave;

        const waveBtn = document.getElementById('btn-wave');
        if (state.waveActive) {
            let remain = enemies.length + (enemiesToSpawn() - state.enemiesSpawned);
            waveBtn.innerText = `DEFENDING (${remain})`;
            waveBtn.disabled = true;
        } else {
            waveBtn.innerText = `START WAVE ${state.wave + 1}`;
            waveBtn.disabled = false;
        }

        // Shop Buttons
        ['b','p','t','k','a'].forEach(type => {
            let el = document.getElementById('shop-'+type);
            el.className = 'shop-btn';
            if (state.gold < TOWER_DEFS[type].cost) el.classList.add('disabled');
            if (state.selectedShopType === type) el.classList.add('selected');
        });

        // Panels
        if (state.selectedTower) {
            document.getElementById('shop-ui').style.display = 'none';
            document.getElementById('upgrade-ui').style.display = 'flex';
            
            let t = state.selectedTower;
            let def = TOWER_DEFS[t.type];
            document.getElementById('upg-name').innerText = def.name;
            document.getElementById('upg-lvl').innerText = t.level;
            document.getElementById('upg-dmg').innerText = Math.floor(t.damage);
            document.getElementById('upg-rng').innerText = Math.floor(t.range);
            document.getElementById('upg-tgt').innerText = TARGET_MODES[t.targetMode];
            
            let upgCost = def.cost * t.level;
            let sellVal = Math.floor((def.cost + (t.level>1?def.cost:0) + (t.level>2?def.cost*2:0)) * 0.6);
            document.getElementById('upg-sell').innerText = sellVal;
            
            let btnUpg = document.getElementById('btn-d-upg');
            if (t.level >= 3) {
                btnUpg.innerText = "MAX LEVEL"; btnUpg.disabled = true;
            } else {
                btnUpg.innerHTML = `UPGRADE<br/>$${upgCost}`;
                btnUpg.disabled = state.gold < upgCost;
            }
        } else {
            document.getElementById('shop-ui').style.display = 'flex';
            document.getElementById('upgrade-ui').style.display = 'none';
        }
    }

    function sellTower() {
        if (!state.selectedTower) return;
        let t = state.selectedTower;
        let def = TOWER_DEFS[t.type];
        let sellVal = Math.floor((def.cost + (t.level>1?def.cost:0) + (t.level>2?def.cost*2:0)) * 0.6);
        state.gold += sellVal;
        addFCT(t.x, t.y, `+$${sellVal}`, "#ffd700");
        towers = towers.filter(x => x !== t);
        deselectAll();
    }

    function upgradeTower() {
        if (!state.selectedTower) return;
        let t = state.selectedTower;
        if (t.level >= 3) return;
        let cost = TOWER_DEFS[t.type].cost * t.level;
        if (state.gold >= cost) {
            state.gold -= cost;
            t.level++;
            t.damage *= 1.8; // Huge damage boost
            t.range *= 1.15; // Range boost
            if(t.type !== 'k') t.fireRate = Math.max(5, Math.floor(t.fireRate * 0.8)); // Faster fire
            addEffect(t.x, t.y, '#ffffff', 40, 'nova');
            updateUI();
        }
    }

    function cycleTarget() {
        if (!state.selectedTower) return;
        state.selectedTower.targetMode = (state.selectedTower.targetMode + 1) % TARGET_MODES.length;
        updateUI();
    }

    /* =========================================
       WAVE LOGIC
       ========================================= */
    function enemiesToSpawn() { return 5 + (state.wave * 3); }

    function startWave() {
        if (state.waveActive) return;
        state.wave++;
        state.waveActive = true;
        state.waveTimer = 0;
        state.enemiesSpawned = 0;
        updateUI();
    }

    function processWaveSpawns(dtFrames) {
        if (!state.waveActive) return;
        state.waveTimer -= dtFrames;
        
        if (state.enemiesSpawned < enemiesToSpawn() && state.waveTimer <= 0) {
            // Spawn Enemy
            let isHeavy = (state.enemiesSpawned % 4 === 3);
            let isBoss = (state.wave % 5 === 0 && state.enemiesSpawned === enemiesToSpawn()-1);
            
            let hpScale = Math.pow(1.3, state.wave);
            let e = {
                x: pathNodes[0].x, y: pathNodes[0].y, pathIdx: 0,
                hp: Math.floor(30 * hpScale), maxHp: Math.floor(30 * hpScale),
                speed: 1.5, type: 'light', reward: 5 + state.wave
            };

            if (isHeavy) {
                e.hp *= 3; e.maxHp *= 3; e.speed = 0.9; e.type = 'heavy'; e.reward *= 2;
            }
            if (isBoss) {
                e.hp *= 15; e.maxHp *= 15; e.speed = 0.7; e.type = 'boss'; e.reward *= 10;
            }

            enemies.push(e);
            state.enemiesSpawned++;
            state.waveTimer = 60; // Frames between spawns
            updateUI();
        }

        if (state.enemiesSpawned >= enemiesToSpawn() && enemies.length === 0) {
            state.waveActive = false;
            state.gold += 50 + (state.wave * 10); // Wave clear bonus
            addFCT(corePos.x, corePos.y - 80, "WAVE CLEARED!", "#00ffcc");
            updateUI();
        }
    }

    /* =========================================
       COMBAT & PHYSICS LOGIC
       ========================================= */
    function spawnProjectile(t, target) {
        const def = TOWER_DEFS[t.type];
        
        // Instant Hit Weapons
        if (def.pSpeed === 0) {
            target.hp -= t.damage;
            if (t.type === 't') addEffectLine(t.x, t.y, target.x, target.y, def.color, 'lightning');
            if (t.type === 'k') addEffectLine(t.x, t.y, target.x, target.y, def.color, 'slash');
            createHitParticles(target.x, target.y, def.color, t.level);
            return;
        }

        // Travel Weapons
        let dist = Math.hypot(target.x - t.x, target.y - t.y);
        let ticksToHit = dist / def.pSpeed;
        
        // Lead the target slightly
        let nextNode = pathNodes[target.pathIdx+1] || target;
        let eAngle = Math.atan2(nextNode.y - target.y, nextNode.x - target.x);
        let predX = target.x + Math.cos(eAngle) * target.speed * ticksToHit * 0.5;
        let predY = target.y + Math.sin(eAngle) * target.speed * ticksToHit * 0.5;

        let pAngle = Math.atan2(predY - t.y, predX - t.x);
        
        projectiles.push({
            x: t.x, y: t.y, originX: t.x, originY: t.y, targetX: predX, targetY: predY,
            vx: Math.cos(pAngle) * def.pSpeed, vy: Math.sin(pAngle) * def.pSpeed,
            damage: t.damage, type: def.pType, color: def.color,
            splash: def.splash || 0, level: t.level,
            totalDist: Math.hypot(predX-t.x, predY-t.y), traveled: 0
        });
    }

    function processCombat(dtFrames) {
        // Towers aim and fire
        towers.forEach(t => {
            if (t.cooldown > 0) t.cooldown -= dtFrames;
            
            let validTargets = enemies.filter(e => Math.hypot(e.x - t.x, e.y - t.y) <= t.range);
            if (validTargets.length === 0) return;

            // Targeting logic
            let target = validTargets[0]; // Default FIRST
            if (t.targetMode === 1) target = validTargets[validTargets.length-1]; // LAST
            if (t.targetMode === 2) target = validTargets.reduce((a,b) => a.hp > b.hp ? a : b); // STRONG
            if (t.targetMode === 3) target = validTargets.reduce((a,b) => Math.hypot(a.x-t.x, a.y-t.y) < Math.hypot(b.x-t.x, b.y-t.y) ? a : b); // CLOSE

            // Aim
            t.angle = Math.atan2(target.y - t.y, target.x - t.x) + Math.PI/2;

            if (t.cooldown <= 0) {
                t.cooldown = t.fireRate;
                
                // Multi-shot based on level
                let shots = 1;
                if (t.type === 'p' && t.level >= 2) shots = 2;
                if (t.type === 'p' && t.level === 3) shots = 3;
                if (t.type === 'a' && t.level >= 2) shots = 2;

                for(let i=0; i<shots; i++) {
                    setTimeout(() => spawnProjectile(t, target), i * 150);
                }
            }
        });

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let moveDist = Math.hypot(p.vx * dtFrames, p.vy * dtFrames);
            p.x += p.vx * dtFrames;
            p.y += p.vy * dtFrames;
            p.traveled += moveDist;

            if (p.traveled >= p.totalDist) {
                // Hit
                if (p.splash > 0) {
                    let splashRad = p.splash * (1 + (p.level*0.2));
                    addEffect(p.x, p.y, p.color, splashRad, 'explosion');
                    state.screenShake = p.level * 3;
                    enemies.forEach(e => {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < splashRad) {
                            e.hp -= p.damage;
                            addFCT(e.x, e.y, Math.floor(p.damage), p.color);
                        }
                    });
                } else {
                    // Single target check
                    for (let e of enemies) {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < 30) {
                            e.hp -= p.damage;
                            createHitParticles(p.x, p.y, p.color, p.level);
                            break;
                        }
                    }
                }
                projectiles.splice(i, 1);
            }
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.hp <= 0) {
                state.gold += e.reward;
                addFCT(e.x, e.y, `+${e.reward}`, "#ffd700");
                createHitParticles(e.x, e.y, e.type === 'boss' ? '#ff00ff' : '#00ff00', 3);
                enemies.splice(i, 1);
                updateUI();
                continue;
            }

            let nextNode = pathNodes[e.pathIdx + 1];
            if (!nextNode) {
                // Core Hit
                state.lives--;
                state.screenShake = 10;
                addEffect(corePos.x, corePos.y, '#ff0000', 100, 'nova');
                enemies.splice(i, 1);
                updateUI();
                if (state.lives <= 0) gameOver();
                continue;
            }

            let angle = Math.atan2(nextNode.y - e.y, nextNode.x - e.x);
            e.x += Math.cos(angle) * e.speed * dtFrames;
            e.y += Math.sin(angle) * e.speed * dtFrames;

            if (Math.hypot(e.x - nextNode.x, e.y - nextNode.y) < 5) e.pathIdx++;
        }
    }

    /* =========================================
       VISUAL EFFECTS
       ========================================= */
    function addEffect(x, y, color, radius, type) {
        effectAnimations.push({x, y, color, radius, type, maxLife: 20, life: 20});
    }

    function addEffectLine(x1, y1, x2, y2, color, type) {
        effectAnimations.push({x1, y1, x2, y2, color, type, maxLife: 10, life: 10});
    }

    function createHitParticles(x, y, color, level) {
        let count = 4 + (level * 3);
        for(let i=0; i<count; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                color, size: Math.random()*3 + 1, life: 15 + Math.random()*15
            });
        }
    }

    function addFCT(x, y, text, color) {
        fcts.push({x, y, text, color, life: 40, maxLife: 40});
    }

    function drawLightning(ctx, x1, y1, x2, y2) {
        ctx.beginPath(); ctx.moveTo(x1, y1);
        let segments = 5;
        let cx = x1, cy = y1;
        for (let i=0; i<segments; i++) {
            cx += (x2-x1)/segments + (Math.random()-0.5)*20;
            cy += (y2-y1)/segments + (Math.random()-0.5)*20;
            ctx.lineTo(cx, cy);
        }
        ctx.stroke();
    }

    /* =========================================
       PROCEDURAL ART ASSETS
       ========================================= */
    
    // Core Matrix
    function drawCore(ctx) {
        ctx.save(); ctx.translate(corePos.x, corePos.y); ctx.scale(1.2, 1.2);
        let t = frameCount * 0.05;
        
        ctx.fillStyle = '#0a0a1a'; ctx.strokeStyle = '#3355ff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0,0, 45, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        
        ctx.save(); ctx.rotate(t*0.5);
        ctx.strokeStyle = '#00ffff'; ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.arc(0,0, 55, 0, Math.PI*2); ctx.stroke();
        ctx.restore();

        // Crystal
        ctx.fillStyle = `rgba(0, 255, 255, ${0.5 + Math.abs(Math.sin(t))*0.5})`;
        ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(20,0); ctx.lineTo(0,30); ctx.lineTo(-20,0); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    // Panther Sentry (Detailed, aggressive forward-facing bust)
    function drawPantherSentry(ctx, level) {
        // Base / Collar
        ctx.fillStyle = '#111'; ctx.strokeStyle = '#5500aa'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = '#1a0a2a'; ctx.strokeStyle = '#bf00ff';
        ctx.beginPath(); 
        ctx.moveTo(-16, 5); ctx.lineTo(-24, -10); ctx.lineTo(-12, -18); 
        ctx.lineTo(0, -12); ctx.lineTo(12, -18); ctx.lineTo(24, -10); 
        ctx.lineTo(16, 5); ctx.closePath(); ctx.fill(); ctx.stroke();

        // Main Head Structure
        ctx.fillStyle = '#222'; ctx.strokeStyle = '#7700cc';
        ctx.beginPath(); 
        ctx.moveTo(0, -22); // forehead
        ctx.lineTo(-12, -28); // left ear tip
        ctx.lineTo(-8, -12); // left cheek top
        ctx.lineTo(-14, 0); // left cheek bottom
        ctx.lineTo(-6, 12); // left jaw
        ctx.lineTo(0, 18); // chin
        ctx.lineTo(6, 12); // right jaw
        ctx.lineTo(14, 0); // right cheek bottom
        ctx.lineTo(8, -12); // right cheek top
        ctx.lineTo(12, -28); // right ear tip
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // Snout/Muzzle
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(8, 10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();

        // Prominent Fangs
        ctx.fillStyle = '#eee';
        ctx.beginPath(); ctx.moveTo(-4, 10); ctx.lineTo(-2, 16); ctx.lineTo(0, 10); ctx.fill();
        ctx.beginPath(); ctx.moveTo(4, 10); ctx.lineTo(2, 16); ctx.lineTo(0, 10); ctx.fill();

        // Glowing Angled Slit Eyes
        ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00ffff';
        ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(-10, -12); ctx.lineTo(-4, -4); ctx.fill();
        ctx.beginPath(); ctx.moveTo(3, -8); ctx.lineTo(10, -12); ctx.lineTo(4, -4); ctx.fill();
        ctx.shadowBlur = 0;

        if (level >= 2) {
            // Glowing Tribal Cheek Markings
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-14, -5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(14, -5); ctx.stroke();
        }

        if (level >= 3) {
            // Floating Energy Crown and Orbs
            ctx.strokeStyle = `rgba(191, 0, 255, ${0.6 + Math.sin(frameCount*0.1)*0.4})`;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, -5, 26, Math.PI + 0.2, Math.PI*2 - 0.2); ctx.stroke();
            ctx.fillStyle = '#bf00ff'; ctx.beginPath(); ctx.arc(0, -31, 4, 0, Math.PI*2); ctx.fill();
        }
    }

    // Plasma Cannon (Heavy Railgun)
    function drawPlasmaCannon(ctx, level) {
        ctx.fillStyle = '#222'; ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#333';
        if (level === 1) {
            ctx.fillRect(-6, -25, 12, 25); ctx.strokeRect(-6, -25, 12, 25);
        } else if (level === 2) {
            ctx.fillRect(-10, -28, 6, 28); ctx.strokeRect(-10, -28, 6, 28);
            ctx.fillRect(4, -28, 6, 28); ctx.strokeRect(4, -28, 6, 28);
        } else {
            ctx.fillRect(-14, -25, 6, 25); ctx.strokeRect(-14, -25, 6, 25);
            ctx.fillRect(-5, -35, 10, 35); ctx.strokeRect(-5, -35, 10, 35); // Main center
            ctx.fillRect(8, -25, 6, 25); ctx.strokeRect(8, -25, 6, 25);
        }

        // Reactor
        let heat = 0.5 + Math.abs(Math.sin(frameCount * 0.1))*0.5;
        ctx.fillStyle = `rgba(255, ${100*heat}, 0, 0.9)`;
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
    }

    // Tesla Coil
    function drawTeslaSpire(ctx, level) {
        ctx.fillStyle = '#112'; ctx.strokeStyle = '#0055ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-20,15); ctx.lineTo(20,15); ctx.lineTo(10,5); ctx.lineTo(-10,5); ctx.closePath(); ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = '#05051a'; ctx.fillRect(-6, -20, 12, 25);

        let rings = level === 1 ? 3 : (level === 2 ? 5 : 7);
        for(let i=0; i<rings; i++) {
            let y = 0 - (i*5);
            ctx.fillStyle = '#225'; ctx.strokeStyle = '#00ffff';
            ctx.beginPath(); ctx.ellipse(0, y, 12, 3, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }

        let topY = -2 - (rings*5);
        ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
        
        if (level < 3) {
            ctx.beginPath(); ctx.arc(0, topY, 8, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(-10, topY, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, topY, 6, 0, Math.PI*2); ctx.fill();
            if(Math.random()>0.5) { ctx.strokeStyle='#fff'; drawLightning(ctx,-10,topY, 10,topY); }
        }
        ctx.shadowBlur = 0;
    }

    // Templar (Detailed Mechanical Steed)
    function drawKnightTemplar(ctx, level) {
        // Thick Base
        ctx.fillStyle = '#222'; ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-15, 15); ctx.lineTo(15, 15); ctx.lineTo(10, -10); ctx.lineTo(-10, -10); ctx.closePath(); ctx.fill(); ctx.stroke();

        // Mechanical Horse Head (Top-Down/Angled View)
        ctx.fillStyle = '#445'; ctx.strokeStyle = '#aab';
        ctx.beginPath();
        ctx.moveTo(-6, 10);  // neck base left
        ctx.lineTo(-4, -15); // ear base left
        ctx.lineTo(-8, -25); // ear tip left
        ctx.lineTo(-2, -20); // crown left
        ctx.lineTo(2, -20);  // crown right
        ctx.lineTo(8, -25);  // ear tip right
        ctx.lineTo(4, -15);  // ear base right
        ctx.lineTo(6, 10);   // neck base right
        ctx.closePath(); ctx.fill(); ctx.stroke();
        
        // Snout pointing forward
        ctx.fillStyle = '#334';
        ctx.beginPath();
        ctx.moveTo(-4, -10);
        ctx.lineTo(-3, -35); // nose left
        ctx.lineTo(3, -35);  // nose right
        ctx.lineTo(4, -10);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // Glowing Eyes
        ctx.fillStyle = '#ffd700'; ctx.shadowBlur = 5; ctx.shadowColor = '#ffd700';
        ctx.beginPath(); ctx.arc(-3, -15, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3, -15, 2, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        if (level >= 2) {
            // Golden Heavy Barding (Armor Plates)
            ctx.fillStyle = '#d4af37'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            // Side neck plates
            ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-12, -10); ctx.lineTo(-4, -5); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(12, -10); ctx.lineTo(4, -5); ctx.closePath(); ctx.fill(); ctx.stroke();
            // Forehead plate
            ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-2, -28); ctx.lineTo(2, -28); ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        if (level >= 3) {
            // Energy Lance and Holographic Mane
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
            // Glowing Lance extending far forward
            ctx.beginPath(); ctx.moveTo(8, -5); ctx.lineTo(8, -55); ctx.stroke();
            
            // Holographic Mane
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.7)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-3, -2); ctx.lineTo(-3, 12); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(3, -2); ctx.lineTo(3, 12); ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }

    // Artillery Tank
    function drawArtillery(ctx, level) {
        ctx.fillStyle = '#111'; ctx.fillRect(-22, -10, 8, 20); ctx.fillRect(14, -10, 8, 20); // Treads
        ctx.fillStyle = '#333'; ctx.strokeStyle = '#ff9900'; ctx.lineWidth = 2;
        ctx.fillRect(-14, -15, 28, 30); ctx.strokeRect(-14, -15, 28, 30); // Hull

        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0,0, 12, 0, Math.PI*2); ctx.fill(); ctx.stroke(); // Turret

        ctx.fillStyle = '#444';
        if (level === 1) {
            ctx.fillRect(-5, -30, 10, 30); ctx.strokeRect(-5, -30, 10, 30);
        } else if (level === 2) {
            ctx.fillRect(-9, -30, 6, 30); ctx.strokeRect(-9, -30, 6, 30);
            ctx.fillRect(3, -30, 6, 30); ctx.strokeRect(3, -30, 6, 30);
        } else {
            ctx.fillRect(-9, -30, 6, 30); ctx.strokeRect(-9, -30, 6, 30);
            ctx.fillRect(3, -30, 6, 30); ctx.strokeRect(3, -30, 6, 30);
            // Side Missile Pods
            ctx.fillStyle = '#830'; ctx.fillRect(-25, -5, 8, 14); ctx.fillRect(17, -5, 8, 14);
            ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(-21, -5, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(21, -5, 3, 0, Math.PI*2); ctx.fill();
        }
    }

    function renderTowerType(ctx, type, level) {
        if (type==='b') drawPantherSentry(ctx, level);
        if (type==='p') drawPlasmaCannon(ctx, level);
        if (type==='t') drawTeslaSpire(ctx, level);
        if (type==='k') drawKnightTemplar(ctx, level);
        if (type==='a') drawArtillery(ctx, level);
    }

    /* =========================================
       RENDER LOOP
       ========================================= */
    function drawPreviews() {
        ['b','p','t','k','a'].forEach(type => {
            const pCanvas = document.getElementById('prev-'+type);
            pCanvas.width = 60; // Increased internal resolution for sharper larger icons
            pCanvas.height = 60;
            const pCtx = pCanvas.getContext('2d');
            pCtx.clearRect(0,0,60,60);
            pCtx.save(); 
            pCtx.translate(30, 34); // Centered
            pCtx.scale(0.85, 0.85); // Scale appropriately to fit 60x60
            renderTowerType(pCtx, type, 3); // Previews show max level potential
            pCtx.restore();
        });
    }

    function render() {
        ctx.clearRect(0, 0, C_WIDTH, C_HEIGHT);

        // Screen Shake
        ctx.save();
        if (state.screenShake > 0) {
            ctx.translate((Math.random()-0.5)*state.screenShake, (Math.random()-0.5)*state.screenShake);
            state.screenShake *= 0.9;
            if(state.screenShake < 0.5) state.screenShake = 0;
        }

        // Draw Path (Glowing Tech Rails)
        ctx.strokeStyle = '#22223a'; ctx.lineWidth = 40; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pathNodes[0].x, pathNodes[0].y);
        for(let i=1; i<pathNodes.length; i++) ctx.lineTo(pathNodes[i].x, pathNodes[i].y); ctx.stroke();

        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 4;
        ctx.stroke();

        // Path Direction Chevrons (Animated)
        let offset = (frameCount * 1) % 40;
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)'; ctx.lineWidth = 2; ctx.setLineDash([10, 30]); ctx.lineDashOffset = -offset;
        ctx.stroke(); ctx.setLineDash([]);

        drawCore(ctx);

        // Hover Range Preview
        if (state.selectedShopType && pointer.x > 0) {
            let def = TOWER_DEFS[state.selectedShopType];
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.strokeStyle = '#fff';
            ctx.beginPath(); ctx.arc(pointer.x, pointer.y, def.range, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            
            ctx.save(); ctx.translate(pointer.x, pointer.y); ctx.globalAlpha = 0.5;
            renderTowerType(ctx, state.selectedShopType, 1);
            ctx.restore();
        }

        // Towers
        towers.forEach(t => {
            // Pulse range if selected
            if (state.selectedTower === t) {
                let p = 0.1 + Math.abs(Math.sin(frameCount*0.05))*0.1;
                ctx.fillStyle = `rgba(0, 255, 255, ${p})`; ctx.strokeStyle = '#0ff';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                
                // Highlight ring
                ctx.strokeStyle = '#ff9900'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
                ctx.beginPath(); ctx.arc(t.x, t.y, 25, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
            }

            ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.angle);
            renderTowerType(ctx, t.type, t.level);
            ctx.restore();
        });

        // Enemies
        enemies.forEach(e => {
            ctx.save(); ctx.translate(e.x, e.y);
            let s = e.type === 'boss' ? 2 : (e.type === 'heavy' ? 1.5 : 1);
            ctx.scale(s, s);

            if (e.type === 'heavy') ctx.fillStyle = '#ff8800';
            else if (e.type === 'boss') ctx.fillStyle = '#ff00ff';
            else ctx.fillStyle = '#ff3366';

            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
            
            ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 10); ctx.lineTo(-4, 0); ctx.lineTo(-8, -10); ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Health Bar
            ctx.restore();
            ctx.fillStyle = '#f00'; ctx.fillRect(e.x - 15, e.y - 25*s, 30, 4);
            ctx.fillStyle = '#0f0'; ctx.fillRect(e.x - 15, e.y - 25*s, 30 * (e.hp/e.maxHp), 4);
        });

        // Projectiles
        projectiles.forEach(p => {
            ctx.save(); ctx.translate(p.x, p.y);
            
            // Artillery Arc simulation visually only
            if (p.type === 'arc') {
                let progress = p.traveled / p.totalDist;
                let arcOffset = Math.sin(progress * Math.PI) * 100; // Peak height 100
                ctx.translate(0, -arcOffset);
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0, 6, 0, Math.PI*2); ctx.fill();
                // Shadow
                ctx.restore(); ctx.save(); ctx.translate(p.x, p.y);
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(0,0, 4, 0, Math.PI*2); ctx.fill();
            } else if (p.type === 'plasma') {
                ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                ctx.beginPath(); ctx.arc(0,0, 8, 0, Math.PI*2); ctx.fill();
            } else {
                // Kinetic Bullet
                ctx.rotate(Math.atan2(p.vy, p.vx));
                ctx.fillStyle = '#fff'; ctx.fillRect(-5, -1, 10, 2);
            }
            ctx.restore();
        });

        // Effects
        for(let i=effectAnimations.length-1; i>=0; i--) {
            let fx = effectAnimations[i]; fx.life--;
            if (fx.life <= 0) { effectAnimations.splice(i, 1); continue; }
            
            ctx.save();
            let pct = fx.life / fx.maxLife;
            ctx.globalAlpha = pct;
            
            if (fx.type === 'explosion' || fx.type === 'nova') {
                ctx.fillStyle = fx.color; ctx.beginPath(); 
                ctx.arc(fx.x, fx.y, fx.radius * (1-pct), 0, Math.PI*2); ctx.fill();
            } else if (fx.type === 'lightning') {
                ctx.strokeStyle = fx.color; ctx.lineWidth = 3; ctx.shadowBlur = 10; ctx.shadowColor = fx.color;
                drawLightning(ctx, fx.x1, fx.y1, fx.x2, fx.y2);
            } else if (fx.type === 'slash') {
                ctx.strokeStyle = fx.color; ctx.lineWidth = 4 * pct;
                ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
            }
            ctx.restore();
        }

        // Particles
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i]; p.life--;
            if (p.life <= 0) { particles.splice(i,1); continue; }
            p.x += p.vx; p.y += p.vy;
            ctx.globalAlpha = p.life/30; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // FCT (Floating Combat Text)
        for(let i=fcts.length-1; i>=0; i--) {
            let f = fcts[i]; f.life--;
            if (f.life <= 0) { fcts.splice(i,1); continue; }
            f.y -= 0.5; // Float up
            ctx.globalAlpha = f.life / f.maxLife;
            ctx.fillStyle = f.color; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
            ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    /* =========================================
       MAIN LOOP & INIT
       ========================================= */
    let lastTime = 0;
    
    function gameLoop(time) {
        requestAnimationFrame(gameLoop);
        if (!lastTime) lastTime = time;
        let dt = time - lastTime;
        lastTime = time;

        if (state.isPaused || state.lives <= 0) return;

        // Cap dt to prevent massive jumps if tab hidden
        if (dt > 100) dt = 100;
        
        // Convert to logic frames (approx 60fps base)
        let dtFrames = (dt / 16.66) * state.speed;
        frameCount += dtFrames;

        processWaveSpawns(dtFrames);
        processCombat(dtFrames);
        render();
    }

    // Top Bar Controls
    document.getElementById('btn-pause').onclick = (e) => { 
        state.isPaused = !state.isPaused; 
        e.target.innerText = state.isPaused ? "PLAY" : "PAUSE";
        e.target.classList.toggle('active');
    };
    [1, 2, 4].forEach(s => {
        document.getElementById(`btn-spd-${s}`).onclick = () => {
            state.speed = s;
            [1,2,4].forEach(x => document.getElementById(`btn-spd-${x}`).classList.remove('active'));
            document.getElementById(`btn-spd-${s}`).classList.add('active');
        }
    });
    document.getElementById('btn-spd-1').classList.add('active');

    function gameOver() {
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('go-wave').innerText = state.wave;
    }

    function resetGame() {
        state = { ...state, lives: 20, gold: 600, wave: 0, waveActive: false, enemiesSpawned: 0, selectedShopType: null, selectedTower: null };
        towers = []; enemies = []; projectiles = []; effectAnimations = []; particles = []; fcts = [];
        document.getElementById('game-over').style.display = 'none';
        updateUI();
    }

    // Run
    window.onload = () => {
        drawPreviews();
        updateUI();
        requestAnimationFrame(gameLoop);
    };

</script>
</body>
</html>
