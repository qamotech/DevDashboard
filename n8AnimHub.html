tarea{height:120px;resize:none;font-size:10px;white-space:pre}.assets{flex-grow:1;display:flex;flex-direction:column;gap:10px;min-height:0}.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:10px}.ac{padding:10px 5px;text-align:center;font-size:8px;border:1px solid var(--p);cursor:pointer;transition:var(--t);text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,.6);color:var(--p);display:flex;align-items:center;justify-content:center;min-height:30px}.ac:hover,.ac.act{border-color:var(--c);color:var(--c);background:rgba(0,255,255,.05);box-shadow:inset 0 0 10px rgba(0,255,255,.2);transform:scale(1.02)}@media(max-width:1000px){.wrap{grid-template-columns:1fr;height:auto}.lc,.rc{overflow:visible}}</style></head><body><header><a href="https://qamotech.github.io/DevDashboard"><svg width="40" height="40" viewBox="0 0 100 100"><polygon points="50,2 98,25 98,75 50,98 2,75 2,25" fill="none" stroke="#00ffff" stroke-width="3"/><path d="M25,50 L50,25 L75,50 L50,75 Z" fill="none" stroke="#8892b0" stroke-width="2"/><circle cx="50" cy="50" r="8" fill="#00ffff" filter="drop-shadow(0 0 8px #00ffff)"/></svg><h1>AnimHub Prime</h1></a></header><div class="wrap"><div class="gl lc"><h2>Parameters</h2><div class="gr" id="ci"></div></div><div class="gl prev"><div id="bx">TARGET_NODE</div></div><div class="gl rc"><div class="saver"><h2>Core Link</h2><textarea id="cd" readonly></textarea><button onclick="navigator.clipboard.writeText(cd.value);let t=this.innerText;this.innerText='COPIED DATA';setTimeout(()=>this.innerText=t,2000)">Copy Snippet</button></div><div class="assets"><h2>Anim Vectors</h2><div class="ag" id="ag"></div></div></div></div><script>const ctrls=[{id:'w',l:'Width',t:'range',m:50,x:600,v:200,u:'px'},{id:'h',l:'Height',t:'range',m:50,x:600,v:200,u:'px'},{id:'br',l:'Radius',t:'range',m:0,x:300,v:10,u:'px'},{id:'bw',l:'Border Width',t:'range',m:0,x:15,v:2,u:'px'},{id:'bl',l:'Blur',t:'range',m:0,x:30,v:10,u:'px'},{id:'op',l:'Opacity',t:'range',m:0,x o){let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${o/100})`}function sa(i,c){document.querySelectorAll('.ac').forEach(e=>e.classList.remove('act'));document.getElementById(`a${i}`).classList.add('act');ca=c;u();bx.className='';void bx.offsetWidth;bx.className=c}function u(){let v={};ctrls.forEach(c=>v[c.id]=document.getElementById(c.id).value);let bg=hexToRgba(v.bgc,v.op);bx.style.cssText=`width:${v.w}px;height:${v.h}px;border-radius:${v.br}px;backdrop-filter:blur(${v.bl}px);-webkit-backdrop-filter:blur(${v.bl}px);background:${bg};border:${v.bw}px solid ${v.bc};box-shadow:0 0 ${v.gs}px ${v.bc}80;color:${v.tc};animation-duration:${v.dur/10}s;animation-delay:${v.del/10}s;`;cd.value=`<!-- Import: Animate.css, Hover.css, Magic.css, CSSanimation.io -->\n<div class="mech-node ${ca}" \n  style="width:${v.w}px; height:${v.h}px; border-radius:${v.br}px; \n  backdrop-filter:blur(${v.bl}px); background:${bg}; \n  border:${v.bw}px solid ${v.bc}; box-shadow:0 0 ${v.gs}px ${v.bc}80; \n  color:${v.tc}; animation-duration:${v.dur/10}s; \n  animation-delay:${v.del/10}s;">\n  TARGET_NODE\n</div>`}u();</script></body></html>
