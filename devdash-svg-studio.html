<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="128x128" href="n8-icon.png">
  <link rel="shortcut icon" href="n8-icon.png">
  <link rel="apple-touch-icon" href="n8-icon.png">
    <title>DevDash SVG Studio</title>
    <style>
        :root { --neon-cyan: #00f3ff; --dark-bg: #121212; --glass-bg: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #fff; padding: 20px; }
        
        .cyber-card {
            background: var(--dark-bg);
            border: 1px solid var(--neon-cyan);
            padding: 20px;
            border-radius: 8px;
            color: var(--neon-cyan);
            max-width: 900px;
            margin: auto;
        }
        
        .main-layout { display: flex; gap: 20px; margin-top: 20px; }
        
        textarea {
            width: 100%; height: 250px; background: #000;
            color: var(--neon-cyan); border: 1px solid #333;
            font-family: 'JetBrains Mono', monospace; padding: 10px;
        }
        
        .preview-pane {
            flex: 1; border: 1px solid #444; background: var(--glass-bg);
            backdrop-filter: blur(10px); display: flex; justify-content: center;
            align-items: center; min-height: 250px;
        }
        
        .controls-pane { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        button { cursor: pointer; background: #1a1a1a; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px; }
        button:hover { background: var(--neon-cyan); color: #000; }
    </style>
</head>
<body>

<div id="svg-sandbox" class="cyber-card">
    <h2>SVG Sandbox Studio</h2>
    <input type="text" id="project-name" placeholder="Project Name" style="background:#000; color:var(--neon-cyan); border:1px solid #333; padding:5px; width:100%; margin-bottom:10px;">
    
    <div class="main-layout">
        <div class="controls-pane">
            <textarea id="svg-input" placeholder="Paste SVG code here..."></textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="optimizeSVG()">Optimize</button>
                <input type="color" id="color-picker" oninput="applyColor(this.value)">
                <button onclick="downloadSVG()">Save File</button>
            </div>
        </div>
        <div id="svg-preview" class="preview-pane"></div>
    </div>
</div>

<script>
    const input = document.getElementById('svg-input');
    const preview = document.getElementById('svg-preview');

    input.addEventListener('input', () => { preview.innerHTML = input.value; });

    function applyColor(color) {
        const svg = preview.querySelector('svg');
        if (!svg) return;
        svg.querySelectorAll('*').forEach(el => {
            if (el.hasAttribute('fill') && el.getAttribute('fill') !== 'none') el.setAttribute('fill', color);
            if (el.hasAttribute('stroke') && el.getAttribute('stroke') !== 'none') el.setAttribute('stroke', color);
        });
        input.value = svg.outerHTML;
    }

    function optimizeSVG() {
        let code = input.value
            .replace(/<!--[\s\S]*?-->/g, '')
            .replace(/<\?xml.*?\?>/g, '')
            .replace(/\s+/g, ' ')
            .replace(/>\s+</g, '><')
            .trim();
        input.value = code;
        preview.innerHTML = code;
    }

    function downloadSVG() {
        const pName = document.getElementById('project-name').value || 'untitled_svg';
        const blob = new Blob([input.value], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${pName.replace(/\s+/g, '_')}.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
