<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="128x128" href="n8-icon.png">
  <link rel="shortcut icon" href="n8-icon.png">
  <link rel="apple-touch-icon" href="n8-icon.png">
    <title>Qamelot Media Component</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: rgba(22, 24, 32, 0.85); /* Slightly translucent to let background light through if needed */
            --text-color: #ffffff;
            --font-accent: #00f2fe; /* Updated to Cyan */
            --skeleton-base: #2a2d3d;
            --skeleton-shimmer: #3b3f56;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container with Conic Gradient Animation in the Background */
        .card-wrapper {
            position: relative;
            width: 450px;
            height: 200px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            /* Conic animation directly applied to the background */
            background: conic-gradient(
                from 0deg,
                #161820 0%,
                var(--font-accent) 25%,
                #161820 50%,
                #1e90ff 75%,
                #161820 100%
            );
            background-size: 200% 200%;
            animation: rotateBackground 6s linear infinite;
        }

        /* Inner card content layer overlaying the background animation */
        .card-content {
            position: absolute;
            inset: 0; /* Cover the entire area */
            background: rgba(22, 24, 32, 0.4); /* Dark overlay to keep text highly readable against the background animation */
            backdrop-filter: blur(4px); /* Optional: Smooths out the background animation */
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- 1. Skeleton Loader State --- */
        .skeleton-container {
            position: absolute;
            inset: 0;
            background: #161820; /* Solid background hides the animation until loaded */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 4;
            animation: hideSkeleton 3.5s forwards; 
        }

        .skeleton-title {
            width: 280px;
            height: 36px;
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shimmer) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
            border-radius: 8px;
            animation: shimmer 1.5s infinite linear;
        }

        /* --- 2. Actual Content & Bouncing Ball Title --- */
        .title-container {
            position: relative;
            display: flex;
            gap: 2px;
            z-index: 3;
        }

        .letter {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
        }

        /* Space between words */
        .space {
            width: 15px; 
        }

        /* The Bouncing Ball Effect (Cyan) */
        .ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: var(--font-accent);
            border-radius: 50%;
            bottom: 8px;
            left: 0;
            animation: ballBounce 4s ease-in-out infinite; 
            box-shadow: 0 0 12px var(--font-accent), 0 0 4px #fff;
        }

        /* Individual letter bounce triggers as ball passes over them */
        .letter:nth-child(1)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 0.0s; }
        .letter:nth-child(2)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 0.2s; }
        .letter:nth-child(3)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 0.4s; }
        .letter:nth-child(4)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 0.6s; }
        .letter:nth-child(5)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 0.8s; }
        .letter:nth-child(6)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 1.0s; }
        .letter:nth-child(7)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 1.2s; }
        /* Child 8 is the space */
        .letter:nth-child(9)  { animation: letterJump 4s ease-in-out infinite; animation-delay: 1.4s; }
        .letter:nth-child(10) { animation: letterJump 4s ease-in-out infinite; animation-delay: 1.6s; }
        .letter:nth-child(11) { animation: letterJump 4s ease-in-out infinite; animation-delay: 1.8s; }
        .letter:nth-child(12) { animation: letterJump 4s ease-in-out infinite; animation-delay: 2.0s; }
        .letter:nth-child(13) { animation: letterJump 4s ease-in-out infinite; animation-delay: 2.2s; }

        /* --- ANIMATIONS --- */

        /* 1. Conic Background Rotation */
        @keyframes rotateBackground {
            0% { background-position: 0% 50%; transform: rotate(0deg); }
            100% { background-position: 100% 50%; transform: rotate(360deg); }
        }

        /* 2. Skeleton Shimmer */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Simulated Loader Dismissal */
        @keyframes hideSkeleton {
            0%, 75% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* 3. Bouncing Ball Path */
        @keyframes ballBounce {
            0%   { left: 0px; bottom: 8px; }
            10%  { bottom: 55px; }
            20%  { left: 70px; bottom: 8px; }
            30%  { bottom: 55px; }
            40%  { left: 150px; bottom: 8px; }
            50%  { bottom: 55px; }
            60%  { left: 240px; bottom: 8px; }
            70%  { bottom: 55px; }
            80%  { left: 310px; bottom: 8px; }
            90%  { left: 340px; bottom: 8px; opacity: 1; }
            95%  { opacity: 0; bottom: 8px; }
            100% { left: 0px; bottom: 8px; opacity: 0; }
        }

        /* 4. Letter Reaction Jump */
        @keyframes letterJump {
            0%, 20%, 100% { transform: translateY(0); }
            10% { transform: translateY(-10px); color: var(--font-accent); text-shadow: 0 0 8px var(--font-accent); }
        }

    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="card-content">
            
            <div class="skeleton-container">
                <div class="skeleton-title"></div>
            </div>

            <div class="title-container">
                <div class="ball"></div>
                <span class="letter">Q</span>
                <span class="letter">a</span>
                <span class="letter">m</span>
                <span class="letter">e</span>
                <span class="letter">l</span>
                <span class="letter">o</span>
                <span class="letter">t</span>
                <span class="letter space"></span>
                <span class="letter">M</span>
                <span class="letter">e</span>
                <span class="letter">d</span>
                <span class="letter">i</span>
                <span class="letter">a</span>
            </div>

        </div>
    </div>

</body>
</html>
