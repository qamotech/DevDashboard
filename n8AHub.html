<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Asset Hub</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cG9seWdvbiBwb2ludHM9IjUwLDUgOTUsMjUgOTUsNzUgNTAsOTUgNSw3NSA1LDI1IiBmaWxsPSJub25lIiBzdHJva2U9IiMwMGYzZmYiIHN0cm9rZS13aWR0aD0iNCIvPjwvc3ZnPg=="><style>:root{--bg:#050508;--c:#0ff;--p:#b0f;--g:rgba(10,10,15,.6)}body{background:var(--bg) radial-gradient(circle at 50% 0,#1a0b2e 0,var(--bg) 60%);color:#fff;font-family:system-ui,sans-serif;margin:0;padding:2vh 2vw;min-height:100vh;overflow-x:hidden}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--c);border-radius:4px}.gl{background:var(--g);backdrop-filter:blur(10px);border:1px solid rgba(0,255,255,.2);border-radius:12px;box-shadow:0 0 20px rgba(187,0,255,.1);position:relative;overflow:hidden}.gl::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,255,.1),transparent);animation:s 3s infinite linear}@keyframes s{to{left:200%}}h1,h2{margin:0 0 10px;text-transform:uppercase;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;color:transparent;letter-spacing:2px;font-weight:900}a{text-decoration:none;display:flex;align-items:center;gap:15px}.wrap{display:grid;grid-template-columns:300px 1fr 300px;gap:20px;height:85vh;margin-top:20px}.ctrls,.saver,.assets{padding:20px;display:flex;flex-direction:column;gap:15px;overflow-y:auto}.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;color:var(--c);display:flex;flex-direction:column;gap:5px;text-transform:uppercase}input,select,textarea{background:rgba(0,0,0,.5);border:1px solid var(--p);color:#fff;padding:6px;border-radius:4px;outline:none;font-family:monospace;width:100%;box-sizing:border-box}input[type=range]{accent-color:var(--c)}button{background:linear-gradient(45deg,var(--p),var(--c));border:none;padding:10px;color:#fff;font-weight:700;cursor:pointer;border-radius:4px;text-transform:uppercase;transition:.3s}button:hover{box-shadow:0 0 15px var(--c)}.prev{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,rgba(0,255,255,.03) 0,rgba(0,255,255,.03) 2px,transparent 2px,transparent 10px)}#bx{display:flex;align-items:center;justify-content:center;transition:all .2s;color:#fff;font-weight:bold;text-transform:uppercase;text-shadow:0 0 5px var(--c)}textarea{height:120px;resize:none;font-size:10px}.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ac{padding:15px 5px;text-align:center;font-size:10px;border:1px solid var(--p);cursor:pointer;transition:.3s;text-transform:uppercase}.ac:hover{border-color:var(--c);transform:scale(1.05);box-shadow:0 0 10px var(--c)}@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}</style></head><body><header><a href="https://qamotech.github.io/DevDashboard"><svg width="40" height="40" viewBox="0 0 100 100"><polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="#0ff" stroke-width="5"/><path d="M30,50 L50,30 L70,50 L50,70 Z" fill="#b0f"/><circle cx="50" cy="50" r="10" fill="#0ff"/></svg><h1>Asset Hub</h1></a></header><div class="wrap"><div class="gl ctrls"><h2>Controls</h2><div class="gr" id="ci"></div></div><div class="gl prev"><div id="bx">Preview</div></div><div class="gl"><div class="saver"><h2>Code Snippet</h2><textarea id="cd" readonly></textarea><button onclick="navigator.clipboard.writeText(cd.value)">Copy Code</button></div><div class="assets"><h2>Featured Assets</h2><div class="ag" id="ag"></div></div></div></div><script>const ctrls=[{id:'w',l:'Width',t:'range',m:50,x:400,v:150,u:'px'},{id:'h',l:'Height',t:'range',m:50,x:400,v:150,u:'px'},{id:'br',l:'Radius',t:'range',m:0,x:150,v:10,u:'px'},{id:'bl',l:'Blur',t:'range',m:0,x:20,v:5,u:'px'},{id:'op',l:'Opacity',t:'range',m:0,x:100,v:20,u:'%'},{id:'bw',l:'Border Width',t:'range',m:0,x:10,v:2,u:'px'},{id:'gs',l:'Glow Spread',t:'range',m:0,x:50,v:20,u:'px'},{id:'bc',l:'Border Color',t:'color',v:'#00ffff'},{id:'bgc',l:'BG Color',t:'color',v:'#bb00ff'},{id:'gc',l:'Glow Color',t:'color',v:'#00ffff'},{id:'tc',l:'Text Color',t:'color',v:'#ffffff'},{id:'fs',l:'Font Size',t:'range',m:10,x:40,v:16,u:'px'}];const ci=document.getElementById('ci'),bx=document.getElementById('bx'),cd=document.getElementById('cd'),ag=document.getElementById('ag');ctrls.forEach(c=>{ci.innerHTML+=`<label>${c.l}<input type="${c.t}" id="${c.id}" ${c.t==='range'?`min="${c.m}" max="${c.x}" value="${c.v}"`:`value="${c.v}"`} oninput="u()"></label>`});const an=['Cyber Core','Neon Grid','Flux Cap','Matrix Node','Plasma Arc','Quantum Bit','Data Link','Synth Wave','Aero Foil','Mech Gear','Pulse Ray','Holo Deck'];an.forEach(a=>ag.innerHTML+=`<div class="gl ac">${a}</div>`);function hexToRgba(hex,op){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${op/100})`}function u(){let v={};ctrls.forEach(c=>v[c.id]=document.getElementById(c.id).value);let bg=hexToRgba(v.bgc,v.op);bx.style.cssText=`width:${v.w}px;height:${v.h}px;border-radius:${v.br}px;backdrop-filter:blur(${v.bl}px);background:${bg};border:${v.bw}px solid ${v.bc};box-shadow:0 0 ${v.gs}px ${v.gc};color:${v.tc};font-size:${v.fs}px`;cd.value=`.cyber-asset {\n  width: ${v.w}px;\n  height: ${v.h}px;\n  border-radius: ${v.br}px;\n  backdrop-filter: blur(${v.bl}px);\n  background: ${bg};\n  border: ${v.bw}px solid ${v.bc};\n  box-shadow: 0 0 ${v.gs}px ${v.gc};\n  color: ${v.tc};\n  font-size: ${v.fs}px;\n}`};u();</script></body></html>
