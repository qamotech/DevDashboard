<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HF Gemma Background Animation Snippet</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #020203;
      --text: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    #crt-frame {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.4s cubic-bezier(0.25, 0.1, 0.25, 1) 0.6s;
    }

    #crt-frame.visible {
      opacity: 1;
    }

    #crt-frame canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none;
    }

    .hero-fade {
      position: absolute;
      inset: auto 0 0;
      z-index: 1;
      height: 68%;
      background: linear-gradient(
        to top,
        var(--bg) 0%,
        var(--bg) 14%,
        rgba(2, 2, 3, 0.55) 52%,
        transparent 100%
      );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: 100dvh;
      align-content: end;
      padding: 48px;
    }
  </style>
</head>
<body>
  <main class="hero">
    <div id="crt-frame" aria-hidden="true"></div>
    <div class="hero-fade" aria-hidden="true"></div>
    <section class="hero-content">
      <h1>Put your page content here.</h1>
    </section>
  </main>

  <script type="module" src="./hf-gemma-background-animation.js"></script>
  <script>
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.getElementById("crt-frame")?.classList.add("visible");
      });
    });
  </script>
</body>
</html>
