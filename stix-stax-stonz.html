<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://i.imgur.com/p7JzFKA.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stix Stax Stonz: Cyber Camelot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --neon-cyan: #00d2ff;
            --royal-gold: #00ff66;
            --neon-purple: #00ff66;
            --danger-red: #ff2a5f;
            --panel-dark: rgba(13, 20, 35, 0.85);
        }

        body { 
            margin: 0; 
            background: #060913; 
            background-image: 
                radial-gradient(circle at 50% 50%, #0a162b 0%, #060913 80%),
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: #fff; 
            font-family: 'Orbitron', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 10px;
            overflow-x: hidden;
        }
        
        #header { 
            width: 100%;
            max-width: 360px;
            padding: 12px 10px; 
            background: rgba(6, 10, 20, 0.85); 
            border: 1px solid rgba(189, 0, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            margin-bottom: 8px;
            z-index: 10;
        }

        h1 { 
            margin: 0 0 2px 0; 
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 1.3rem; 
            font-weight: 900;
            text-shadow: 0 0 10px var(--neon-purple), 0 0 20px rgba(189, 0, 255, 0.5);
        }

        .subtitle {
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: #a496c0;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* FEATURE 1: Overdrive Gauge UI Component */
        .gauge-matrix {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(189, 0, 255, 0.1);
        }
        .gauge-bar {
            width: 48%;
            height: 12px;
            background: #110924;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .gauge-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        #fill-p1 { background: linear-gradient(90deg, #996600, var(--royal-gold)); box-shadow: 0 0 8px var(--royal-gold); }
        #fill-p2 { background: linear-gradient(90deg, #008899, var(--neon-cyan)); box-shadow: 0 0 8px var(--neon-cyan); }
        .gauge-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.5rem;
            line-height: 12px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 1px 2px #000;
        }

        #score-ledger {
            display: flex;
            justify-content: space-around;
            margin-bottom: 8px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #8da2bb;
        }
        .score-box { font-weight: 900; }
        .score-box div { font-size: 0.55rem; color: #5a6e85; margin-top: 1px; }
        #score-p1 { color: var(--royal-gold); text-shadow: 0 0 5px rgba(255,170,0,0.4); }
        #score-p2 { color: var(--neon-cyan); text-shadow: 0 0 5px rgba(0,240,255,0.4); }
        
        /* FEATURE 7: Strategic Config Panel Layout */
        .config-row {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 8px;
        }
        select, .ctrl-btn {
            background: linear-gradient(to bottom, #251f3b 0%, #0a0614 100%); 
            border: 1px solid rgba(189, 0, 255, 0.3); 
            color: #e2bfff; 
            padding: 6px 10px; 
            border-radius: 5px; 
            font-size: 0.65rem; 
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        select { width: 48%; }
        button:hover, select:hover {
            border-color: var(--neon-cyan);
            color: #fff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }
        button.burn-active {
            border-color: var(--danger-red) !important;
            color: #fff !important;
            animation: burnGlow 0.5s infinite alternate;
        }
        @keyframes burnGlow {
            0% { box-shadow: 0 0 2px var(--danger-red); }
            100% { box-shadow: 0 0 10px var(--danger-red); }
        }

        .controls { display: flex; justify-content: center; gap: 6px; }
        
        #arena { 
            width: 340px; 
            height: 340px;
            background: linear-gradient(135deg, #0e0a1a 0%, #04030a 100%); 
            border: 3px solid #331f4d;
            border-top-color: #794bb3;
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px rgba(189, 0, 255, 0.15);
            box-sizing: border-box;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ele-shake { animation: tremor 0.12s infinite; }
        @keyframes tremor {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -2px) rotate(0.5deg); }
        }

        #board { 
            display: grid;
            grid-template-columns: repeat(4, 10px 1fr) 10px;
            grid-template-rows: repeat(4, 10px 1fr) 10px;
            width: 300px;
            height: 300px;
            background: transparent;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #d1b1ff;
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-purple);
            place-self: center;
        }

        .line-h {
            height: 10px;
            background: rgba(189, 0, 255, 0.08);
            border: 1px solid rgba(189, 0, 255, 0.15);
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            margin: 0 2px;
            align-self: center;
        }
        .line-v {
            width: 10px;
            background: rgba(189, 0, 255, 0.08);
            border: 1px solid rgba(189, 0, 255, 0.15);
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            margin: 2px 0;
            justify-self: center;
        }

        .line-h:not(.p1-active):not(.p2-active):hover,
        .line-v:not(.p1-active):not(.p2-active):hover {
            background: rgba(189, 0, 255, 0.4);
            box-shadow: 0 0 8px rgba(189, 0, 255, 0.8);
        }

        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 4px #000;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* FEATURE 9: Threat Vector Proximity Pulsing */
        .box.threat-pulse {
            animation: dangerAlert 0.4s infinite alternate ease-in-out;
        }
        @keyframes dangerAlert {
            0% { background: rgba(255, 42, 95, 0.0); }
            100% { background: rgba(255, 42, 95, 0.15); }
        }

        /* FEATURE 4: Anomaly Icons Layout */
        .anomaly-badge {
            position: absolute;
            font-size: 0.55rem;
            color: #d1b1ff;
            text-shadow: 0 0 4px var(--neon-purple);
            animation: floatNode 1.5s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes floatNode {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-3px); }
        }

        .line-h.p1-active, .line-v.p1-active {
            background: linear-gradient(90deg, #fff 0%, var(--royal-gold) 50%, #ff6600 100%);
            box-shadow: 0 0 12px var(--royal-gold);
            border-color: #fff;
            cursor: default;
        }
        .line-h.p2-active, .line-v.p2-active {
            background: linear-gradient(90deg, #fff 0%, var(--neon-cyan) 50%, #0066ff 100%);
            box-shadow: 0 0 12px var(--neon-cyan);
            border-color: #fff;
            cursor: default;
        }

        .box.p1-claim {
            background: radial-gradient(circle, rgba(255, 170, 0, 0.25) 0%, transparent 80%);
            color: var(--royal-gold);
            text-shadow: 0 0 8px var(--royal-gold);
            animation: claimPulse 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .box.p2-claim {
            background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 80%);
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            animation: claimPulse 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes claimPulse {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .box.winner-glow {
            animation: hyper-cycle 0.4s infinite alternate;
            border: 1px solid #ffffff;
            z-index: 20;
        }
        @keyframes hyper-cycle {
            0% { box-shadow: 0 0 5px #fff, inset 0 0 10px var(--neon-cyan); }
            100% { box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 20px #fff; }
        }
        
        #status { 
            margin-top: 10px; 
            color: var(--royal-gold); 
            font-weight: 900; 
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,170,0,0.3);
            z-index: 10;
        }

        /* FEATURE 6: Scrolling Marquee Ticker */
        #tactical-feed {
            width: 100%;
            max-width: 360px;
            background: #020105;
            border: 1px solid rgba(189, 0, 255, 0.15);
            border-radius: 6px;
            padding: 4px 8px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 0.55rem;
            color: #8a7fa4;
            white-space: nowrap;
            overflow: hidden;
            text-align: left;
        }
        #feed-inner {
            display: inline-block;
            animation: marquee 14s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* FEATURE 12: Integrated Navigation Footer */
        .cyber-footer {
            margin-top: 15px;
            width: 100%;
            max-width: 360px;
            border-top: 1px dashed rgba(189, 0, 255, 0.2);
            padding-top: 10px;
        }
        .menu-container {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }
        .menu-link {
            background: rgba(189, 0, 255, 0.05);
            border: 1px solid rgba(189, 0, 255, 0.15);
            color: #a496c0;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.55rem;
            text-decoration: none;
            flex-grow: 1;
            transition: all 0.2s;
        }
        .menu-link:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            color: #fff;
        }

        #ele-blast-shield {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            background: transparent;
        }
        .ele-active { animation: radiation-blast 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes radiation-blast {
            0% { background: #ffffff; opacity: 1; }
            15% { background: #ffaa00; opacity: 1; }
            35% { background: #bd00ff; opacity: 0.9; }
            100% { background: transparent; opacity: 0; }
        }
    </style>
</head>
<body>

<div id="ele-blast-shield"></div>

<div id="header">
    <h1>STIX STAX STONZ</h1>
    <div id="subtitle-node" class="subtitle">Excalibur Grid-Lock</div>
    
    <div class="gauge-matrix">
        <div class="gauge-bar">
            <div id="fill-p1" class="gauge-fill"></div>
            <div class="gauge-text">OVERDRIVE: <span id="txt-p1">0</span>%</div>
        </div>
        <div class="gauge-bar">
            <div id="fill-p2" class="gauge-fill"></div>
            <div class="gauge-text">OVERDRIVE: <span id="txt-p2">0</span>%</div>
        </div>
    </div>

    <div id="score-ledger">
        <div class="score-box">PENDRACO [P]: <span id="score-p1">0</span><div id="live-box-p1">STAX: 0</div></div>
        <div class="score-box">AVALON [A]: <span id="score-p2">0</span><div id="live-box-p2">STAX: 0</div></div>
    </div>
    
    <div class="config-row">
        <select id="aiMode" onchange="window.updateAISettings()">
            <option value="perfect">MERLIN AI (MAX)</option>
            <option value="aggressive">LANCELOT AI (AGGR)</option>
            <option value="pvp">LOCAL CO-OP MODE</option>
        </select>
        <button id="burnBtn" class="ctrl-btn" style="width: 48%;" onclick="window.toggleOverdriveBreak()">OVERDRIVE BREAK</button>
    </div>

    <div class="controls">
        <button onclick="window.resetMatch()">RESET MATRIX</button>
        <button onclick="window.undoTurn()">CHRONO UNDO</button>
    </div>
</div>

<div id="arena">
    <div id="board"></div>
</div>

<div id="status">PENDRACO'S TURN</div>

<div id="tactical-feed"><div id="feed-inner">SYS READY // MATRIX LOADED // AWAITING NEURAL SEED DEPLOYMENT...</div></div>

<footer class="cyber-footer">
    <div class="menu-container">
        <a href="stix-stax-stonz.html" class="menu-link">Stix Stax Stonz</a>
        <a href="blood-and-gold-panther-arena.html" class="menu-link">--C4N8--</a>
        <a href="tri-nexus-grail-matrix.html" class="menu-link">--TRINEXUS--</a>
        <a href="mecha-strike.html" class="menu-link">--MENU--</a>
    </div>
</footer>

<script>
    const MATRIX_SIZE = 9; 

    // Architectural Properties
    window.turn = 1; 
    window.gameState = []; 
    window.moveHistory = []; 
    window.gameOver = false;
    
    let p1Wins = 0;
    let p2Wins = 0;
    let comboCount = 0; // FEATURE 10: Combo Multiplier Tracking

    // FEATURE 1 & 3: Overdrive Config Flags
    let overdriveP1 = 0;
    let overdriveP2 = 0;
    let breakActive = false;
    let matchSeed = ""; // FEATURE 8: Structural Round Seed Identifier

    // FEATURE 1: Audio Synthesizer Engine
    const SynthAudio = {
        ctx: null,
        init() {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        playTone(freq, type, duration) {
            this.init();
            try {
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {}
        },
        line() { this.playTone(523.25, 'sine', 0.12); }, // C5 node pulse
        capture() { this.playTone(659.25, 'triangle', 0.2); }, // E5 capture tone
        combo(count) { this.playTone(783.99 + (count * 60), 'sine', 0.15); }, // Escalating arpeggio
        overdrive() { this.playTone(220, 'sawtooth', 0.35); }, // Low-pass break activation
        win() {
            this.init();
            let now = this.ctx ? this.ctx.currentTime : 0;
            this.playTone(523.25, 'triangle', 0.25);
            setTimeout(() => this.playTone(659.25, 'triangle', 0.25), 120);
            setTimeout(() => this.playTone(783.99, 'triangle', 0.25), 240);
            setTimeout(() => this.playTone(1046.50, 'triangle', 0.4), 360);
        }
    };

    function generateRoundSeed() {
        matchSeed = "SEED-" + Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('subtitle-node').innerText = `Excalibur Grid-Lock [${matchSeed}]`;
    }

    function initMatrix() {
        window.gameState = [];
        for (let r = 0; r < MATRIX_SIZE; r++) {
            let row = [];
            for (let c = 0; c < MATRIX_SIZE; c++) {
                // FEATURE 4: Procedural Holy Grail Anomalies
                let val = 0;
                if (r % 2 === 1 && c % 2 === 1) {
                    let rand = Math.random();
                    if (rand < 0.12) val = 10; // Grail Shard (AP boost)
                    else if (rand > 0.88) val = 20; // Sacred Stone (Double points)
                }
                row.push(val);
            }
            window.gameState.push(row);
        }
        breakActive = false;
        document.getElementById('burnBtn').classList.remove('burn-active');
    }

    // Board Generation
    const board = document.getElementById('board');
    for (let r = 0; r < MATRIX_SIZE; r++) {
        for (let c = 0; c < MATRIX_SIZE; c++) {
            const cell = document.createElement('div');
            cell.id = `cell-${r}-${c}`;
            
            if (r % 2 === 0 && c % 2 === 0) {
                cell.className = 'dot';
            } else if (r % 2 === 0 && c % 2 === 1) {
                cell.className = 'line-h';
                cell.onclick = () => window.handleLineClick(r, c);
            } else if (r % 2 === 1 && c % 2 === 0) {
                cell.className = 'line-v';
                cell.onclick = () => window.handleLineClick(r, c);
            } else {
                cell.className = 'box';
            }
            board.appendChild(cell);
        }
    }

    window.updateAISettings = function() {
        logTactical(`AI INTERFACE SHIFTED TO: ${document.getElementById('aiMode').value.toUpperCase()}`);
        window.resetMatch();
    };

    window.toggleOverdriveBreak = function() {
        if (window.gameOver) return;
        let currentAP = (window.turn === 1) ? overdriveP1 : overdriveP2;
        if (currentAP < 100) {
            logTactical("CRITICAL: ACTION pool METERS INSUFFICIENT FOR OVERDRIVE BREAK");
            return;
        }
        breakActive = !breakActive;
        SynthAudio.overdrive();
        const btn = document.getElementById('burnBtn');
        if (breakActive) {
            btn.classList.add('burn-active');
            logTactical(`BURST: PLAYER ${window.turn} ENGAGES OVERDRIVE BREAK // IMMEDIATE MULTI-STIX DEPLOYMENT ENABLED`);
        } else {
            btn.classList.remove('burn-active');
        }
    };

    window.resetMatch = function() {
        window.turn = 1;
        window.gameOver = false;
        window.moveHistory = [];
        overdriveP1 = 0;
        overdriveP2 = 0;
        comboCount = 0;
        generateRoundSeed();
        initMatrix();
        
        document.getElementById('arena').classList.remove('ele-shake');
        document.getElementById('ele-blast-shield').classList.remove('ele-active');
        
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = "PENDRACO'S TURN";
        statusEl.style.color = "var(--royal-gold)";
        statusEl.style.textShadow = "0 0 5px rgba(255,170,0,0.3)";

        syncDOMToState();
        logTactical(`NEW MATRIX STABLY GENERATED [${matchSeed}] // MERLIN ALGORITHMS ONLINE`);
    };

    window.handleLineClick = function(r, c) {
        if (window.gameOver) return;
        if (window.gameState[r][c] !== 0) return;
        
        let aiMode = document.getElementById('aiMode').value;
        if (aiMode !== 'pvp' && window.turn === 2) return; // Prevent clicking during AI scheduling

        executeMove(r, c);
    };

    function executeMove(r, c) {
        // Record precise deep copy state before mutation for clear Chrono Undos
        window.moveHistory.push({
            gameState: JSON.parse(JSON.stringify(window.gameState)),
            turn: window.turn,
            overdriveP1: overdriveP1,
            overdriveP2: overdriveP2
        });

        // Set line state to current player index (1 or 2)
        window.gameState[r][c] = window.turn;
        
        if (navigator.vibrate) navigator.vibrate(40);
        SynthAudio.line();

        let adjacentBoxes = getAdjacentBoxes(r, c);
        let capturedAnyBoxThisTurn = false;

        for (let box of adjacentBoxes) {
            if (countBoxLines(box.r, box.c) === 4 && (window.gameState[box.r][box.c] === 0 || window.gameState[box.r][box.c] >= 10)) {
                let anomalyValue = window.gameState[box.r][box.c];
                
                // Process base ownership
                window.gameState[box.r][box.c] = (window.turn === 1) ? -1 : -2; 
                capturedAnyBoxThisTurn = true;
                
                // FEATURE 4: Process Anomalies Rewards
                if (anomalyValue === 10) {
                    adjustOverdrive(window.turn, 50);
                    logTactical(`ANOMALY: GRAIL SHARD PIERCED // BONUS AP INSTANTLY ALLOCATED`);
                } else if (anomalyValue === 20) {
                    // Stored in state matrix as specific values for doubled calculation loops later
                    window.gameState[box.r][box.c] = (window.turn === 1) ? -11 : -22;
                    logTactical(`ANOMALY: SACRED STONE EXTRACTED // SCORE MODIFIER ENGAGED`);
                }
                
                // FEATURE 10: Combo Tracking Chain Mechanics
                comboCount++;
                if (comboCount > 1) {
                    SynthAudio.combo(comboCount);
                    logTactical(`COMBO TRIGGERED: CASCADING SECURED CHANNELS ×${comboCount}!`);
                } else {
                    SynthAudio.capture();
                }
            }
        }

        // FEATURE 1: AP Allocation Metrics
        adjustOverdrive(window.turn, capturedAnyBoxThisTurn ? 30 : 15);
        // Passive minor generation adjustment loop for opponent
        adjustOverdrive(window.turn === 1 ? 2 : 1, 5);

        syncDOMToState();

        // Calculate and process live score tracking
        let totalClaimed = 0;
        let p1Boxes = 0;
        let p2Boxes = 0;
        for (let br = 1; br < MATRIX_SIZE; br += 2) {
            for (let bc = 1; bc < MATRIX_SIZE; bc += 2) {
                let val = window.gameState[br][bc];
                if (val === -1) { p1Boxes++; totalClaimed++; }
                if (val === -11) { p1Boxes += 2; totalClaimed++; } // Double score points anomaly
                if (val === -2) { p2Boxes++; totalClaimed++; }
                if (val === -22) { p2Boxes += 2; totalClaimed++; }
            }
        }

        if (totalClaimed === 16) {
            executeELESequence(p1Boxes, p2Boxes);
            return;
        }

        // FEATURE 3: Overdrive Break Rule Modifiers
        if (breakActive) {
            // Spend the meter but keep the action priority chain alive for a true secondary stix placement
            if (window.turn === 1) overdriveP1 = 0; else overdriveP2 = 0;
            breakActive = false;
            document.getElementById('burnBtn').classList.remove('burn-active');
            logTactical(`OVERDRIVE EXPENDED // EXTRA DEPLOYMENT VECTOR RESOLVED CLEANLY`);
            
            // Check if AI needs to execute its chain immediately following player double placement
            let aiMode = document.getElementById('aiMode').value;
            if (aiMode !== 'pvp' && window.turn === 2) {
                setTimeout(() => executeAdaptiveAI(aiMode), 450);
            }
            return; 
        }

        if (!capturedAnyBoxThisTurn) {
            window.turn = (window.turn === 1 ? 2 : 1);
            comboCount = 0; // Break chain sequence
        }

        updateStatusDisplay();

        let aiMode = document.getElementById('aiMode').value;
        if (aiMode !== 'pvp' && window.turn === 2) {
            setTimeout(() => executeAdaptiveAI(aiMode), 450);
        }
    }

    function adjustOverdrive(player, amount) {
        if (player === 1) overdriveP1 = Math.min(100, overdriveP1 + amount);
        else overdriveP2 = Math.min(100, overdriveP2 + amount);
    }

    function syncDOMToState() {
        let p1DisplayScore = 0;
        let p2DisplayScore = 0;

        for (let r = 0; r < MATRIX_SIZE; r++) {
            for (let c = 0; c < MATRIX_SIZE; c++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                if (!cell) continue;

                // Scrub dynamic configuration additions clean
                cell.className = cell.className.split(' ')[0];
                
                // Clear any lingering anomaly text nodes
                if (r % 2 === 1 && c % 2 === 1 && cell.children.length === 0) {
                    cell.innerHTML = ''; 
                }

                let val = window.gameState[r][c];

                // Render Active Lines Configurations maps
                if ((r % 2 === 0 && c % 2 === 1) || (r % 2 === 1 && c % 2 === 0)) {
                    if (val === 1) cell.classList.add('p1-active');
                    else if (val === 2) cell.classList.add('p2-active');
                }

                // Render Captured Matrix Fortresses & Anomalies
                if (r % 2 === 1 && c % 2 === 1) {
                    if (val === -1 || val === -11) {
                        cell.classList.add('p1-claim');
                        cell.innerHTML = 'P';
                        p1DisplayScore += (val === -11) ? 2 : 1;
                    } else if (val === -2 || val === -22) {
                        cell.classList.add('p2-claim');
                        cell.innerHTML = 'A';
                        p2DisplayScore += (val === -22) ? 2 : 1;
                    } else if (val === 10) {
                        if(!cell.querySelector('.anomaly-badge')) {
                            cell.innerHTML = `<span class="anomaly-badge">✦ AP</span>`;
                        }
                    } else if (val === 20) {
                        if(!cell.querySelector('.anomaly-badge')) {
                            cell.innerHTML = `<span class="anomaly-badge">💎 ×2</span>`;
                        }
                    } else {
                        // FEATURE 9: Check Threat Status Vectors (3 out of 4 lines completed)
                        if (countBoxLines(r, c) === 3) {
                            cell.classList.add('threat-pulse');
                        }
                    }
                }
            }
        }

        // Sync visual data panels
        document.getElementById('live-box-p1').innerText = `STAX: ${p1DisplayScore}`;
        document.getElementById('live-box-p2').innerText = `STAX: ${p2DisplayScore}`;
        document.getElementById('fill-p1').style.width = `${overdriveP1}%`;
        document.getElementById('txt-p1').innerText = overdriveP1;
        document.getElementById('fill-p2').style.width = `${overdriveP2}%`;
        document.getElementById('txt-p2').innerText = overdriveP2;
    }

    window.undoTurn = function() {
        if (window.gameOver || window.moveHistory.length === 0) return;

        let snapshot = window.moveHistory.pop();
        let aiMode = document.getElementById('aiMode').value;

        // Cascade backwards through automated machine processes if matching solo profile targets
        if (aiMode !== 'pvp') {
            while (snapshot && snapshot.turn === 2 && window.moveHistory.length > 0) {
                snapshot = window.moveHistory.pop();
            }
        }

        if (snapshot) {
            window.gameState = snapshot.gameState;
            window.turn = snapshot.turn;
            overdriveP1 = snapshot.overdriveP1;
            overdriveP2 = snapshot.overdriveP2;
            comboCount = 0;
            logTactical("CHRONO ROLLBACK: DATA SNAPSHOT RE-INSTATED");
            syncDOMToState();
            updateStatusDisplay();
        }
    };

    function getAdjacentBoxes(r, c) {
        let boxes = [];
        if (r % 2 === 0) { 
            if (r > 0) boxes.push({ r: r - 1, c: c });
            if (r < MATRIX_SIZE - 1) boxes.push({ r: r + 1, c: c });
        } else { 
            if (c > 0) boxes.push({ r: r, c: c - 1 });
            if (c < MATRIX_SIZE - 1) boxes.push({ r: r, c: c + 1 });
        }
        return boxes;
    }

    function countBoxLines(br, bc) {
        let count = 0;
        if (window.gameState[br - 1][bc] === 1 || window.gameState[br - 1][bc] === 2) count++; 
        if (window.gameState[br + 1][bc] === 1 || window.gameState[br + 1][bc] === 2) count++; 
        if (window.gameState[br][bc - 1] === 1 || window.gameState[br][bc - 1] === 2) count++; 
        if (window.gameState[br][bc + 1] === 1 || window.gameState[br][bc + 1] === 2) count++; 
        return count;
    }

    function updateStatusDisplay() {
        const statusEl = document.getElementById('status');
        if (window.turn === 1) {
            statusEl.innerHTML = "PENDRACO'S TURN";
            statusEl.style.color = "var(--royal-gold)";
            statusEl.style.textShadow = "0 0 5px rgba(255,170,0,0.3)";
        } else {
            statusEl.innerHTML = "AVALON'S TURN";
            statusEl.style.color = "var(--neon-cyan)";
            statusEl.style.textShadow = "0 0 5px rgba(0,240,255,0.3)";
        }
    }

    function logTactical(msg) {
        const inner = document.getElementById('feed-inner');
        inner.innerText = `// ${msg}   |   ${inner.innerText}`.substring(0, 400);
    }

    // FEATURE 5: Adaptive Cyber-Tactician AI Framework
    function executeAIMove() {
        // Wrapper function matching architecture signatures safely
    }

    function executeAdaptiveAI(mode) {
        if (window.gameOver) return;

        let openLines = [];
        for (let r = 0; r < MATRIX_SIZE; r++) {
            for (let c = 0; c < MATRIX_SIZE; c++) {
                if ((r % 2 === 0 && c % 2 === 1) || (r % 2 === 1 && c % 2 === 0)) {
                    if (window.gameState[r][c] === 0) openLines.push({ r, c });
                }
            }
        }
        if (openLines.length === 0) return;

        // Core AI priority filters mappings
        let immediateCaptures = []; 
        let safeMoves = []; 
        let riskyMoves = []; 

        for (let line of openLines) {
            let maxLinesCreatedInAdjacentBoxes = 0;
            let triggersInstantBoxCapture = false;

            let adj = getAdjacentBoxes(line.r, line.c);
            for (let box of adj) {
                let linesCount = countBoxLines(box.r, box.c);
                if (linesCount === 3) triggersInstantBoxCapture = true;
                if (linesCount + 1 > maxLinesCreatedInAdjacentBoxes) {
                    maxLinesCreatedInAdjacentBoxes = linesCount + 1;
                }
            }

            if (triggersInstantBoxCapture) immediateCaptures.push(line);
            else if (maxLinesCreatedInAdjacentBoxes < 3) safeMoves.push(line);
            else riskyMoves.push(line);
        }

        // FEATURE 5: Sub-Personality Difficulty Routing Mechanics
        let selectedChoice = null;

        if (mode === 'aggressive') {
            // Lancelot Personality: Hyper focuses anomalies and aggressive capture trades
            if (immediateCaptures.length > 0) {
                selectedChoice = immediateCaptures[Math.floor(Math.random() * immediateCaptures.length)];
            } else {
                // Check if any risky moves give access to high value double points blocks
                selectedChoice = openLines[Math.floor(Math.random() * openLines.length)];
            }
        } else {
            // Merlin Personality: Perfect tactical analytical graph filtering
            if (immediateCaptures.length > 0) {
                selectedChoice = immediateCaptures[Math.floor(Math.random() * immediateCaptures.length)];
            } else if (safeMoves.length > 0) {
                selectedChoice = safeMoves[Math.floor(Math.random() * safeMoves.length)];
            } else {
                selectedChoice = riskyMoves[Math.floor(Math.random() * riskyMoves.length)];
            }
        }

        if (selectedChoice) {
            executeMove(selectedChoice.r, selectedChoice.c);
        }
    }

    // FEATURE 11: Comprehensive Victory Rank Calculation Engine
    function executeELESequence(p1Boxes, p2Boxes) {
        window.gameOver = true;
        
        const shield = document.getElementById('ele-blast-shield');
        shield.classList.add('ele-active');
        
        document.getElementById('arena').classList.add('ele-shake');
        SynthAudio.win();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100, 50, 400]);
        }

        flashHardwareTorch(500);

        let winnerIndex = p1Boxes > p2Boxes ? 1 : (p2Boxes > p1Boxes ? 2 : 0);
        let absoluteMargin = Math.abs(p1Boxes - p2Boxes);
        let rankTitle = "KNIGHT PALADIN";

        if (absoluteMargin >= 10) rankTitle = "HIGH SOVEREIGN OVERLORD";
        else if (absoluteMargin <= 3) rankTitle = "BORDERLAND GLADIATOR";

        if (winnerIndex === 1) {
            p1Wins++;
            document.getElementById('score-p1').innerHTML = p1Wins;
        } else if (winnerIndex === 2) {
            p2Wins++;
            document.getElementById('score-p2').innerHTML = p2Wins;
        }

        // Flash win configuration loops overlay graphics map layers
        for (let br = 1; br < MATRIX_SIZE; br += 2) {
            for (let bc = 1; bc < MATRIX_SIZE; bc += 2) {
                let cellVal = window.gameState[br][bc];
                let isP1Match = (winnerIndex === 1 && (cellVal === -1 || cellVal === -11));
                let isP2Match = (winnerIndex === 2 && (cellVal === -2 || cellVal === -22));
                
                if (isP1Match || isP2Match) {
                    document.getElementById(`cell-${br}-${bc}`).classList.add('winner-glow');
                }
            }
        }

        const statusEl = document.getElementById('status');
        if (winnerIndex === 1) {
            statusEl.innerHTML = `PENDRACO WINS [RANK: ${rankTitle}]`;
            statusEl.style.color = "var(--royal-gold)";
            statusEl.style.textShadow = "0 0 12px var(--royal-gold)";
        } else if (winnerIndex === 2) {
            statusEl.innerHTML = `AVALON TRIUMPHS [RANK: ${rankTitle}]`;
            statusEl.style.color = "var(--neon-cyan)";
            statusEl.style.textShadow = "0 0 12px var(--neon-cyan)";
        } else {
            statusEl.innerHTML = "TIE LOCK // STALEMATE SPLIT";
            statusEl.style.color = "#ffffff";
            statusEl.style.textShadow = "0 0 12px #ffffff";
        }
        logTactical(`CONCLUDED // WAR FOR ALBION SETTLED TERMINALLY. REBOOT MATRIX.`);
    }

    async function flashHardwareTorch(durationMs) {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();
            if (capabilities.torch) {
                await track.applyConstraints({ advanced: [{ torch: true }] });
                setTimeout(async () => {
                    await track.applyConstraints({ advanced: [{ torch: false }] });
                    track.stop();
                }, durationMs);
            } else {
                track.stop();
            }
        } catch (e) {}
    }

    // Fire Init Core Arrays Operations Sequence Maps
    window.resetMatch();
</script>
