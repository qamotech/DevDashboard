<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" sizes="128x128" href="n8-icon.png">
  <link rel="shortcut icon" href="n8-icon.png">
  <link rel="apple-touch-icon" href="n8-icon.png">
    <title>CYBER-COUNT CALCUN8R // EDISON HWY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-color: #060913; 
            --panel-bg: rgba(13, 20, 35, 0.7);
            --vibranium: #00ff66; /* Neon Green */
            --autobot-gold: #00f5d4; /* Cyber Cyan */
            --excalibur: #f0f8ff; /* White/Ice */
            --energon: #00d2ff; /* Cyber Blue */
            --text-main: #8fa2b2;
            --danger-red: #ff3333;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--vibranium);
            padding-bottom: 15px;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 20px -10px rgba(138, 43, 226, 0.3);
            position: relative; 
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--excalibur);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 0 10px rgba(224, 230, 237, 0.5), 0 0 20px var(--vibranium);
            padding: 0 20px;
        }

        .subtitle {
            color: var(--autobot-gold);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .btn-fullscreen {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(0, 240, 255, 0.1);
            color: var(--energon);
            border: 1px solid var(--energon);
            padding: 8px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-fullscreen:hover, .btn-fullscreen.active {
            background: var(--energon);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        @media (max-width: 768px) {
            .btn-fullscreen {
                position: relative;
                margin: 15px auto 0 auto;
                justify-content: center;
                width: 200px;
            }
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 80px; /* Reduced margin so it doesn't leave massive blank space */
        }

        .calc-card {
            background: var(--panel-bg);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-top: 3px solid var(--energon);
            border-radius: 4px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .calc-card:hover {
            border-color: var(--energon);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1), 0 8px 25px rgba(138, 43, 226, 0.4);
        }

        .card-header {
            font-family: 'Orbitron', sans-serif;
            color: var(--autobot-gold);
            font-size: 1.4rem;
            border-bottom: 1px solid rgba(255, 183, 0, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .meta-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .meta-inputs input[type="text"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--vibranium);
            color: var(--excalibur);
            font-family: 'Rajdhani', sans-serif;
            padding: 6px;
            font-size: 0.9rem;
            outline: none;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
        }

        .calc-section {
            margin-bottom: 20px;
        }

        .section-title {
            color: var(--excalibur);
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .spec-tag {
            font-size: 0.8rem;
            color: var(--vibranium);
            background: rgba(138, 43, 226, 0.1);
            padding: 2px 6px;
            border-radius: 2px;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-group.three-col {
            grid-template-columns: repeat(3, 1fr);
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            color: #8b9bb4;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #2a3441;
            color: var(--energon);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 2px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .result-box {
            background: rgba(0, 240, 255, 0.05);
            border-left: 3px solid var(--energon);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
        }

        .result-label {
            color: var(--text-main);
            font-size: 0.8rem;
        }

        .result-value {
            color: var(--energon);
            font-size: 1.3rem;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        button {
            flex: 1;
            padding: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 2px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-log {
            background: rgba(255, 183, 0, 0.2);
            color: var(--autobot-gold);
            border: 1px solid var(--autobot-gold);
        }

        .btn-log:hover {
            background: var(--autobot-gold);
            color: #000;
            box-shadow: 0 0 10px var(--autobot-gold);
        }

        .btn-clear {
            background: rgba(255, 51, 51, 0.1);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
        }

        /* --- UPDATED TERMINAL DRAWER CSS --- */
        .terminal-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 350px; /* Taller on PC, but handles overflow */
            max-height: 50vh; /* Never take up more than half the screen height when open */
            background: #050608;
            border-top: 2px solid var(--vibranium);
            box-sizing: border-box;
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* The collapsed state pushes everything off-screen EXCEPT the 55px header */
        .terminal-panel.collapsed {
            transform: translateY(calc(100% - 55px));
        }

        .terminal-header {
            font-family: 'Orbitron', sans-serif;
            color: var(--vibranium);
            font-size: 1rem;
            padding: 15px 20px;
            background: #0d0e15;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .terminal-header:hover {
            background: rgba(138, 43, 226, 0.1);
        }

        /* Little arrow indicator */
        .toggle-icon {
            transition: transform 0.3s ease;
            color: var(--energon);
        }
        .collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .terminal-content {
            padding: 10px 20px 20px;
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 600px; /* Forces horizontal scroll on tiny screens inside the drawer */
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #1a2233;
        }

        th { color: var(--autobot-gold); }
        td { color: var(--excalibur); }
        .row-total { color: var(--energon); font-weight: 700; font-family: 'Orbitron', sans-serif; }

    </style>
</head>
<body>

    <header>
        <h1>Cyber-Count CalcuN8r</h1>
        <div class="subtitle">EDISON HWY // INVENTORY PROTOCOL</div>
        <button id="fullscreen-btn" class="btn-fullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            <span>FULLSCREEN</span>
        </button>
    </header>

    <div class="calc-grid" id="calculator-container"></div>

    <div class="terminal-panel collapsed" id="terminal-drawer">
        <div class="terminal-header" onclick="toggleDrawer()">
            <span>DATA VAULT // ACTION LOG</span>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="global-total" style="color: var(--energon);">SYSTEM READY</span>
                <svg class="toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
        </div>
        <div class="terminal-content">
            <table id="log-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Brand</th>
                        <th>Type</th>
                        <th>Lot(s)</th>
                        <th>Location(s)</th>
                        <th>P-R-C-U / P-R-U</th>
                        <th>Total Cans</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- TERMINAL DRAWER LOGIC ---
        function toggleDrawer() {
            const drawer = document.getElementById('terminal-drawer');
            drawer.classList.toggle('collapsed');
        }

        // Open the drawer automatically when you log a count, so you see it worked
        function openDrawer() {
            const drawer = document.getElementById('terminal-drawer');
            drawer.classList.remove('collapsed');
        }

        // --- FULLSCREEN LOGIC ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenText = fullscreenBtn.querySelector('span');

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.warn(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                e.preventDefault(); 
                toggleFullScreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenText.innerText = 'EXIT FULLSCREEN';
                fullscreenBtn.classList.add('active');
            } else {
                fullscreenText.innerText = 'FULLSCREEN';
                fullscreenBtn.classList.remove('active');
            }
        });


        // --- CALCULATOR LOGIC ---
        const metricsData = [
            { id: "popz", name: "Popz", filled: { p_total: 2400, r_total: 10, c_total: 24, spec: "24-Pack" }, empty: { p_total: 8169, r_total: 21, spec: "12 oz / 202" } },
            { id: "frost", name: "Frost & Summer Frost", filled: { p_total: 1680, r_total: 7, c_total: 12, spec: "12-Pack" }, empty: { p_total: 6224, r_total: 16, spec: "16 oz / 202" } },
            { id: "gridlock", name: "Gridlock", filled: { p_total: 1680, r_total: 7, c_total: 12, spec: "12-Pack" }, empty: { p_total: 6224, r_total: 16, spec: "12 oz Sleek" } },
            { id: "waves", name: "Waves", filled: { p_total: 2496, r_total: 8, c_total: 24, spec: "24-Pack" }, empty: { p_total: 8096, r_total: 16, spec: "12 oz Sleek" } },
            { id: "bellevie", name: "Belle Vie", filled: { p_total: 2400, r_total: 10, c_total: 24, spec: "24-Pack" }, empty: { p_total: 8169, r_total: 21, spec: "12 oz / 202" } }
        ];

        const container = document.getElementById('calculator-container');
        const logBody = document.getElementById('log-body');

        // Generator Engine
        metricsData.forEach(brand => {
            const fRowsPerPallet = brand.filled.p_total / brand.filled.r_total;
            const eRowsPerPallet = brand.empty.p_total / brand.empty.r_total;

            const cardHTML = `
                <div class="calc-card" id="card-${brand.id}">
                    <div class="card-header">${brand.name}</div>
                    
                    <div class="meta-inputs">
                        <input type="text" id="${brand.id}-lot" placeholder="LOT CODE(S)">
                        <input type="text" id="${brand.id}-loc" placeholder="LOCATION(S)">
                    </div>
                    
                    <div class="calc-section">
                        <div class="section-title">
                            FILLED CANS <span class="spec-tag">${brand.filled.spec}</span>
                        </div>
                        <div class="input-group four-col">
                            <div class="input-field">
                                <label>P (x${brand.filled.p_total})</label>
                                <input type="number" id="${brand.id}-f-p" min="0" placeholder="0">
                            </div>
                            <div class="input-field">
                                <label>R (x${fRowsPerPallet})</label>
                                <input type="number" id="${brand.id}-f-r" min="0" placeholder="0">
                            </div>
                            <div class="input-field">
                                <label>C (x${brand.filled.c_total})</label>
                                <input type="number" id="${brand.id}-f-c" min="0" placeholder="0">
                            </div>
                            <div class="input-field">
                                <label>U (x1)</label>
                                <input type="number" id="${brand.id}-f-u" min="0" placeholder="0">
                            </div>
                        </div>
                        <div class="result-box">
                            <span class="result-label">FILLED TOTAL:</span>
                            <span class="result-value" id="${brand.id}-f-total" data-val="0">0</span>
                        </div>
                    </div>

                    <div class="calc-section">
                        <div class="section-title">
                            EMPTY CANS <span class="spec-tag">${brand.empty.spec}</span>
                        </div>
                        <div class="input-group three-col">
                            <div class="input-field">
                                <label>P (x${brand.empty.p_total})</label>
                                <input type="number" id="${brand.id}-e-p" min="0" placeholder="0">
                            </div>
                            <div class="input-field">
                                <label>R (x${Math.round(eRowsPerPallet)})</label>
                                <input type="number" id="${brand.id}-e-r" min="0" placeholder="0">
                            </div>
                            <div class="input-field">
                                <label>U (x1)</label>
                                <input type="number" id="${brand.id}-e-u" min="0" placeholder="0">
                            </div>
                        </div>
                        <div class="result-box" style="border-left-color: var(--vibranium);">
                            <span class="result-label">EMPTY TOTAL:</span>
                            <span class="result-value" style="color: var(--excalibur);" id="${brand.id}-e-total" data-val="0">0</span>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-clear" onclick="clearCard('${brand.id}')">CLEAR</button>
                        <button class="btn-log" onclick="logCard('${brand.id}', '${brand.name}')">LOG COUNT</button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHTML);
        });

        // Calculation Engine
        metricsData.forEach(brand => {
            const fRowsPerPallet = brand.filled.p_total / brand.filled.r_total;
            const eRowsPerPallet = brand.empty.p_total / brand.empty.r_total;

            const fp = document.getElementById(`${brand.id}-f-p`);
            const fr = document.getElementById(`${brand.id}-f-r`);
            const fc = document.getElementById(`${brand.id}-f-c`);
            const fu = document.getElementById(`${brand.id}-f-u`);
            const fTotal = document.getElementById(`${brand.id}-f-total`);

            const ep = document.getElementById(`${brand.id}-e-p`);
            const er = document.getElementById(`${brand.id}-e-r`);
            const eu = document.getElementById(`${brand.id}-e-u`);
            const eTotal = document.getElementById(`${brand.id}-e-total`);

            const calcFilled = () => {
                const p = parseInt(fp.value) || 0;
                const r = parseInt(fr.value) || 0;
                const c = parseInt(fc.value) || 0;
                const u = parseInt(fu.value) || 0;
                const total = (p * brand.filled.p_total) + (r * fRowsPerPallet) + (c * brand.filled.c_total) + u;
                fTotal.innerText = total.toLocaleString();
                fTotal.setAttribute('data-val', total);
            };

            const calcEmpty = () => {
                const p = parseInt(ep.value) || 0;
                const r = parseInt(er.value) || 0;
                const u = parseInt(eu.value) || 0;
                const total = (p * brand.empty.p_total) + (r * Math.round(eRowsPerPallet)) + u;
                eTotal.innerText = total.toLocaleString();
                eTotal.setAttribute('data-val', total);
            };

            [fp, fr, fc, fu].forEach(input => input.addEventListener('input', calcFilled));
            [ep, er, eu].forEach(input => input.addEventListener('input', calcEmpty));
        });

        // Clear Card
        function clearCard(brandId) {
            const inputs = document.querySelectorAll(`#card-${brandId} input[type="number"], #card-${brandId} input[type="text"]`);
            inputs.forEach(input => input.value = '');
            
            document.getElementById(`${brandId}-f-total`).innerText = '0';
            document.getElementById(`${brandId}-f-total`).setAttribute('data-val', '0');
            
            document.getElementById(`${brandId}-e-total`).innerText = '0';
            document.getElementById(`${brandId}-e-total`).setAttribute('data-val', '0');
        }

        // Log Count
        function logCard(brandId, brandName) {
            const lot = document.getElementById(`${brandId}-lot`).value || 'N/A';
            const loc = document.getElementById(`${brandId}-loc`).value || 'N/A';
            
            const fp = document.getElementById(`${brandId}-f-p`).value || '0';
            const fr = document.getElementById(`${brandId}-f-r`).value || '0';
            const fc = document.getElementById(`${brandId}-f-c`).value || '0';
            const fu = document.getElementById(`${brandId}-f-u`).value || '0';
            const fTotal = parseInt(document.getElementById(`${brandId}-f-total`).getAttribute('data-val'));

            const ep = document.getElementById(`${brandId}-e-p`).value || '0';
            const er = document.getElementById(`${brandId}-e-r`).value || '0';
            const eu = document.getElementById(`${brandId}-e-u`).value || '0';
            const eTotal = parseInt(document.getElementById(`${brandId}-e-total`).getAttribute('data-val'));

            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

            let logged = false;

            if(fTotal > 0) {
                appendLog(timeString, brandName, 'Filled', lot, loc, `${fp}p - ${fr}r - ${fc}c - ${fu}u`, fTotal);
                logged = true;
            }
            if(eTotal > 0) {
                appendLog(timeString, brandName, 'Empty', lot, loc, `${ep}p - ${er}r - ${eu}u`, eTotal);
                logged = true;
            }

            if(!logged) {
                alert("No counts entered to log.");
            } else {
                clearCard(brandId);
                openDrawer(); // Pop the drawer open so you know it logged successfully
            }
        }

        function appendLog(time, brand, type, lot, loc, prcu, total) {
            const row = `
                <tr>
                    <td>${time}</td>
                    <td>${brand}</td>
                    <td style="color: ${type === 'Filled' ? 'var(--energon)' : 'var(--vibranium)'};">${type}</td>
                    <td>${lot}</td>
                    <td>${loc}</td>
                    <td>${prcu}</td>
                    <td class="row-total">${total.toLocaleString()}</td>
                </tr>
            `;
            logBody.insertAdjacentHTML('afterbegin', row);
        }
    </script>
    <input type="text" inputmode="none" />
</body>
</html>
