<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mecha Strike: Transformer Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; touch-action: none; }
        .cyber-text { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
        .btn-cyber { 
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); 
            transition: all 0.1s;
        }
        .btn-cyber:active { transform: scale(0.95); box-shadow: 0 0 20px rgba(0, 255, 255, 0.9); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- AUDIO SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playSound = (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'explode') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        };

        const Game = () => {
            const canvasRef = useRef(null);
            const [gameState, setGameState] = useState('menu'); // menu, playing, gameover
            const [score, setScore] = useState(0);
            
            // Mutable game state to avoid React re-render lag in animation loop
            const engine = useRef({
                player: { x: 0, y: 0, w: 40, h: 40, speed: 5, spread: false, shield: 0 },
                keys: { up: false, down: false, left: false, right: false, shoot: false },
                bullets: [], enemies: [], particles: [], stars: [], powerups: [],
                lastShot: 0, frameCount: 0, difficulty: 1, lastTime: 0,
                isPlaying: false // Fixed: Use mutable ref for the loop condition
            }).current;

            // --- PROCEDURAL GRAPHICS (MECHA STYLE) ---
            const drawAutobot = (ctx, x, y, shield) => {
                ctx.save(); ctx.translate(x, y);
                // Shield
                if (shield > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(Date.now()/100)*0.2})`;
                    ctx.lineWidth = 3; ctx.stroke();
                }
                // Main Chassis
                ctx.fillStyle = '#0055ff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00aaff';
                ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(20, 15); ctx.lineTo(10, 15);
                ctx.lineTo(0, 5); ctx.lineTo(-10, 15); ctx.lineTo(-20, 15); ctx.closePath(); ctx.fill();
                // Armor Trim
                ctx.fillStyle = '#e6e6e6';
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(8, 10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
                // Engine Glow
                ctx.fillStyle = '#00ffff'; ctx.fillRect(-5, 15, 10, 5);
                ctx.restore();
            };

            const drawDecepticon = (ctx, x, y) => {
                ctx.save(); ctx.translate(x, y);
                ctx.fillStyle = '#8a00c2'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff00ff';
                ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(15, -15); ctx.lineTo(5, -10);
                ctx.lineTo(0, -20); ctx.lineTo(-5, -10); ctx.lineTo(-15, -15); ctx.closePath(); ctx.fill();
                // Cyber Optics (Eyes)
                ctx.fillStyle = '#ff0000'; ctx.shadowColor = '#ff0000';
                ctx.fillRect(-6, -2, 4, 4); ctx.fillRect(2, -2, 4, 4);
                ctx.restore();
            };

            // --- GAME LOOP ---
            const gameLoop = (timestamp) => {
                // Fixed: Check mutable state instead of stale React state
                if (!engine.isPlaying) return; 
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const dt = timestamp - engine.lastTime;
                engine.lastTime = timestamp;
                engine.frameCount++;

                // Clear & Draw Background
                ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Stars (Parallax)
                ctx.fillStyle = '#ffffff';
                engine.stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > canvas.height) s.y = 0;
                    ctx.globalAlpha = s.speed / 3;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
                ctx.globalAlpha = 1.0;

                // Player Movement
                if (engine.keys.up && engine.player.y > 20) engine.player.y -= engine.player.speed;
                if (engine.keys.down && engine.player.y < canvas.height - 20) engine.player.y += engine.player.speed;
                if (engine.keys.left && engine.player.x > 20) engine.player.x -= engine.player.speed;
                if (engine.keys.right && engine.player.x < canvas.width - 20) engine.player.x += engine.player.speed;

                // Shooting
                if (engine.keys.shoot && timestamp - engine.lastShot > 150) {
                    playSound('shoot');
                    engine.bullets.push({ x: engine.player.x, y: engine.player.y - 20, vx: 0, vy: -10, color: '#00ffff' });
                    if (engine.player.spread) {
                        engine.bullets.push({ x: engine.player.x, y: engine.player.y - 20, vx: -3, vy: -9, color: '#00ffff' });
                        engine.bullets.push({ x: engine.player.x, y: engine.player.y - 20, vx: 3, vy: -9, color: '#00ffff' });
                    }
                    engine.lastShot = timestamp;
                }

                // Update & Draw Bullets
                engine.bullets = engine.bullets.filter(b => b.y > 0 && b.y < canvas.height && b.x > 0 && b.x < canvas.width);
                engine.bullets.forEach(b => {
                    b.x += b.vx; b.y += b.vy;
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = 10; ctx.shadowColor = b.color;
                    ctx.fillRect(b.x - 2, b.y - 10, 4, 15);
                });
                ctx.shadowBlur = 0;

                // Enemy Spawning (Progressive Difficulty)
                if (engine.frameCount % Math.max(20, Math.floor(60 - engine.difficulty * 2)) === 0) {
                    engine.enemies.push({
                        x: Math.random() * (canvas.width - 40) + 20,
                        y: -30, hp: 1 + Math.floor(engine.difficulty/5),
                        vy: 2 + Math.random() * engine.difficulty * 0.5
                    });
                }

                // Powerup Spawning
                if (engine.frameCount % 500 === 0) {
                    engine.powerups.push({
                        x: Math.random() * canvas.width, y: -20, vy: 1.5,
                        type: Math.random() > 0.5 ? 'spread' : 'shield'
                    });
                }

                // Update & Draw Powerups
                engine.powerups.forEach((p, i) => {
                    p.y += p.vy;
                    ctx.fillStyle = p.type === 'spread' ? '#ffff00' : '#00ff00';
                    ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;

                    // Collision with player
                    if (Math.hypot(p.x - engine.player.x, p.y - engine.player.y) < 30) {
                        playSound('powerup');
                        if (p.type === 'spread') engine.player.spread = true;
                        if (p.type === 'shield') engine.player.shield = 3;
                        engine.powerups.splice(i, 1);
                    }
                });

                // Update & Draw Enemies & Check Collisions
                for (let i = engine.enemies.length - 1; i >= 0; i--) {
                    let e = engine.enemies[i];
                    e.y += e.vy;
                    drawDecepticon(ctx, e.x, e.y);

                    // Hit Player
                    if (Math.hypot(e.x - engine.player.x, e.y - engine.player.y) < 25) {
                        playSound('explode');
                        if (engine.player.shield > 0) {
                            engine.player.shield--;
                            engine.enemies.splice(i, 1);
                            createExplosion(e.x, e.y, '#8a00c2');
                        } else {
                            engine.isPlaying = false; // Stop loop
                            setGameState('gameover');
                            return; // Exit current frame
                        }
                    }

                    // Hit by Bullet
                    for (let j = engine.bullets.length - 1; j >= 0; j--) {
                        let b = engine.bullets[j];
                        if (Math.hypot(e.x - b.x, e.y - b.y) < 20) {
                            e.hp--;
                            engine.bullets.splice(j, 1);
                            if (e.hp <= 0) {
                                playSound('explode');
                                createExplosion(e.x, e.y, '#ff00ff');
                                engine.enemies.splice(i, 1);
                                setScore(s => {
                                    const newScore = s + 10;
                                    engine.difficulty = 1 + Math.floor(newScore / 100);
                                    return newScore;
                                });
                            }
                            break;
                        }
                    }
                    if (e.y > canvas.height + 30) engine.enemies.splice(i, 1);
                }

                // Update & Draw Particles
                engine.particles = engine.particles.filter(p => p.life > 0);
                engine.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.life -= 2;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life / 100);
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;

                // Draw Player
                drawAutobot(ctx, engine.player.x, engine.player.y, engine.player.shield);

                requestAnimationFrame(gameLoop);
            };

            const createExplosion = (x, y, color) => {
                for (let i = 0; i < 20; i++) {
                    engine.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                        life: 100, size: Math.random() * 4 + 2, color: Math.random() > 0.5 ? color : '#ffffff'
                    });
                }
            };

            // --- INITIALIZATION ---
            const startGame = () => {
                if (engine.isPlaying) return; // Prevent double-clicks
                const canvas = canvasRef.current;
                engine.player = { x: canvas.width / 2, y: canvas.height - 80, speed: 6, spread: false, shield: 0 };
                engine.bullets = []; engine.enemies = []; engine.particles = []; engine.powerups = [];
                engine.score = 0; engine.difficulty = 1; engine.frameCount = 0;
                
                engine.isPlaying = true; // Tell the game loop it is safe to run
                setScore(0);
                setGameState('playing');
                engine.lastTime = performance.now();
                requestAnimationFrame(gameLoop);
                
                // Audio Context requires user gesture to start
                if(audioCtx.state === 'suspended') audioCtx.resume();
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    // Init Stars
                    engine.stars = Array.from({length: 100}).map(() => ({
                        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                        speed: Math.random() * 2 + 0.5, size: Math.random() * 2
                    }));
                };
                window.addEventListener('resize', resize);
                resize();

                // Keyboard Listeners
                const handleKeyDown = (e) => {
                    if(e.code==='ArrowUp' || e.code==='KeyW') engine.keys.up = true;
                    if(e.code==='ArrowDown' || e.code==='KeyS') engine.keys.down = true;
                    if(e.code==='ArrowLeft' || e.code==='KeyA') engine.keys.left = true;
                    if(e.code==='ArrowRight' || e.code==='KeyD') engine.keys.right = true;
                    if(e.code==='Space') engine.keys.shoot = true;
                };
                const handleKeyUp = (e) => {
                    if(e.code==='ArrowUp' || e.code==='KeyW') engine.keys.up = false;
                    if(e.code==='ArrowDown' || e.code==='KeyS') engine.keys.down = false;
                    if(e.code==='ArrowLeft' || e.code==='KeyA') engine.keys.left = false;
                    if(e.code==='ArrowRight' || e.code==='KeyD') engine.keys.right = false;
                    if(e.code==='Space') engine.keys.shoot = false;
                };
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    window.removeEventListener('resize', resize);
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                    engine.isPlaying = false; // cleanup loop
                };
            }, []);

            // Mobile Button Handlers
            const ctrlStart = (key) => (e) => { e.preventDefault(); engine.keys[key] = true; };
            const ctrlEnd = (key) => (e) => { e.preventDefault(); engine.keys[key] = false; };

            return (
                <div className="relative w-screen h-screen bg-black overflow-hidden font-mono text-white select-none">
                    <canvas ref={canvasRef} className="absolute inset-0 block"></canvas>
                    
                    {/* UI OVERLAY */}
                    <div className="absolute top-4 left-4 z-30 text-xl font-bold cyber-text pointer-events-none">
                        SCORE: {score}
                    </div>

                    {/* MENU & GAME OVER SCREENS */}
                    {gameState !== 'playing' && (
                        <div className="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm">
                            <h1 className="text-5xl md:text-7xl font-black italic mb-2 cyber-text text-center text-cyan-400">
                                MECHA STRIKE
                            </h1>
                            <p className="text-purple-400 mb-8 tracking-[0.3em] font-bold">TRANSFORMER PROTOCOL</p>
                            
                            {gameState === 'gameover' && (
                                <div className="text-3xl text-red-500 font-bold mb-8 animate-pulse text-center">
                                    MISSION FAILED<br/>FINAL SCORE: {score}
                                </div>
                            )}

                            <button 
                                onClick={startGame}
                                className="px-8 py-4 bg-cyan-600/20 border-2 border-cyan-400 text-cyan-400 text-2xl font-bold rounded-lg btn-cyber hover:bg-cyan-600/40 cursor-pointer"
                            >
                                {gameState === 'menu' ? 'INITIALIZE COMBAT' : 'REBOOT SYSTEM'}
                            </button>

                            <div className="mt-12 text-gray-400 text-center max-w-md px-4">
                                <p className="mb-2"><strong className="text-white">PC:</strong> WASD/Arrows to Move. SPACE to Fire.</p>
                                <p><strong className="text-white">Mobile:</strong> Use On-Screen Controls.</p>
                            </div>
                        </div>
                    )}

                    {/* MOBILE TOUCH CONTROLS (Visible always to act as dual-control, best for touch devices) */}
                    <div className="absolute bottom-8 left-0 right-0 z-10 flex justify-between px-8 pointer-events-none md:hidden">
                        {/* D-PAD */}
                        <div className="grid grid-cols-3 grid-rows-3 gap-2 w-40 h-40 pointer-events-auto opacity-70">
                            <div />
                            <button className="bg-white/10 border border-cyan-500/50 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-2xl"
                                onTouchStart={ctrlStart('up')} onTouchEnd={ctrlEnd('up')} onMouseDown={ctrlStart('up')} onMouseUp={ctrlEnd('up')}>▲</button>
                            <div />
                            <button className="bg-white/10 border border-cyan-500/50 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-2xl"
                                onTouchStart={ctrlStart('left')} onTouchEnd={ctrlEnd('left')} onMouseDown={ctrlStart('left')} onMouseUp={ctrlEnd('left')}>◀</button>
                            <div className="bg-white/5 rounded-lg" />
                            <button className="bg-white/10 border border-cyan-500/50 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-2xl"
                                onTouchStart={ctrlStart('right')} onTouchEnd={ctrlEnd('right')} onMouseDown={ctrlStart('right')} onMouseUp={ctrlEnd('right')}>▶</button>
                            <div />
                            <button className="bg-white/10 border border-cyan-500/50 rounded-lg active:bg-cyan-500/50 flex items-center justify-center text-2xl"
                                onTouchStart={ctrlStart('down')} onTouchEnd={ctrlEnd('down')} onMouseDown={ctrlStart('down')} onMouseUp={ctrlEnd('down')}>▼</button>
                            <div />
                        </div>

                        {/* FIRE BUTTON */}
                        <div className="flex items-end pointer-events-auto opacity-80 pb-4">
                            <button 
                                className="w-24 h-24 bg-red-500/20 border-4 border-red-500 rounded-full active:bg-red-500/60 shadow-[0_0_15px_rgba(255,0,0,0.5)] flex items-center justify-center font-bold text-red-100"
                                onTouchStart={ctrlStart('shoot')} onTouchEnd={ctrlEnd('shoot')} onMouseDown={ctrlStart('shoot')} onMouseUp={ctrlEnd('shoot')}
                            >
                                FIRE
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
